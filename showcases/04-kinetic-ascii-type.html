<!DOCTYPE html>
<html lang="en" data-palette="paper">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Kinetic ASCII Type Studio — Specimen 04</title>
<style>
  :root {
    --bg: #F4F1EA;
    --fg: #0E0D0B;
    --fg-2: #443F36;
    --fg-muted: #6E675A;
    --chrome-bg: rgba(244, 241, 234, 0.86);
    --chrome-border: rgba(68, 63, 54, 0.22);
    --chrome-sep: rgba(68, 63, 54, 0.16);
    --pill-active-bg: #0E0D0B;
    --pill-active-fg: #F4F1EA;
    --pill-hover: rgba(14, 13, 11, 0.075);
    --input-bg: rgba(228, 223, 211, 0.55);
    --shadow: 0 8px 28px rgba(14, 13, 11, 0.08);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  html[data-palette="glacier"] {
    --bg: #05070D;
    --fg: #F4F8FF;
    --fg-2: #A9C4F4;
    --fg-muted: #6F98E8;
    --chrome-bg: rgba(12, 26, 54, 0.80);
    --chrome-border: rgba(169, 196, 244, 0.24);
    --chrome-sep: rgba(169, 196, 244, 0.16);
    --pill-active-bg: #F4F8FF;
    --pill-active-fg: #05070D;
    --pill-hover: rgba(169, 196, 244, 0.13);
    --input-bg: rgba(26, 46, 89, 0.55);
    --shadow: 0 10px 32px rgba(5, 7, 13, 0.45);
  }

  html[data-palette="amber"] {
    --bg: #070608;
    --fg: #FFF3DC;
    --fg-2: #EDA958;
    --fg-muted: #C4732B;
    --chrome-bg: rgba(22, 17, 14, 0.82);
    --chrome-border: rgba(237, 169, 88, 0.24);
    --chrome-sep: rgba(237, 169, 88, 0.16);
    --pill-active-bg: #FFF3DC;
    --pill-active-fg: #070608;
    --pill-hover: rgba(237, 169, 88, 0.14);
    --input-bg: rgba(44, 29, 20, 0.62);
    --shadow: 0 10px 32px rgba(7, 6, 8, 0.50);
  }

  html[data-palette="phosphor"] {
    --bg: #050A07;
    --fg: #E4FFEB;
    --fg-2: #8BE3A2;
    --fg-muted: #4CB86E;
    --chrome-bg: rgba(11, 28, 17, 0.82);
    --chrome-border: rgba(139, 227, 162, 0.24);
    --chrome-sep: rgba(139, 227, 162, 0.16);
    --pill-active-bg: #E4FFEB;
    --pill-active-fg: #050A07;
    --pill-hover: rgba(139, 227, 162, 0.14);
    --input-bg: rgba(19, 51, 30, 0.60);
    --shadow: 0 10px 32px rgba(5, 10, 7, 0.50);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    transition: background-color 180ms ease, color 180ms ease;
    user-select: none;
  }

  #stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    image-rendering: pixelated;
    cursor: crosshair;
    touch-action: none;
  }

  /* Quiet Editorial Top Bar */
  .masthead {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    padding: 20px 28px 0;
    pointer-events: none;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--fg-muted);
    line-height: 1.3;
  }

  .title {
    margin: 0;
    font-family: var(--sans);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--fg);
    line-height: 1.25;
  }

  .telemetry {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--fg-muted);
    text-align: right;
    line-height: 1.45;
    white-space: nowrap;
  }

  .telemetry strong {
    color: var(--fg-2);
    font-weight: 600;
  }

  /* Stepped 4x4 Bayer Mask Reveal (--dz1..--dz7) */
  @keyframes dz {
    0%   { opacity: 0; }
    5%   { opacity: 1; -webkit-mask-image: var(--dz1); mask-image: var(--dz1); }
    18%  { opacity: 1; -webkit-mask-image: var(--dz2); mask-image: var(--dz2); }
    31%  { opacity: 1; -webkit-mask-image: var(--dz3); mask-image: var(--dz3); }
    44%  { opacity: 1; -webkit-mask-image: var(--dz4); mask-image: var(--dz4); }
    57%  { opacity: 1; -webkit-mask-image: var(--dz5); mask-image: var(--dz5); }
    70%  { opacity: 1; -webkit-mask-image: var(--dz6); mask-image: var(--dz6); }
    83%  { opacity: 1; -webkit-mask-image: var(--dz7); mask-image: var(--dz7); }
    100% { opacity: 1; -webkit-mask-image: none; mask-image: none; }
  }

  @keyframes dzr {
    from { transform: translateY(0.14em); }
    to   { transform: translateY(0); }
  }

  .kin .w {
    display: inline-block;
    opacity: 0;
    padding-block: 0.22em;
    margin-block: -0.22em;
    -webkit-mask-size: var(--dzs, 12px) var(--dzs, 12px);
    mask-size: var(--dzs, 12px) var(--dzs, 12px);
  }

  .kin.in .w {
    opacity: 1;
    animation: dz 480ms step-end both, dzr 680ms cubic-bezier(0.16, 1, 0.3, 1) both;
    animation-delay: calc(var(--bd, 0ms) + var(--i, 0) * 38ms);
  }

  @media (prefers-reduced-motion: reduce) {
    .kin .w, .kin.in .w {
      opacity: 1;
      animation: none;
      -webkit-mask-image: none;
      mask-image: none;
      transform: none;
    }
  }

  /* Quiet Floating Studio Dock */
  .dock-wrap {
    position: fixed;
    left: 0;
    right: 0;
    bottom: max(18px, env(safe-area-inset-bottom, 18px));
    z-index: 20;
    display: flex;
    justify-content: center;
    padding: 0 14px;
    pointer-events: none;
  }

  .dock {
    pointer-events: auto;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    max-width: min(980px, calc(100vw - 24px));
    padding: 6px 8px;
    border-radius: 14px;
    background: var(--chrome-bg);
    border: 1px solid var(--chrome-border);
    box-shadow: var(--shadow);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: background-color 180ms ease, border-color 180ms ease;
  }

  .dock-group {
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }

  .dock-sep {
    width: 1px;
    height: 18px;
    background: var(--chrome-sep);
    margin: 0 3px;
    flex-shrink: 0;
  }

  .btn {
    appearance: none;
    border: 1px solid transparent;
    background: transparent;
    color: var(--fg-2);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    line-height: 1;
    padding: 7px 9px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
  }

  .btn:hover {
    background: var(--pill-hover);
    color: var(--fg);
  }

  .btn.active {
    background: var(--pill-active-bg);
    color: var(--pill-active-fg);
  }

  .btn:focus-visible,
  .word-input:focus-visible {
    outline: 2px solid var(--fg);
    outline-offset: 1px;
  }

  .word-input {
    width: 96px;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid var(--chrome-border);
    background: var(--input-bg);
    color: var(--fg);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    line-height: 1.1;
    user-select: text;
    transition: border-color 140ms ease, background-color 140ms ease, color 140ms ease;
  }

  .word-input::placeholder {
    color: var(--fg-muted);
    font-weight: 400;
    letter-spacing: 0.04em;
  }

  .swatch-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 8px;
  }

  .swatch-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    border: 1px solid currentColor;
    flex-shrink: 0;
  }

  .swatch-paper    { background: linear-gradient(135deg, #F4F1EA 48%, #0E0D0B 52%); }
  .swatch-glacier  { background: linear-gradient(135deg, #0C1A36 48%, #A9C4F4 52%); }
  .swatch-amber    { background: linear-gradient(135deg, #16110E 48%, #EDA958 52%); }
  .swatch-phosphor { background: linear-gradient(135deg, #0B1C11 48%, #8BE3A2 52%); }

  @media (max-width: 780px) {
    .masthead {
      padding: 14px 16px 0;
      gap: 8px;
    }
    .eyebrow {
      font-size: 9px;
      letter-spacing: 0.065em;
      white-space: nowrap;
    }
    .title {
      font-size: 14px;
    }
    .telemetry {
      font-size: 9px;
      letter-spacing: 0.04em;
    }
    .dock-wrap {
      bottom: max(12px, env(safe-area-inset-bottom, 12px));
      padding: 0 10px;
    }
    .dock {
      gap: 4px;
      padding: 6px;
      border-radius: 12px;
      max-width: calc(100vw - 20px);
    }
    .dock-sep {
      display: none;
    }
    .btn {
      font-size: 10px;
      padding: 6px 7px;
    }
    .swatch-btn .swatch-lbl {
      display: none;
    }
    .swatch-btn {
      padding: 6px 7px;
    }
    .word-input {
      width: 78px;
      font-size: 10px;
      padding: 5px 6px;
    }
  }
</style>
</head>
<body>
  <canvas id="stage" aria-label="Kinetic typography and morphing ASCII emblem canvas"></canvas>

  <header class="masthead" aria-label="Specimen header">
    <div class="brand">
      <div class="eyebrow kin" data-bd="0">SPECIMEN 04 · LETTERPRESS MATRIX</div>
      <h1 class="title kin" data-bd="80">Kinetic ASCII Type Studio</h1>
    </div>
    <div class="telemetry kin" data-bd="140" id="telemetry" aria-live="polite">
      <span id="tel-grid">132×48 CELLS</span><br />
      <strong id="tel-mode">EDITORIAL PAPER · ASCII</strong>
    </div>
  </header>

  <nav class="dock-wrap" aria-label="Studio controls">
    <div class="dock" id="dock">
      <div class="dock-group" role="group" aria-label="Wordmark and emblem presets">
        <button class="btn active" type="button" data-preset="ARIA">ARIA</button>
        <button class="btn" type="button" data-preset="ORBIT">ORBIT</button>
        <button class="btn" type="button" data-preset="GLYPH">GLYPH</button>
        <button class="btn" type="button" data-preset="emblem">SOLAR EMBLEM</button>
      </div>

      <span class="dock-sep" aria-hidden="true"></span>

      <div class="dock-group">
        <input
          id="custom-word"
          class="word-input"
          type="text"
          maxlength="10"
          autocomplete="off"
          spellcheck="false"
          placeholder="TYPE WORD"
          aria-label="Custom wordmark text (1 to 10 characters)"
        />
      </div>

      <span class="dock-sep" aria-hidden="true"></span>

      <div class="dock-group" role="group" aria-label="Color palette">
        <button class="btn swatch-btn active" type="button" data-palette="paper" title="Editorial Paper &amp; Ink" aria-label="Editorial Paper palette">
          <span class="swatch-dot swatch-paper" aria-hidden="true"></span><span class="swatch-lbl">Paper</span>
        </button>
        <button class="btn swatch-btn" type="button" data-palette="glacier" title="Glacier Night" aria-label="Glacier Night palette">
          <span class="swatch-dot swatch-glacier" aria-hidden="true"></span><span class="swatch-lbl">Glacier</span>
        </button>
        <button class="btn swatch-btn" type="button" data-palette="amber" title="Obsidian Amber" aria-label="Obsidian Amber palette">
          <span class="swatch-dot swatch-amber" aria-hidden="true"></span><span class="swatch-lbl">Amber</span>
        </button>
        <button class="btn swatch-btn" type="button" data-palette="phosphor" title="Phosphor Instrument" aria-label="Phosphor Instrument palette">
          <span class="swatch-dot swatch-phosphor" aria-hidden="true"></span><span class="swatch-lbl">Phosphor</span>
        </button>
      </div>

      <span class="dock-sep" aria-hidden="true"></span>

      <div class="dock-group" role="group" aria-label="Render mode">
        <button class="btn active" type="button" data-render="ascii">ASCII</button>
        <button class="btn" type="button" data-render="bayer">BAYER</button>
      </div>
    </div>
  </nav>

<script>
(() => {
  'use strict';

  // --- Curated 8-Step OKLab Tone Ladders (Index 0 = ground .. 7 = peak ink/highlight) ---
  const PALETTES = {
    paper: {
      name: 'EDITORIAL PAPER',
      tones: ['#F4F1EA', '#E4DFD3', '#C9C2B2', '#9F9786', '#6E675A', '#443F36', '#23201B', '#0E0D0B'],
    },
    glacier: {
      name: 'GLACIER NIGHT',
      tones: ['#05070D', '#0C1A36', '#1A2E59', '#2A4A8C', '#3F6CC9', '#6F98E8', '#A9C4F4', '#F4F8FF'],
    },
    amber: {
      name: 'OBSIDIAN AMBER',
      tones: ['#070608', '#16110E', '#2C1D14', '#52311B', '#874B20', '#C4732B', '#EDA958', '#FFF3DC'],
    },
    phosphor: {
      name: 'PHOSPHOR',
      tones: ['#050A07', '#0B1C11', '#13331E', '#1E5430', '#2D8249', '#4CB86E', '#8BE3A2', '#E4FFEB'],
    },
  };

  // Ordered 4x4 Bayer Matrix (0..15 -> normalized thresholds)
  const BAYER_RAW = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const BAYER = new Float32Array(16);
  for (let i = 0; i < 16; i++) BAYER[i] = (BAYER_RAW[i] + 0.5) / 16;

  // Calibrated Optical-Density Ramp (0..9) + Structural Scramble Glyphs
  const RAMP_CHARS = [' ', '.', ',', ':', '=', '-', '+', '*', '#', '%'];
  const SCRAMBLE_CHARS = ['/', ':', '=', '+', '*', '#', '%'];
  const GRID_CHARS = ['·', ':', '+', '-'];
  const ALL_GLYPHS = [...RAMP_CHARS, '/', '·'];
  const IDX_SLASH = RAMP_CHARS.length;
  const IDX_MIDDOT = RAMP_CHARS.length + 1;
  const SCRAMBLE_IDX = [IDX_SLASH, 3, 4, 6, 7, 8, 9];
  const GRID_IDX = [IDX_MIDDOT, 3, 6, 5];
  const RAMP_THRESH = [0.55, 1.35, 2.2, 3.3, 4.35, 5.15, 5.75, 6.22, 6.62];

  const MAX_PIXELS = 3840 * 2400;
  const MONO_STACK = 'ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace';
  const DISPLAY_STACK = '"Arial Black", "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Inter", Arial, sans-serif';

  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d', { alpha: false });
  const offCanvas = document.createElement('canvas');
  const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

  const telGrid = document.getElementById('tel-grid');
  const telMode = document.getElementById('tel-mode');
  const customInput = document.getElementById('custom-word');
  const dockEl = document.getElementById('dock');

  const rmQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  let reducedMotion = rmQuery.matches;

  // --- Deterministic Integer Hash & Smooth 2D Value Noise (Zero Math.random) ---
  function hash2i(x, y) {
    let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  function hash3i(x, y, z) {
    let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(z | 0, 2147483647);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  function vnoise(x, y) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = x - ix, fy = y - iy;
    const ux = fx * fx * (3 - 2 * fx);
    const uy = fy * fy * (3 - 2 * fy);
    const a = hash2i(ix, iy), b = hash2i(ix + 1, iy);
    const c = hash2i(ix, iy + 1), d = hash2i(ix + 1, iy + 1);
    return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
  }

  function clamp(v, lo, hi) {
    return v < lo ? lo : v > hi ? hi : v;
  }

  function smoothstep(e0, e1, x) {
    const t = clamp((x - e0) / (e1 - e0), 0, 1);
    return t * t * (3 - 2 * t);
  }

  // --- Stepped 4x4 Bayer Reveal Setup (--dz1..--dz7) ---
  function buildDitherTiles(cell) {
    const cSize = Math.max(2, Math.round(cell || 3));
    const u = cSize * Math.min(3, Math.ceil(window.devicePixelRatio || 1));
    const cv = document.createElement('canvas');
    cv.width = cv.height = u * 4;
    const g = cv.getContext('2d');
    const root = document.documentElement.style;
    g.fillStyle = '#fff';
    for (let k = 1; k <= 7; k++) {
      g.clearRect(0, 0, u * 4, u * 4);
      for (let i = 0; i < 16; i++) {
        if (BAYER[i] < k / 8) g.fillRect((i & 3) * u, (i >> 2) * u, u, u);
      }
      root.setProperty('--dz' + k, `url(${cv.toDataURL()})`);
    }
    root.setProperty('--dzs', cSize * 4 + 'px');
  }

  function prepareKineticText() {
    const nodes = document.querySelectorAll('.kin');
    nodes.forEach((el) => {
      const bd = Number(el.dataset.bd || 0);
      el.style.setProperty('--bd', bd + 'ms');
      let wordIdx = 0;
      const walk = (parent) => {
        const children = [...parent.childNodes];
        for (const node of children) {
          if (node.nodeType === 3) {
            const parts = node.textContent.split(/(\s+)/);
            const frag = document.createDocumentFragment();
            for (const part of parts) {
              if (!part) continue;
              if (/^\s+$/.test(part)) {
                frag.appendChild(document.createTextNode(part));
              } else {
                const span = document.createElement('span');
                span.className = 'w';
                span.style.setProperty('--i', String(wordIdx++));
                span.textContent = part;
                frag.appendChild(span);
              }
            }
            parent.replaceChild(frag, node);
          } else if (node.nodeType === 1 && node.tagName !== 'BR') {
            walk(node);
          }
        }
      };
      walk(el);
    });
    requestAnimationFrame(() => {
      document.querySelectorAll('.kin').forEach((el) => el.classList.add('in'));
    });
  }

  // --- Studio State ---
  let activePaletteKey = 'paper';
  let activeRenderMode = 'ascii'; // 'ascii' | 'bayer'
  let activePreset = 'ARIA';      // 'ARIA' | 'ORBIT' | 'GLYPH' | 'emblem' | 'custom'
  let customText = '';

  // Unified Grid Metrics
  let vw = 1440, vh = 900, dpr = 1;
  let fontSize = 16;
  let cellW = 10, cellH = 19;
  let cols = 144, rows = 48, cellCount = 0;
  let gridOriginX = 0, gridOriginY = 0;

  // Zero-GC Cell State Buffers
  let targetDensity, targetCrown, targetEdge;
  let prevDensity, prevCrown, prevEdge;
  let density, crown, edge;
  let dx, dy, vx, vy, energy;

  // Tone-Bucketed Render Buffers (tones 1..7)
  const MAX_BUCKET_CAP = 120000;
  const bLen = new Int32Array(8);
  const bX = Array.from({ length: 8 }, () => new Float32Array(MAX_BUCKET_CAP));
  const bY = Array.from({ length: 8 }, () => new Float32Array(MAX_BUCKET_CAP));
  const bW = Array.from({ length: 8 }, () => new Float32Array(MAX_BUCKET_CAP));
  const bH = Array.from({ length: 8 }, () => new Float32Array(MAX_BUCKET_CAP));
  const bG = Array.from({ length: 8 }, () => new Uint8Array(MAX_BUCKET_CAP));

  // Morph & Clock State
  let simTime = 0;
  let morphActive = false;
  let morphClock = 0;
  const MORPH_SWEEP_DUR = 0.34;
  const MORPH_TAIL_DUR = 0.22;

  // Pointer & Shockwave State
  const ptr = {
    rawX: -9999, rawY: -9999,
    x: -9999, y: -9999,
    vx: 0, vy: 0,
    active: 0, targetActive: 0,
    dragging: false,
    lastDragWaveX: 0, lastDragWaveY: 0,
  };

  const MAX_WAVES = 8;
  const waves = Array.from({ length: MAX_WAVES }, () => ({
    active: false, x: 0, y: 0, age: 0, maxAge: 1.2, speed: 460, strength: 1.0,
  }));
  let waveCursor = 0;

  function spawnShockwave(x, y, strength = 1.0, speed = 460, maxAge = 1.25) {
    if (reducedMotion) return;
    const w = waves[waveCursor];
    waveCursor = (waveCursor + 1) % MAX_WAVES;
    w.active = true;
    w.x = x;
    w.y = y;
    w.age = 0;
    w.maxAge = maxAge;
    w.speed = speed;
    w.strength = strength;
  }

  // --- Grid Allocation & Resize ---
  function allocateGrid() {
    cellCount = cols * rows;
    targetDensity = new Float32Array(cellCount);
    targetCrown = new Float32Array(cellCount);
    targetEdge = new Float32Array(cellCount);
    prevDensity = new Float32Array(cellCount);
    prevCrown = new Float32Array(cellCount);
    prevEdge = new Float32Array(cellCount);
    density = new Float32Array(cellCount);
    crown = new Float32Array(cellCount);
    edge = new Float32Array(cellCount);
    dx = new Float32Array(cellCount);
    dy = new Float32Array(cellCount);
    vx = new Float32Array(cellCount);
    vy = new Float32Array(cellCount);
    energy = new Float32Array(cellCount);
  }

  function updateTelemetry() {
    const palName = PALETTES[activePaletteKey].name;
    const modeName = activeRenderMode === 'bayer' ? 'BAYER 4×4' : 'ASCII';
    telGrid.textContent = `${cols}×${rows} CELLS`;
    telMode.textContent = `${palName} · ${modeName}`;
  }

  function resize(isInitial = false) {
    vw = Math.max(320, window.innerWidth);
    vh = Math.max(320, window.innerHeight);
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    while (vw * dpr * vh * dpr > MAX_PIXELS && dpr > 1) dpr *= 0.9;

    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    canvas.style.width = vw + 'px';
    canvas.style.height = vh + 'px';

    // Target 125-140 cols on desktop, 60-66 cols on 390px mobile
    const targetCols = vw < 600 ? 64 : vw < 1024 ? 96 : 132;
    fontSize = Math.max(9, Math.min(20, Math.round((vw / targetCols) / 0.605)));

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = `600 ${fontSize}px ${MONO_STACK}`;
    const measuredW = ctx.measureText('M').width;

    // Integer-aligned cell dimensions in CSS & device pixels
    cellW = Math.max(5, Math.round(measuredW));
    cellH = Math.max(10, Math.round(fontSize * 1.16));
    cols = Math.ceil(vw / cellW);
    rows = Math.ceil(vh / cellH);
    gridOriginX = Math.floor((vw - cols * cellW) * 0.5);
    gridOriginY = Math.floor((vh - rows * cellH) * 0.5);

    buildDitherTiles(Math.max(2, Math.round(cellW / 3)));
    allocateGrid();
    updateTelemetry();

    sampleCurrentTarget(isInitial && !reducedMotion);
    if (reducedMotion) {
      snapToTarget();
      renderFrame();
    }
  }

  // --- Offscreen Target Rasterizer (Typography + Procedural Solar Emblem) ---
  function computeEdgesAndCrown(minR, maxR, crownDrop = 0.40) {
    const spanR = Math.max(1, maxR - minR);
    for (let r = 0; r < rows; r++) {
      const rowOff = r * cols;
      const uRaw = clamp((r - minR) / spanR, 0, 1);
      for (let c = 0; c < cols; c++) {
        const i = rowOff + c;
        const d = targetDensity[i];
        if (d <= 0.01) {
          targetCrown[i] = 0;
          targetEdge[i] = 0;
          continue;
        }
        // Subtle organic vertical crown shading (top ink-rich -> bottom delicately feathered)
        const n = (vnoise(c / 7.5, r / 5.0) - 0.5) * 0.22 * Math.sin(Math.PI * uRaw);
        const u = clamp(uRaw + n, 0, 1);
        targetCrown[i] = Math.pow(1 - u * crownDrop, 1.12);

        const dl = c > 0 ? targetDensity[i - 1] : 0;
        const dr = c < cols - 1 ? targetDensity[i + 1] : 0;
        const du = r > 0 ? targetDensity[i - cols] : 0;
        const dd = r < rows - 1 ? targetDensity[i + cols] : 0;
        const gx = Math.abs(dr - dl);
        const gy = Math.abs(dd - du);
        targetEdge[i] = clamp(Math.hypot(gx, gy) * 0.85, 0, 1);
      }
    }
  }

  function rasterizeWord(word) {
    const clean = (word || 'ARIA').trim().toUpperCase().slice(0, 10) || 'ARIA';
    const isMobile = vw < 600;

    // Safe vertical band clear of masthead and floating dock
    const safeTop = isMobile ? 74 : 88;
    const safeBottom = isMobile ? vh - 126 : vh - 102;
    const safeH = Math.max(120, safeBottom - safeTop);
    const centerY = safeTop + safeH * 0.49;

    // Split long custom words onto 2 lines on narrow mobile so strokes stay thick and crisp
    let lines = [clean];
    if (isMobile && clean.length >= 7) {
      const mid = Math.ceil(clean.length / 2);
      lines = [clean.slice(0, mid), clean.slice(mid)];
    }

    // Proportional offscreen canvas in true CSS aspect ratio (zero stretching!)
    const scale = isMobile ? 1.0 : 0.5;
    const ow = Math.max(64, Math.round(vw * scale));
    const oh = Math.max(64, Math.round(vh * scale));
    if (offCanvas.width !== ow || offCanvas.height !== oh) {
      offCanvas.width = ow;
      offCanvas.height = oh;
    }

    offCtx.clearRect(0, 0, ow, oh);
    offCtx.fillStyle = '#fff';
    offCtx.textAlign = 'center';
    offCtx.textBaseline = 'middle';

    // Auto-fit bold display size within safe horizontal & vertical envelope
    const maxW = ow * (isMobile ? 0.86 : 0.78);
    const maxLineH = (safeH * scale) * (lines.length === 1 ? 0.56 : 0.38);
    const longest = lines.reduce((a, b) => (a.length >= b.length ? a : b), '');

    let testSize = Math.round(maxLineH * 1.15);
    offCtx.font = `900 ${testSize}px ${DISPLAY_STACK}`;
    // Measure with wide tracking for letterpress monumentality
    const trackingRatio = longest.length <= 5 ? 0.06 : 0.03;
    const measureTracked = (txt, sz) => {
      offCtx.font = `900 ${sz}px ${DISPLAY_STACK}`;
      const baseW = offCtx.measureText(txt).width;
      return baseW + Math.max(0, txt.length - 1) * sz * trackingRatio;
    };

    let measured = measureTracked(longest, testSize);
    if (measured > maxW) {
      testSize = Math.floor(testSize * (maxW / measured));
    }
    testSize = Math.max(24, Math.min(Math.round(maxLineH * 1.25), testSize));
    offCtx.font = `900 ${testSize}px ${DISPLAY_STACK}`;

    const drawTrackedLine = (txt, cy) => {
      const track = testSize * trackingRatio;
      const chars = [...txt];
      const widths = chars.map((ch) => offCtx.measureText(ch).width);
      const totalW = widths.reduce((a, b) => a + b, 0) + Math.max(0, chars.length - 1) * track;
      let cursor = ow * 0.5 - totalW * 0.5;
      offCtx.save();
      // Condensed editorial poster stature on portrait mobile for sharp letter counters
      if (isMobile) {
        offCtx.translate(0, cy);
        offCtx.scale(1, 1.34);
        offCtx.translate(0, -cy);
      }
      offCtx.textAlign = 'left';
      for (let i = 0; i < chars.length; i++) {
        offCtx.fillText(chars[i], cursor, cy);
        cursor += widths[i] + track;
      }
      offCtx.restore();
    };

    const lineGap = testSize * (isMobile ? 1.24 : 0.94);
    const baseCY = centerY * scale - ((lines.length - 1) * lineGap) * 0.5;
    for (let li = 0; li < lines.length; li++) {
      drawTrackedLine(lines[li], baseCY + li * lineGap);
    }

    const img = offCtx.getImageData(0, 0, ow, oh).data;
    let minR = rows, maxR = 0;

    for (let r = 0; r < rows; r++) {
      const y0 = clamp(Math.floor((gridOriginY + r * cellH) * scale), 0, oh - 1);
      const y1 = clamp(Math.ceil((gridOriginY + (r + 1) * cellH) * scale), y0 + 1, oh);
      const rowOff = r * cols;
      for (let c = 0; c < cols; c++) {
        const x0 = clamp(Math.floor((gridOriginX + c * cellW) * scale), 0, ow - 1);
        const x1 = clamp(Math.ceil((gridOriginX + (c + 1) * cellW) * scale), x0 + 1, ow);
        let sum = 0, cnt = 0;
        for (let py = y0; py < y1; py++) {
          const pRow = py * ow;
          for (let px = x0; px < x1; px++) {
            sum += img[(pRow + px) * 4 + 3];
            cnt++;
          }
        }
        const cov = cnt > 0 ? sum / (cnt * 255) : 0;
        const val = cov > 0.13 ? smoothstep(0.13, 0.72, cov) : 0;
        targetDensity[rowOff + c] = val;
        if (val > 0.12) {
          if (r < minR) minR = r;
          if (r > maxR) maxR = r;
        }
      }
    }
    if (minR > maxR) { minR = 0; maxR = rows - 1; }
    computeEdgesAndCrown(minR, maxR, 0.36);
  }

  // Analytical isotropic procedural Solar Emblem (100% circular, rings + diamond + crosshairs)
  function rasterizeSolarEmblem() {
    const isMobile = vw < 600;
    const safeTop = isMobile ? 76 : 86;
    const safeBottom = isMobile ? vh - 128 : vh - 102;
    const safeH = Math.max(140, safeBottom - safeTop);
    const cx = vw * 0.5;
    const cy = safeTop + safeH * 0.5;
    const R = Math.min(vw * 0.40, safeH * 0.43);

    let minR = rows, maxR = 0;

    // 3x3 sub-cell supersampling in true CSS pixel space for crisp isotropic circles
    const subOffsets = [-0.33, 0, 0.33];

    for (let r = 0; r < rows; r++) {
      const rowOff = r * cols;
      const baseY = gridOriginY + (r + 0.5) * cellH;
      for (let c = 0; c < cols; c++) {
        const baseX = gridOriginX + (c + 0.5) * cellW;
        let accum = 0;

        for (let sy = 0; sy < 3; sy++) {
          const py = (baseY + subOffsets[sy] * cellH - cy) / R;
          const ay = Math.abs(py);
          for (let sx = 0; sx < 3; sx++) {
            const px = (baseX + subOffsets[sx] * cellW - cx) / R;
            const ax = Math.abs(px);
            const rad = Math.hypot(px, py);
            const ang = Math.atan2(py, px);
            const l1 = ax + ay; // Inscribed architectural diamond

            let v = 0;

            // 1. Outer precision ring with subtle cardinal reticle breaks
            const nearCardinal = (ax < 0.055 && ay > 0.5) || (ay < 0.055 && ax > 0.5);
            if (!nearCardinal) {
              const outerRing = 1 - smoothstep(0.036, 0.066, Math.abs(rad - 0.94));
              v = Math.max(v, outerRing * 1.0);
            }

            // 2. Vernier degree ticks between outer and equatorial rings (24 ticks)
            if (rad >= 0.75 && rad <= 0.87) {
              const sector = Math.abs(((ang / (Math.PI / 12)) + 24.5) % 1 - 0.5) * 2;
              const isMajor = Math.abs(((ang / (Math.PI / 4)) + 8.5) % 1 - 0.5) < 0.15;
              const tickW = isMajor ? 0.25 : 0.13;
              if (sector < tickW && (isMajor || rad >= 0.79)) {
                v = Math.max(v, isMajor ? 0.92 : 0.62);
              }
            }

            // 3. Equatorial ring
            const eqRing = 1 - smoothstep(0.030, 0.056, Math.abs(rad - 0.68));
            v = Math.max(v, eqRing * 0.96);

            // 4. Inscribed rotated diamond (rhombus tangent to equatorial ring)
            const diamond = 1 - smoothstep(0.036, 0.068, Math.abs(l1 - 0.68));
            v = Math.max(v, diamond * 1.0);

            // 5. Inner orbital ring
            const innerRing = 1 - smoothstep(0.028, 0.052, Math.abs(rad - 0.34));
            v = Math.max(v, innerRing * 0.92);

            // 6. Central solar core disc
            const core = 1 - smoothstep(0.17, 0.22, rad);
            v = Math.max(v, core * 1.0);

            // 7. Cardinal crosshairs extending beyond outer ring (thick enough to span a cell cleanly)
            const horizHair = (ay < 0.036 && ax >= 0.35 && ax <= 1.12) ? (1 - smoothstep(0.020, 0.036, ay)) : 0;
            const vertHair = (ax < 0.030 && ay >= 0.35 && ay <= 1.12) ? (1 - smoothstep(0.016, 0.030, ax)) : 0;
            v = Math.max(v, horizHair * 0.98, vertHair * 0.98);

            // 8. Fine diagonal architectural sightlines inside outer ring
            const diagDist = Math.abs(ax - ay) * 0.7071;
            if (rad >= 0.43 && rad <= 0.64 && diagDist < 0.026) {
              v = Math.max(v, (1 - smoothstep(0.012, 0.026, diagDist)) * 0.76);
            }

            // 9. Four outer registration corner brackets
            if (ax >= 0.85 && ax <= 1.06 && ay >= 0.85 && ay <= 1.06) {
              const bx = Math.abs(ax - 1.04);
              const by = Math.abs(ay - 1.04);
              if (bx < 0.030 || by < 0.030) v = Math.max(v, 0.86);
            }

            accum += v;
          }
        }

        const val = accum / 9;
        targetDensity[rowOff + c] = val > 0.08 ? smoothstep(0.08, 0.68, val) : 0;
        if (val > 0.12) {
          if (r < minR) minR = r;
          if (r > maxR) maxR = r;
        }
      }
    }

    if (minR > maxR) { minR = 0; maxR = rows - 1; }
    computeEdgesAndCrown(minR, maxR, 0.22);
  }

  function snapToTarget() {
    density.set(targetDensity);
    crown.set(targetCrown);
    edge.set(targetEdge);
    prevDensity.set(targetDensity);
    prevCrown.set(targetCrown);
    prevEdge.set(targetEdge);
    dx.fill(0);
    dy.fill(0);
    vx.fill(0);
    vy.fill(0);
    energy.fill(0);
    morphActive = false;
  }

  function sampleCurrentTarget(triggerWave = true) {
    prevDensity.set(density);
    prevCrown.set(crown);
    prevEdge.set(edge);

    if (activePreset === 'emblem') {
      rasterizeSolarEmblem();
    } else if (activePreset === 'custom') {
      rasterizeWord(customText || 'ARIA');
    } else {
      rasterizeWord(activePreset);
    }

    if (reducedMotion || !triggerWave) {
      snapToTarget();
      if (reducedMotion) renderFrame();
    } else {
      morphActive = true;
      morphClock = 0;
    }
  }

  // --- Physics Step (Wave-Sweep Morph + Critically Damped Springs + Shockwaves) ---
  function stepSimulation(dt) {
    simTime += dt;

    // Smooth exponential pointer easing (Law 8: 1 - exp(-dt * 9))
    const pEase = 1 - Math.exp(-dt * 11);
    const prevPx = ptr.x, prevPy = ptr.y;
    if (ptr.rawX > -9000) {
      if (ptr.x < -9000) {
        ptr.x = ptr.rawX;
        ptr.y = ptr.rawY;
      } else {
        ptr.x += (ptr.rawX - ptr.x) * pEase;
        ptr.y += (ptr.rawY - ptr.y) * pEase;
      }
    }
    ptr.vx = clamp((ptr.x - prevPx) / Math.max(0.008, dt), -1800, 1800);
    ptr.vy = clamp((ptr.y - prevPy) / Math.max(0.008, dt), -1800, 1800);
    ptr.active += (ptr.targetActive - ptr.active) * (1 - Math.exp(-dt * 9));

    // Advance shockwaves
    let anyWave = false;
    for (let w = 0; w < MAX_WAVES; w++) {
      const sw = waves[w];
      if (!sw.active) continue;
      sw.age += dt;
      if (sw.age >= sw.maxAge) {
        sw.active = false;
      } else {
        anyWave = true;
      }
    }

    // Advance wave-sweep morph
    let sweepFront = 99;
    if (morphActive) {
      morphClock += dt;
      sweepFront = morphClock / MORPH_SWEEP_DUR;
      if (morphClock >= MORPH_SWEEP_DUR + MORPH_TAIL_DUR) {
        morphActive = false;
        density.set(targetDensity);
        crown.set(targetCrown);
        edge.set(targetEdge);
      }
    }

    const invCols = 1 / Math.max(1, cols - 1);
    const ptrR = Math.min(vw, vh) * 0.20;
    const ptrR2 = ptrR * ptrR;
    const usePtr = ptr.active > 0.012 && ptr.x > -9000;
    const swirlScale = ptr.dragging ? 1.85 : 1.0;

    // Spring constants: critically damped (a = -28 * d - 7.5 * v)
    const K_SPRING = 28.0;
    const K_DAMP = 7.5;
    const eDecay = Math.exp(-dt * 4.4);

    for (let r = 0; r < rows; r++) {
      const rowOff = r * cols;
      const cellCY = gridOriginY + (r + 0.5) * cellH;
      const rowCurve = 0.045 * Math.sin(r * 0.24);

      for (let c = 0; c < cols; c++) {
        const i = rowOff + c;
        const cellCX = gridOriginX + (c + 0.5) * cellW;

        // 1. Wave-sweep morph cascade
        if (morphActive) {
          const nx = c * invCols + rowCurve;
          const p = clamp((sweepFront - nx * 0.82) / 0.26, 0, 1);
          const sp = p * p * (3 - 2 * p);
          const td = targetDensity[i];
          const pd = prevDensity[i];
          density[i] = pd + (td - pd) * sp;
          crown[i] = prevCrown[i] + (targetCrown[i] - prevCrown[i]) * sp;
          edge[i] = prevEdge[i] + (targetEdge[i] - prevEdge[i]) * sp;

          if (p > 0.01 && p < 0.99 && (td > 0.02 || pd > 0.02)) {
            const crest = Math.sin(Math.PI * p);
            const eWave = crest * 0.88;
            if (eWave > energy[i]) energy[i] = eWave;
            vx[i] += crest * 85 * dt;
            vy[i] += (hash2i(c, r) - 0.5) * crest * 60 * dt;
          }
        }

        // 2. Spring forces from cursor repulsion / vortex swirl
        let fx = -K_SPRING * dx[i] - K_DAMP * vx[i];
        let fy = -K_SPRING * dy[i] - K_DAMP * vy[i];

        if (usePtr) {
          const rx = cellCX - ptr.x;
          const ry = cellCY - ptr.y;
          const dist2 = rx * rx + ry * ry;
          if (dist2 < ptrR2 && dist2 > 0.01) {
            const dist = Math.sqrt(dist2);
            const norm = 1 - dist / ptrR;
            const w = norm * norm * ptr.active;
            const invD = 1 / dist;
            const ux = rx * invD, uy = ry * invD;
            // Radial repulsion + subtle tangential eddy swirl + pointer wake
            fx += (ux * 1180 - uy * 460 * swirlScale) * w + ptr.vx * w * 2.4;
            fy += (uy * 1180 + ux * 460 * swirlScale) * w + ptr.vy * w * 2.4;
            const pe = w * (ptr.dragging ? 0.98 : 0.78);
            if (pe > energy[i]) energy[i] = pe;
          }
        }

        // 3. Expanding click / drag shockwave ripples
        if (anyWave) {
          for (let wi = 0; wi < MAX_WAVES; wi++) {
            const sw = waves[wi];
            if (!sw.active) continue;
            const rx = cellCX - sw.x;
            const ry = cellCY - sw.y;
            const dist = Math.hypot(rx, ry);
            const ringR = sw.age * sw.speed;
            const band = Math.abs(dist - ringR);
            const ringW = 54;
            if (band < ringW && dist > 1) {
              const fade = 1 - sw.age / sw.maxAge;
              const bell = Math.cos((band / ringW) * Math.PI * 0.5);
              const imp = bell * bell * fade * sw.strength;
              const invD = 1 / dist;
              fx += rx * invD * imp * 2600;
              fy += ry * invD * imp * 2600;
              const we = imp * 0.95;
              if (we > energy[i]) energy[i] = we;
            }
          }
        }

        // Integrate spring velocity & displacement (only active cells cost work)
        const vxi = (vx[i] + fx * dt);
        const vyi = (vy[i] + fy * dt);
        const dxi = dx[i] + vxi * dt;
        const dyi = dy[i] + vyi * dt;

        // Snap microscopic spring residuals cleanly to zero
        if (Math.abs(dxi) + Math.abs(dyi) + Math.abs(vxi) + Math.abs(vyi) < 0.04) {
          dx[i] = dy[i] = vx[i] = vy[i] = 0;
        } else {
          dx[i] = clamp(dxi, -cellW * 5, cellW * 5);
          dy[i] = clamp(dyi, -cellH * 3.5, cellH * 3.5);
          vx[i] = vxi;
          vy[i] = vyi;
        }

        energy[i] *= eDecay;
        if (energy[i] < 0.005) energy[i] = 0;
      }
    }
  }

  // --- Tone-Bucketed Zero-Style-Thrashing 2D Canvas Renderer ---
  function renderFrame() {
    const ladder = PALETTES[activePaletteKey].tones;

    // Reset tone bucket lengths
    for (let t = 1; t <= 7; t++) bLen[t] = 0;

    // Paint clean ground (Tone 0)
    ctx.fillStyle = ladder[0];
    ctx.fillRect(0, 0, vw, vh);

    const isBayerMode = activeRenderMode === 'bayer';
    const isMobile = vw < 600;
    const gridStepX = isMobile ? 8 : 12;
    const gridStepY = isMobile ? 5 : 6;
    const invCols = 1 / Math.max(1, cols - 1);
    const invRows = 1 / Math.max(1, rows - 1);
    const scrambleTick = Math.floor(simTime * 18);

    // Precompute active shockwaves for subtle coordinate-grid ring glow
    let activeWaveCount = 0;
    for (let wi = 0; wi < MAX_WAVES; wi++) if (waves[wi].active) activeWaveCount++;

    // Sub-block geometry for Bayer 4x4 Pixel Blocks mode (true square-ish crisp pixel blocks)
    const subCols = 2;
    const subRows = Math.max(2, Math.min(4, Math.round(cellH / (cellW / subCols))));
    const subW = cellW / subCols;
    const subH = cellH / subRows;
    const drawSubW = Math.max(1, Math.ceil(subW));
    const drawSubH = Math.max(1, Math.ceil(subH));

    for (let r = 0; r < rows; r++) {
      const rowOff = r * cols;
      const baseY = gridOriginY + r * cellH;
      const ny = r * invRows;
      const isMajorY = (r % gridStepY === 0);

      for (let c = 0; c < cols; c++) {
        const i = rowOff + c;
        const baseX = gridOriginX + c * cellW;
        const d = density[i];
        const e = energy[i];
        const bayerTh = BAYER[((r & 3) << 2) | (c & 3)];

        // Shockwave ring excitation on empty background cells
        let waveRing = 0;
        if (activeWaveCount > 0 && d <= 0.05) {
          const cx = baseX + cellW * 0.5;
          const cy = baseY + cellH * 0.5;
          for (let wi = 0; wi < MAX_WAVES; wi++) {
            const sw = waves[wi];
            if (!sw.active) continue;
            const dist = Math.hypot(cx - sw.x, cy - sw.y);
            const band = Math.abs(dist - sw.age * sw.speed);
            if (band < 38) {
              const fade = 1 - sw.age / sw.maxAge;
              const b = Math.cos((band / 38) * Math.PI * 0.5);
              waveRing = Math.max(waveRing, b * b * fade * sw.strength);
            }
          }
        }

        // --- Branch A: Foreground Wordmark / Solar Emblem Cell ---
        if (d > 0.04) {
          const nx = c * invCols;
          // Gentle slow specular breathing across letterpress ink (frozen when reducedMotion)
          const sheen = reducedMotion ? 0 : Math.sin(nx * 5.2 - ny * 2.1 - simTime * 1.45) * 0.42;
          const Lraw = d * (5.95 * crown[i] + 1.35 * edge[i] + 0.55) + sheen * d + e * 1.25;
          const L = clamp(Lraw, 0, 7.0);

          const drawX = Math.round(baseX + dx[i]);
          const drawY = Math.round(baseY + dy[i]);

          if (!isBayerMode) {
            // Clean void floor (Law 3: gate Bayer offset on L > 0.08)
            const md = L > 0.08 ? L + (bayerTh - 0.5) * 0.92 : 0;
            if (md <= 0.42) continue;

            // Ordered-dithered tone index 1..7
            const lo = Math.floor(L);
            const tIdx = clamp(lo + ((L - lo) > bayerTh ? 1 : 0), 1, 7);

            // Glyph selection: structural scramble while energy > 0.12, else optical ramp
            let gIdx = 0;
            if (e > 0.12) {
              const sHash = Math.floor(hash3i(c, r, scrambleTick) * SCRAMBLE_IDX.length);
              gIdx = SCRAMBLE_IDX[sHash];
            } else {
              for (let k = 0; k < 9; k++) if (md > RAMP_THRESH[k]) gIdx++;
              if (gIdx === 0) continue;
            }

            const pos = bLen[tIdx];
            if (pos < MAX_BUCKET_CAP) {
              bX[tIdx][pos] = drawX;
              bY[tIdx][pos] = drawY;
              bG[tIdx][pos] = gIdx;
              bLen[tIdx] = pos + 1;
            }
          } else {
            // Bayer 4x4 Pixel Blocks mode (sub-cell ordered-dithered halftone printmaking)
            for (let sy = 0; sy < subRows; sy++) {
              const subRowIdx = (r * subRows + sy) & 3;
              const py = Math.round(drawY + sy * subH);
              for (let sx = 0; sx < subCols; sx++) {
                const subColIdx = (c * subCols + sx) & 3;
                const sbTh = BAYER[(subRowIdx << 2) | subColIdx];
                // Subtle scramble dither shift when cell is energized
                const jitter = e > 0.12 ? (hash3i(c * 2 + sx, r * 3 + sy, scrambleTick) - 0.5) * e * 1.4 : 0;
                const Ls = clamp(L + jitter, 0, 7.0);
                if (Ls <= 0.08) continue;
                const lo = Math.floor(Ls);
                const tIdx = clamp(lo + ((Ls - lo) > sbTh ? 1 : 0), 0, 7);
                if (tIdx === 0) continue;
                const pos = bLen[tIdx];
                if (pos < MAX_BUCKET_CAP) {
                  bX[tIdx][pos] = Math.round(drawX + sx * subW);
                  bY[tIdx][pos] = py;
                  bW[tIdx][pos] = drawSubW;
                  bH[tIdx][pos] = drawSubH;
                  bLen[tIdx] = pos + 1;
                }
              }
            }
          }
          continue;
        }

        // --- Branch B: Subtle Breathing Architectural Coordinate Grid ---
        const isMajorX = (c % gridStepX === 0);
        const inSafeY = (r >= 4 && r <= rows - 5);
        const isIntersection = isMajorX && isMajorY && inSafeY;
        const isBorderTick = (c === 1 || c === cols - 2) && isMajorY && inSafeY;

        // Traveling architectural phase wave across quiet ground (kept clear of top/bottom chrome)
        const nx = c * invCols;
        const waveVal = inSafeY
          ? Math.sin(nx * 10.5 + ny * 6.0 - simTime * 1.35)
            * Math.cos(nx * 4.5 - ny * 8.0 + simTime * 0.72)
          : 0;
        const crest = waveVal > 0.72 ? (waveVal - 0.72) / 0.28 : 0;

        const fieldStrength = Math.max(
          isIntersection ? 0.56 : 0,
          isBorderTick ? 0.52 : 0,
          crest * 0.50,
          waveRing * 0.80,
          e * 0.72
        );

        if (fieldStrength <= 0.08) continue;

        const bgL = clamp(fieldStrength * 2.45, 0, 3.2);
        // Gate sparse background through 4x4 Bayer so it stays airy and architectural
        const bgLo = Math.floor(bgL);
        let tIdx = clamp(bgLo + ((bgL - bgLo) > bayerTh ? 1 : 0), 0, 3);
        if (tIdx === 0) continue;

        const drawX = Math.round(baseX + dx[i]);
        const drawY = Math.round(baseY + dy[i]);

        if (!isBayerMode) {
          let gIdx;
          if (e > 0.16 || waveRing > 0.35) {
            gIdx = SCRAMBLE_IDX[Math.floor(hash3i(c, r, scrambleTick) * SCRAMBLE_IDX.length)];
            tIdx = clamp(tIdx, 1, 3);
          } else if (isIntersection) {
            gIdx = GRID_IDX[2]; // '+'
          } else if (isBorderTick) {
            gIdx = GRID_IDX[3]; // '-'
          } else {
            gIdx = (crest > 0.55) ? GRID_IDX[1] : GRID_IDX[0]; // ':' or '·'
          }

          const pos = bLen[tIdx];
          if (pos < MAX_BUCKET_CAP) {
            bX[tIdx][pos] = drawX;
            bY[tIdx][pos] = drawY;
            bG[tIdx][pos] = gIdx;
            bLen[tIdx] = pos + 1;
          }
        } else {
          // Crisp pixel-locked registration micro-blocks in Bayer Blocks mode
          const cxBlock = Math.round(drawX + Math.floor((cellW - drawSubW) * 0.5));
          const cyBlock = Math.round(drawY + Math.floor((cellH - drawSubH) * 0.5));
          const pos = bLen[tIdx];
          if (pos < MAX_BUCKET_CAP) {
            bX[tIdx][pos] = cxBlock;
            bY[tIdx][pos] = cyBlock;
            bW[tIdx][pos] = drawSubW;
            bH[tIdx][pos] = drawSubH;
            bLen[tIdx] = pos + 1;
          }
        }
      }
    }

    // --- Single-Pass Tone-Bucketed Flush (Zero Style Thrashing: max 7 fillStyle sets) ---
    if (!isBayerMode) {
      ctx.font = `600 ${fontSize}px ${MONO_STACK}`;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      const yPad = Math.round((cellH - fontSize) * 0.5);

      for (let t = 1; t <= 7; t++) {
        const count = bLen[t];
        if (count === 0) continue;
        ctx.fillStyle = ladder[t];
        const xs = bX[t], ys = bY[t], gs = bG[t];
        for (let k = 0; k < count; k++) {
          ctx.fillText(ALL_GLYPHS[gs[k]], xs[k], ys[k] + yPad);
        }
      }
    } else {
      for (let t = 1; t <= 7; t++) {
        const count = bLen[t];
        if (count === 0) continue;
        ctx.fillStyle = ladder[t];
        const xs = bX[t], ys = bY[t], ws = bW[t], hs = bH[t];
        for (let k = 0; k < count; k++) {
          ctx.fillRect(xs[k], ys[k], ws[k], hs[k]);
        }
      }
    }
  }

  // --- Animation Loop with document.hidden & prefers-reduced-motion compliance ---
  let rafId = 0;
  let lastTs = 0;

  function tick(ts) {
    rafId = 0;
    if (reducedMotion || document.hidden) return;
    if (!lastTs) lastTs = ts;
    const dt = Math.min(0.05, Math.max(0.001, (ts - lastTs) * 0.001));
    lastTs = ts;

    stepSimulation(dt);
    renderFrame();
    rafId = requestAnimationFrame(tick);
  }

  function startLoop() {
    if (reducedMotion || document.hidden || rafId) return;
    lastTs = 0;
    rafId = requestAnimationFrame(tick);
  }

  function stopLoop() {
    if (rafId) {
      cancelAnimationFrame(rafId);
      rafId = 0;
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopLoop();
    else startLoop();
  });

  rmQuery.addEventListener('change', (ev) => {
    reducedMotion = ev.matches;
    if (reducedMotion) {
      stopLoop();
      snapToTarget();
      renderFrame();
    } else {
      startLoop();
    }
  });

  // --- Interactive Pointer & Shockwave Handlers ---
  function isOverDock(clientX, clientY) {
    const r = dockEl.getBoundingClientRect();
    return clientX >= r.left - 8 && clientX <= r.right + 8 && clientY >= r.top - 8 && clientY <= r.bottom + 8;
  }

  window.addEventListener('pointermove', (ev) => {
    if (reducedMotion) return;
    // Ignore parking corner (e.g., 8,8) and dock area so state views stay clean
    if ((ev.clientX <= 18 && ev.clientY <= 18) || isOverDock(ev.clientX, ev.clientY)) {
      ptr.targetActive = 0;
      return;
    }
    ptr.rawX = ev.clientX;
    ptr.rawY = ev.clientY;
    ptr.targetActive = 1;

    if (ptr.dragging) {
      const moved = Math.hypot(ev.clientX - ptr.lastDragWaveX, ev.clientY - ptr.lastDragWaveY);
      if (moved > 68) {
        spawnShockwave(ev.clientX, ev.clientY, 0.72, 420, 1.05);
        ptr.lastDragWaveX = ev.clientX;
        ptr.lastDragWaveY = ev.clientY;
      }
    }
  });

  window.addEventListener('pointerleave', () => {
    ptr.targetActive = 0;
    ptr.dragging = false;
  });

  canvas.addEventListener('pointerdown', (ev) => {
    if (reducedMotion) return;
    ptr.rawX = ev.clientX;
    ptr.rawY = ev.clientY;
    ptr.x = ev.clientX;
    ptr.y = ev.clientY;
    ptr.targetActive = 1;
    ptr.active = 1;
    ptr.dragging = true;
    ptr.lastDragWaveX = ev.clientX;
    ptr.lastDragWaveY = ev.clientY;
    spawnShockwave(ev.clientX, ev.clientY, 1.0, 470, 1.3);
  });

  window.addEventListener('pointerup', (ev) => {
    if (ptr.dragging) {
      ptr.dragging = false;
      spawnShockwave(ev.clientX, ev.clientY, 0.95, 430, 1.25);
    }
  });

  // --- Controls Wiring ---
  function setPreset(presetKey) {
    activePreset = presetKey;
    document.querySelectorAll('[data-preset]').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.preset === presetKey);
    });
    if (presetKey !== 'custom') {
      customInput.value = '';
    }
    sampleCurrentTarget(true);
  }

  function setPalette(palKey) {
    if (!PALETTES[palKey]) return;
    activePaletteKey = palKey;
    document.documentElement.setAttribute('data-palette', palKey);
    document.querySelectorAll('[data-palette]').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.palette === palKey);
    });
    updateTelemetry();
    if (reducedMotion) renderFrame();
  }

  function setRenderMode(modeKey) {
    if (modeKey !== 'ascii' && modeKey !== 'bayer') return;
    activeRenderMode = modeKey;
    document.querySelectorAll('[data-render]').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.render === modeKey);
    });
    updateTelemetry();
    if (reducedMotion) renderFrame();
  }

  document.querySelectorAll('[data-preset]').forEach((btn) => {
    btn.addEventListener('click', () => setPreset(btn.dataset.preset));
  });

  document.querySelectorAll('[data-palette]').forEach((btn) => {
    btn.addEventListener('click', () => setPalette(btn.dataset.palette));
  });

  document.querySelectorAll('[data-render]').forEach((btn) => {
    btn.addEventListener('click', () => setRenderMode(btn.dataset.render));
  });

  customInput.addEventListener('input', () => {
    const val = customInput.value.replace(/[^a-zA-Z0-9\-\.\+\*\/\&\s]/g, '').slice(0, 10);
    if (val !== customInput.value) customInput.value = val;
    customText = val.trim().toUpperCase();
    if (customText.length > 0) {
      activePreset = 'custom';
      document.querySelectorAll('[data-preset]').forEach((btn) => btn.classList.remove('active'));
      sampleCurrentTarget(true);
    } else {
      setPreset('ARIA');
    }
  });

  window.addEventListener('keydown', (ev) => {
    if (document.activeElement === customInput) return;
    if (ev.key === '1') setPreset('ARIA');
    else if (ev.key === '2') setPreset('ORBIT');
    else if (ev.key === '3') setPreset('GLYPH');
    else if (ev.key === '4') setPreset('emblem');
    else if (ev.key === 'b' || ev.key === 'B') setRenderMode(activeRenderMode === 'ascii' ? 'bayer' : 'ascii');
  });

  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => resize(false), 90);
  });

  // --- Boot ---
  prepareKineticText();
  const boot = () => {
    resize(true);
    if (!reducedMotion) startLoop();
  };
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
