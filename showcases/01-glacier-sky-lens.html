<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Glacier Sky &amp; ASCII Lens</title>
<style>
  :root {
    --g0: #05070D;
    --g1: #0C1A36;
    --g2: #1A2E59;
    --g3: #2A4A8C;
    --g4: #3F6CC9;
    --g5: #6F98E8;
    --g6: #A9C4F4;
    --g7: #F4F8FF;
    --a1: #1E5E63;
    --a2: #3FB8A8;
    --a3: #7FD49A;
    --a4: #B2C8F0;
    --dzs: 12px;
    --wisp-w: 1152px;
    --wisp-h: 288px;
    --shadow-day: 0 1px 12px rgba(5, 7, 13, 0.52), 0 0 2px rgba(12, 26, 54, 0.42);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--g0);
    color: var(--g7);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  .stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--g0);
  }

  canvas#sky,
  canvas#entities {
    position: fixed;
    top: 0;
    left: 0;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  canvas#sky { z-index: 1; }
  canvas#entities { z-index: 2; pointer-events: none; }

  .hero {
    position: fixed;
    z-index: 3;
    top: clamp(72px, 13vh, 128px);
    left: clamp(24px, 6vw, 84px);
    max-width: min(520px, calc(100vw - 48px));
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
  }

  .eyebrow {
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(244, 248, 255, 0.92);
    text-shadow: var(--shadow-day);
    padding: 2px 0;
  }

  .title-wrap {
    position: relative;
  }

  .title-wrap.wisp-active {
    -webkit-mask-image: var(--wisp);
    mask-image: var(--wisp);
    -webkit-mask-position: 0 0;
    mask-position: 0 0;
    -webkit-mask-size: var(--wisp-w) var(--wisp-h);
    mask-size: var(--wisp-w) var(--wisp-h);
    -webkit-mask-repeat: repeat;
    mask-repeat: repeat;
    animation: wisp 96s steps(384) infinite;
  }

  .title-wrap.wisp-paused {
    animation-play-state: paused;
  }

  @keyframes wisp {
    from {
      -webkit-mask-position: 0 0;
      mask-position: 0 0;
    }
    to {
      -webkit-mask-position: var(--wisp-w) 0;
      mask-position: var(--wisp-w) 0;
    }
  }

  h1.wordmark {
    font-size: clamp(46px, 6.8vw, 84px);
    font-weight: 500;
    line-height: 0.96;
    letter-spacing: -0.035em;
    color: var(--g7);
    text-shadow: var(--shadow-day);
  }

  .subtitle {
    font-size: clamp(14.5px, 1.35vw, 17px);
    font-weight: 400;
    line-height: 1.52;
    color: rgba(244, 248, 255, 0.92);
    max-width: 44ch;
    text-shadow: var(--shadow-day);
  }

  .hint {
    margin-top: 4px;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 11.5px;
    line-height: 1.45;
    letter-spacing: 0.02em;
    color: rgba(235, 243, 255, 0.90);
    text-shadow: var(--shadow-day);
  }

  /* Stepped 4x4 Bayer dither text reveal (--dz1..--dz7) */
  @keyframes dz {
    0%   { opacity: 0; }
    5%   { opacity: 1; -webkit-mask-image: var(--dz1); mask-image: var(--dz1); }
    18%  { opacity: 1; -webkit-mask-image: var(--dz2); mask-image: var(--dz2); }
    31%  { opacity: 1; -webkit-mask-image: var(--dz3); mask-image: var(--dz3); }
    44%  { opacity: 1; -webkit-mask-image: var(--dz4); mask-image: var(--dz4); }
    57%  { opacity: 1; -webkit-mask-image: var(--dz5); mask-image: var(--dz5); }
    70%  { opacity: 1; -webkit-mask-image: var(--dz6); mask-image: var(--dz6); }
    83%  { opacity: 1; -webkit-mask-image: var(--dz7); mask-image: var(--dz7); }
    100% { opacity: 1; -webkit-mask-image: none; mask-image: none; }
  }

  @keyframes dzr {
    from { transform: translateY(0.12em); }
    to   { transform: translateY(0); }
  }

  .kin .w {
    display: inline-block;
    opacity: 0;
    padding-block: 0.22em;
    margin-block: -0.22em;
    -webkit-mask-size: var(--dzs) var(--dzs);
    mask-size: var(--dzs) var(--dzs);
    -webkit-mask-repeat: repeat;
    mask-repeat: repeat;
  }

  .kin.in .w {
    opacity: 1;
    animation:
      dz 460ms step-end both,
      dzr 680ms cubic-bezier(0.16, 1, 0.3, 1) both;
    animation-delay: calc(var(--bd, 0ms) + var(--i, 0) * var(--st, 34ms));
  }

  /* Whisper-quiet translucent floating bottom dock */
  .dock {
    position: fixed;
    z-index: 10;
    left: 50%;
    bottom: max(18px, env(safe-area-inset-bottom, 18px));
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 999px;
    background: rgba(5, 7, 13, 0.54);
    border: 1px solid rgba(169, 196, 244, 0.22);
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    box-shadow: 0 8px 28px rgba(5, 7, 13, 0.32);
    max-width: calc(100vw - 20px);
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    color: var(--g6);
  }

  .dock-group {
    display: inline-flex;
    align-items: center;
    gap: 2px;
  }

  .dock-sep {
    width: 1px;
    height: 16px;
    background: rgba(169, 196, 244, 0.2);
    flex-shrink: 0;
  }

  .dock button {
    appearance: none;
    border: 1px solid transparent;
    background: transparent;
    color: rgba(169, 196, 244, 0.82);
    font: inherit;
    font-size: 11px;
    letter-spacing: 0.03em;
    padding: 5px 9px;
    border-radius: 999px;
    cursor: pointer;
    transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
    white-space: nowrap;
  }

  .dock button:hover {
    color: var(--g7);
    background: rgba(169, 196, 244, 0.12);
  }

  .dock button[aria-pressed="true"] {
    color: var(--g7);
    background: rgba(63, 108, 201, 0.42);
    border-color: rgba(169, 196, 244, 0.38);
  }

  .dock button:focus-visible,
  .dock input[type="range"]:focus-visible {
    outline: 1.5px solid var(--g6);
    outline-offset: 2px;
  }

  .scrub-wrap {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 0 4px;
  }

  .dock input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 118px;
    height: 18px;
    background: transparent;
    cursor: pointer;
  }

  .dock input[type="range"]::-webkit-slider-runnable-track {
    height: 2px;
    border-radius: 2px;
    background: rgba(169, 196, 244, 0.28);
  }

  .dock input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 10px;
    height: 10px;
    margin-top: -4px;
    border-radius: 50%;
    background: var(--g7);
    border: 1px solid rgba(12, 26, 54, 0.65);
    box-shadow: 0 0 0 2px rgba(169, 196, 244, 0.22);
  }

  .dock input[type="range"]::-moz-range-track {
    height: 2px;
    border-radius: 2px;
    background: rgba(169, 196, 244, 0.28);
  }

  .dock input[type="range"]::-moz-range-thumb {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--g7);
    border: 1px solid rgba(12, 26, 54, 0.65);
  }

  .clock {
    font-variant-numeric: tabular-nums;
    color: var(--g7);
    min-width: 38px;
    text-align: right;
    letter-spacing: 0.04em;
  }

  @media (max-width: 759px) {
    .hero {
      top: 158px;
      left: 20px;
      right: 20px;
      max-width: none;
      gap: 11px;
    }

    h1.wordmark {
      font-size: 46px;
    }

    .subtitle {
      font-size: 14px;
      max-width: 34ch;
    }

    .hint {
      font-size: 10.5px;
    }

    .dock {
      border-radius: 18px;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 8px;
      padding: 7px 10px;
      bottom: max(14px, env(safe-area-inset-bottom, 14px));
      width: calc(100vw - 24px);
    }

    .dock-sep { display: none; }

    .dock button {
      padding: 5px 8px;
      font-size: 10.5px;
    }

    .dock input[type="range"] {
      width: 96px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .kin .w {
      opacity: 1 !important;
      animation: none !important;
      -webkit-mask-image: none !important;
      mask-image: none !important;
      transform: none !important;
    }
    .title-wrap.wisp-active {
      -webkit-mask-image: none !important;
      mask-image: none !important;
      animation: none !important;
    }
  }
</style>
</head>
<body>
  <div class="stage" aria-hidden="true">
    <canvas id="sky"></canvas>
    <canvas id="entities"></canvas>
  </div>

  <main class="hero">
    <p class="eyebrow kin" data-dim style="--bd: 0ms; --st: 30ms">GLACIER ATMOSPHERE · 4x4 BAYER &amp; 5x7 LENS</p>
    <div class="title-wrap" id="titleWrap">
      <h1 class="wordmark kin" data-dim style="--bd: 70ms; --st: 46ms">Glacier Sky</h1>
    </div>
    <p class="subtitle kin" data-dim style="--bd: 145ms; --st: 26ms">Three parallax cloud decks, celestial mechanics, and a pixel-locked bitmap lens unified on an eight-step OKLab ladder.</p>
    <p class="hint kin" data-dim style="--bd: 225ms; --st: 22ms">Move pointer for 5x7 ASCII lens · Click open sky to release a flock · Scrub time below</p>
  </main>

  <nav class="dock" aria-label="Atmosphere controls">
    <div class="dock-group" role="group" aria-label="Time presets">
      <button type="button" data-preset="day" aria-pressed="true">Day</button>
      <button type="button" data-preset="dusk" aria-pressed="false">Dusk</button>
      <button type="button" data-preset="night" aria-pressed="false">Night</button>
      <button type="button" data-preset="dawn" aria-pressed="false">Dawn</button>
    </div>
    <span class="dock-sep" aria-hidden="true"></span>
    <div class="scrub-wrap">
      <input id="time-scrubber" type="range" min="0" max="24" step="0.02" value="10.67" aria-label="Time of day" />
      <span class="clock" id="time-clock">10:40</span>
    </div>
    <span class="dock-sep" aria-hidden="true"></span>
    <div class="dock-group" role="group" aria-label="Modes">
      <button type="button" data-action="cycle" aria-pressed="false">Cycle</button>
      <button type="button" data-action="ascii" aria-pressed="false">ASCII</button>
    </div>
  </nav>

<script>
(() => {
  'use strict';

  const TONE_HEX = ['#05070D','#0C1A36','#1A2E59','#2A4A8C','#3F6CC9','#6F98E8','#A9C4F4','#F4F8FF'];
  const AUR_HEX  = ['#1E5E63','#3FB8A8','#7FD49A','#B2C8F0'];
  const BAYER_INT = [0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5];
  const BAYER_TH  = BAYER_INT.map((v) => (v + 0.5) / 16);

  const hexToRgb01 = (h) => [
    parseInt(h.slice(1, 3), 16) / 255,
    parseInt(h.slice(3, 5), 16) / 255,
    parseInt(h.slice(5, 7), 16) / 255,
  ];
  const hexToRgb255 = (h) => [
    parseInt(h.slice(1, 3), 16),
    parseInt(h.slice(3, 5), 16),
    parseInt(h.slice(5, 7), 16),
  ];

  const TONE_RGB01 = TONE_HEX.map(hexToRgb01);
  const AUR_RGB01  = AUR_HEX.map(hexToRgb01);
  const TONE_RGB   = TONE_HEX.map(hexToRgb255);
  const AUR_RGB    = AUR_HEX.map(hexToRgb255);

  const GLYPH_BITS = [
    [0, 0],
    [0, 128],
    [0, 4232],
    [128, 128],
    [14, 0],
    [992, 31744],
    [4255, 4224],
    [4782, 21632],
    [338922, 32074],
    [847052, 28256],
  ];
  const RAMP_TH = [0.55, 1.35, 2.2, 3.5, 4.95, 5.55, 5.95, 6.35, 6.72];

  const PRESETS = {
    day: 10.67,
    dusk: 18.85,
    night: 23.5,
    dawn: 5.42,
  };

  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  const smoothstep = (e0, e1, x) => {
    const t = clamp((x - e0) / (e1 - e0), 0, 1);
    return t * t * (3 - 2 * t);
  };
  const lerp = (a, b, t) => a + (b - a) * t;

  const rmQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  let reducedMotion = rmQuery.matches;

  const S = {
    vw: innerWidth,
    vh: innerHeight,
    dpr: 1,
    cell: 3,
    cellDev: 3,
    dw: 1440,
    dh: 900,
    gw: 480,
    gh: 300,
    lw: 80,
    lh: 34,
    time: 14.0,
    hour: PRESETS.day,
    cycle: false,
    fullAscii: false,
    ptrTargetX: -999,
    ptrTargetY: -999,
    ptrX: -999,
    ptrY: -999,
    ptrActive: 0,
    ptrEnergy: 0,
    lensFade: 0,
    dimRects: new Float32Array(32),
    dimCount: 0,
    dimDirty: true,
    meteorActive: false,
    meteorStartX: 0,
    meteorStartY: 0,
    meteorDirX: 0,
    meteorDirY: 0,
    meteorAge: 0,
    meteorDur: 0.9,
    meteorCooldown: 2.2,
    needsRender: true,
  };

  // --- Kinetic typography setup (per-block --i reset) ---
  function initKineticType() {
    document.querySelectorAll('.kin').forEach((el) => {
      const text = el.textContent.trim();
      const words = text.split(/\s+/);
      el.textContent = '';
      words.forEach((word, idx) => {
        const span = document.createElement('span');
        span.className = 'w';
        span.style.setProperty('--i', String(idx));
        span.textContent = word;
        el.appendChild(span);
        if (idx < words.length - 1) el.appendChild(document.createTextNode(' '));
      });
    });
    requestAnimationFrame(() => {
      document.querySelectorAll('.kin').forEach((el) => el.classList.add('in'));
    });
  }

  // --- Build stepped Bayer 4x4 mask tiles (--dz1..--dz7) ---
  function buildDitherTiles(cell) {
    const cSize = Math.max(2, Math.round(cell || 3));
    const u = cSize * Math.min(3, Math.ceil(devicePixelRatio || 1));
    const cv = document.createElement('canvas');
    cv.width = cv.height = u * 4;
    const g = cv.getContext('2d');
    const root = document.documentElement.style;
    g.fillStyle = '#fff';
    for (let k = 1; k <= 7; k++) {
      g.clearRect(0, 0, u * 4, u * 4);
      for (let i = 0; i < 16; i++) {
        if (BAYER_TH[i] < k / 8) g.fillRect((i & 3) * u, (i >> 2) * u, u, u);
      }
      root.setProperty('--dz' + k, `url(${cv.toDataURL()})`);
    }
    root.setProperty('--dzs', cSize * 4 + 'px');
  }

  // --- Seamless periodic Bayer cloud-wisp mask for hero wordmark ---
  function buildWispMask(cell) {
    const W = 384, H = 96;
    const cSize = Math.max(2, Math.round(cell || 3));
    const cv = document.createElement('canvas');
    cv.width = W;
    cv.height = H;
    const g = cv.getContext('2d');
    const img = g.createImageData(W, H);
    const d = img.data;

    const hash2 = (ix, iy, px, py, seed) => {
      let x = ((ix % px) + px) % px;
      let y = ((iy % py) + py) % py;
      let n = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(seed, 1442695041)) | 0;
      n = Math.imul(n ^ (n >>> 13), 1274126177);
      return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
    };

    const pNoise = (x, y, px, py, seed) => {
      const fx = Math.floor(x), fy = Math.floor(y);
      const tx = x - fx, ty = y - fy;
      const ux = tx * tx * (3 - 2 * tx), uy = ty * ty * (3 - 2 * ty);
      const a = hash2(fx, fy, px, py, seed);
      const b = hash2(fx + 1, fy, px, py, seed);
      const c = hash2(fx, fy + 1, px, py, seed);
      const e = hash2(fx + 1, fy + 1, px, py, seed);
      return lerp(lerp(a, b, ux), lerp(c, e, ux), uy);
    };

    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const u = x / W, v = y / H;
        let f = 0;
        f += 0.55 * pNoise(u * 4, v * 2, 4, 2, 11);
        f += 0.30 * pNoise(u * 8, v * 4, 8, 4, 23);
        f += 0.15 * pNoise(u * 16, v * 8, 16, 8, 37);
        const th = BAYER_TH[((y & 3) << 2) | (x & 3)];
        const wisp = smoothstep(0.60, 0.84, f);
        let alpha = 255;
        if (wisp > th) alpha = wisp > 0.72 + th * 0.28 ? 118 : 178;
        const idx = (y * W + x) * 4;
        d[idx] = 255; d[idx + 1] = 255; d[idx + 2] = 255; d[idx + 3] = alpha;
      }
    }
    g.putImageData(img, 0, 0);
    const root = document.documentElement.style;
    root.setProperty('--wisp', `url(${cv.toDataURL()})`);
    root.setProperty('--wisp-w', (W * cSize) + 'px');
    root.setProperty('--wisp-h', (H * cSize) + 'px');

    const titleWrap = document.getElementById('titleWrap');
    if (titleWrap && !reducedMotion) {
      titleWrap.classList.add('wisp-active');
      if ('IntersectionObserver' in window) {
        const io = new IntersectionObserver((entries) => {
          for (const e of entries) {
            titleWrap.classList.toggle('wisp-paused', !e.isIntersecting);
          }
        });
        io.observe(titleWrap);
      }
    }
  }

  // --- Celestial & Atmosphere Parameter Computation ---
  function computeAtmosphere(hour, vw, vh) {
    const h = ((hour % 24) + 24) % 24;
    const isMobile = vw < 760;

    // Continuous smooth day-to-night dusk parameter: 0 = crisp day, 1 = deep midnight
    const rise = smoothstep(4.2, 7.6, h);
    const set  = 1.0 - smoothstep(17.1, 20.5, h);
    const daylight = rise * set;
    const dusk = clamp(1.0 - daylight, 0, 1);

    // Dawn glow peaks cleanly around 05:00 - 06:30
    const dawnGlow = smoothstep(3.4, 5.2, h) * (1.0 - smoothstep(5.9, 8.2, h));

    // Sun position & elevation
    const sunVis = smoothstep(5.4, 6.7, h) * (1.0 - smoothstep(18.6, 20.1, h));
    const dayArc = clamp((h - 5.5) / 13.75, 0, 1); // 0 sunrise .. 0.5 noon .. 1 sunset
    const sunElev = Math.sin(Math.PI * dayArc); // 0 at horizon, 1 at zenith
    const sunLow = clamp(1.0 - smoothstep(0.0, 0.58, sunElev), 0, 1);

    // Safe-zone celestial placement: keep bright discs clear of hero copy on 390px mobile
    const sunX = isMobile
      ? lerp(0.76, 0.80, dayArc) * vw
      : lerp(0.62, 0.82, dayArc) * vw;
    const sunTopY = isMobile ? 0.095 * vh : 0.21 * vh;
    const sunHorizY = isMobile ? 0.72 * vh : 0.74 * vh;
    const sunY = lerp(sunHorizY, sunTopY, Math.pow(clamp(sunElev, 0, 1), 0.72));
    const sunR = isMobile ? Math.max(20, vw * 0.062) : Math.max(30, Math.min(vw, vh) * 0.048);

    // Moon visibility & position (rises late dusk, shines across night, lingers softly into dawn)
    const moonVis = clamp(smoothstep(18.1, 20.2, h) + (1.0 - smoothstep(5.2, 7.4, h)), 0, 1);
    const nightHour = h >= 17 ? (h - 17) : (h + 7); // 0..14 across night
    const nightArc = clamp(nightHour / 14.0, 0, 1);
    const moonX = isMobile
      ? lerp(0.80, 0.72, nightArc) * vw
      : lerp(0.84, 0.74, nightArc) * vw;
    const moonY = isMobile
      ? lerp(0.11, 0.092, Math.sin(Math.PI * nightArc)) * vh
      : lerp(0.24, 0.16, Math.sin(Math.PI * nightArc)) * vh;
    const moonR = isMobile ? Math.max(18, vw * 0.056) : Math.max(28, Math.min(vw, vh) * 0.044);

    // Waxing crescent phase (0.25) Lambertian light vector
    const phase = 0.25;
    const ph = ((phase % 1) + 1) % 1;
    const s = Math.sin(Math.PI * ph);
    const lit = Math.pow(s * s, 1.5);
    const c = 1 - 2 * lit;
    const sn = Math.sqrt(Math.max(0, 1 - c * c)) * (ph < 0.5 ? 1 : -1);
    const moonL = [sn * 0.914, sn * -0.407, -c];

    // Star, Milky Way, and Aurora visibility
    const starVis = smoothstep(0.36, 0.92, dusk);
    const mwVis = smoothstep(0.58, 0.96, dusk);
    const auroraVis = smoothstep(0.76, 0.98, dusk) * (1.0 - dawnGlow * 0.88);
    const aurY = isMobile ? 0.50 : 0.49;

    // Dithered mist horizon rises slightly at Dawn / low Dusk
    const hzVis = clamp(dawnGlow * 0.95 + smoothstep(0.45, 0.75, dusk) * (1.0 - smoothstep(0.85, 0.98, dusk)) * 0.35, 0, 1);

    return {

  // --- Shared Resize Calculation (Pixel-Locked Grid) ---
  const cellSize = (w, h) => Math.max(3, Math.round(Math.max(w, h * 1.4) / 480));

  function computeGrid(skyCanvas, entCanvas) {
    const vw = Math.max(1, innerWidth);
    const vh = Math.max(1, innerHeight);

    if (vw * vh * dpr * dpr > maxPixels) {

    const cellCss = cellSize(vw, vh);
    const cellDev = Math.max(1, Math.round(cellCss * dpr));
    const dw = Math.ceil(vw * dpr);
    const dh = Math.ceil(vh * dpr);

    skyCanvas.width = dw;
    skyCanvas.height = dh;
    skyCanvas.style.width = (dw / dpr) + 'px';
    skyCanvas.style.height = (dh / dpr) + 'px';

    S.dw = dw; S.dh = dh;
    S.cellDev = cellDev;
    S.cell = cellDev / dpr;
    S.gw = Math.ceil(dw / cellDev);
    S.gh = Math.ceil(dh / cellDev);
    S.lw = Math.ceil(S.gw / 6);
    S.lh = Math.ceil(S.gh / 9);

    entCanvas.width = S.gw;
    entCanvas.height = S.gh;
    entCanvas.style.width = (S.gw * S.cell) + 'px';
    entCanvas.style.height = (S.gh * S.cell) + 'px';

    S.needsRender = true;

  function readDimRects() {

    for (let i = 0; i < els.length && n < 8; i++) {

      if (r.width <= 0 || r.height <= 0) continue;
      S.dimRects[n * 4 + 0] = r.left - 8;
      S.dimRects[n * 4 + 1] = r.top - 6;
      S.dimRects[n * 4 + 2] = r.right + 8;
      S.dimRects[n * 4 + 3] = r.bottom + 6;

    S.dimDirty = false;

  // =========================================================================
  // WebGL2 3-Pass Engine (FIELD -> GLYPHPASS -> BLIT, Strictly Top-Down FBOs)
  // =========================================================================
  const VS_FULL = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

  const FS_FIELD = `#version 300 es
precision highp float;
precision highp int;

uniform vec2  uRes;
uniform float uCell;
uniform float uTime;
uniform float uDusk;
uniform float uDawn;
uniform vec4  uSun;       // x, y, r, vis
uniform float uSunLow;
uniform vec4  uMoon;      // x, y, r, vis
uniform vec3  uMoonL;
uniform float uStarVis;
uniform float uMwVis;
uniform vec2  uAurParam;  // vis, aurY
uniform vec2  uHzParam;   // vis, hzY
uniform vec3  uPtr;       // x, y, energy
uniform vec4  uMeteor;    // startX, startY, dirX, dirY (in cells)
uniform vec2  uMeteorT;   // age01, active (0 or 1)
uniform vec4  uDim[8];
uniform int   uDimN;
uniform vec3  uTone[8];
uniform vec3  uAur[4];

out vec4 oc;

const int BAYER[16] = int[16](0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5);
const mat2 OCT = mat2(1.62, 1.18, -1.18, 1.62);

uint pcg2(uvec2 v) {
  v = v * 1664525u + 1013904223u;
  v.x += v.y * 1664525u; v.y += v.x * 1664525u;
  v ^= v >> 16u;
  v.x += v.y * 1664525u; v.y += v.x * 1664525u;
  v ^= v >> 16u;
  return v.x ^ v.y;
}

float rnd(ivec2 p, uint salt) {
  return float(pcg2(uvec2(p + ivec2(32768, 32768)) + uvec2(salt, salt * 7919u))) * (1.0 / 4294967296.0);
}

vec2 grad(ivec2 p) {
  float a = rnd(p, 0u) * 6.2831853;
  return vec2(cos(a), sin(a));
}

float noise(vec2 p) {
  vec2 i = floor(p), f = p - i;
  ivec2 q = ivec2(i);
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  float a = dot(grad(q), f);
  float b = dot(grad(q + ivec2(1, 0)), f - vec2(1.0, 0.0));
  float c = dot(grad(q + ivec2(0, 1)), f - vec2(0.0, 1.0));
  float d = dot(grad(q + ivec2(1, 1)), f - vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y) * 1.45;
}

float fbm(vec2 p, int n) {
  float s = 0.0, a = 0.5, w = 0.0;
  for (int i = 0; i < 6; i++) {
    if (i >= n) break;
    s += a * noise(p);
    w += a;
    p = OCT * p + vec2(17.31, 9.17);
    a *= 0.5;

void main() {
  ivec2 ic = ivec2(gl_FragCoord.xy);
  vec2 P = (vec2(ic) + 0.5) * uCell;
  float yf = clamp(P.y / max(uRes.y, 1.0), 0.0, 1.0);
  float th = (float(BAYER[((ic.y & 3) << 2) | (ic.x & 3)]) + 0.5) / 16.0;

  // Content-aware legibility thinning ([data-dim])
  float dim = 0.0;
  for (int k = 0; k < 8; k++) {
    if (k >= uDimN) break;
    vec4 r = uDim[k];
    vec2 a = max(max(r.xy - P, P - r.zw), 0.0);
    dim = max(dim, exp(-dot(a, a) * (1.0 / 3600.0)));

  // Three-deck parallax clouds in cell coordinates

  float t = uTime;

  // Deck 1: Far haze (3 octaves, scale 480x190 cells)

    toL = mix(toL, dv * 0.14, uSun.w);
  } else if (uMoon.w > 0.05) {

  float shade = clamp((dm - dmSun) * 2.4, -1.0, 1.0);

  float clear = 1.0 - smoothstep(0.05, 0.50, cl);
  float edge = smoothstep(0.03, 0.20, cl) * (1.0 - smoothstep(0.30, 0.72, cl));

  // Volumetric daytime cloud field value v

  v = clamp(v, 0.0, 1.08);

  // Pointer light (catches clouds more than open sky)
  if (uPtr.z > 0.005) {
    vec2 dp = P - uPtr.xy;
    float pd = exp(-dot(dp, dp) * (1.0 / (220.0 * 220.0)));
    v += uPtr.z * pd * (0.10 + 0.14 * max(D, N));

    vec2 sScale = vec2(1.0 + 3.2 * uSunLow, 1.0 - 0.25 * uSunLow);
    float sHx = length(ds / (max(uSun.z, 1.0) * 5.2 * sScale));

    float band = smoothstep(0.48, 0.92, curve) * uDawn;
    float cloudSilhouette = smoothstep(0.32, 0.78, cl) * smoothstep(0.44, 0.84, curve);
    float underLit = edge * smoothstep(0.38, 0.88, curve) * uDawn;

    float ang = -0.4887; // ~28 degrees

    vec2 mwp = rot * uv + vec2(0.0, 0.08);
    float mwWarp = fbm(mwp * 2.6 + vec2(2.4, 7.1), 3) * 0.14;
    float bandD = abs(mwp.y + mwWarp);
    float bandG = exp(-bandD * bandD * 14.0);
    float clump = smoothstep(-0.25, 0.55, fbm(mwp * 4.5 + vec2(11.0, 3.2), 4));
    float dust = smoothstep(0.08, 0.48, fbm(mwp * 8.2 + vec2(5.1, 14.3), 4));
    float dustLane = exp(-bandD * bandD * 95.0) * dust;

    float mwVisEff = uMwVis * clear * (1.0 - 0.75 * dim);
    L = max(L, (mwS * 1.55 - dustLane * 0.55) * mwVisEff);

  // --- Deterministic Sparse Twinkling Stars (top 3% 5-cell '+' crosses) ---
  if (uStarVis > 0.01) {
    float sv = uStarVis * clear * (1.0 - 0.82 * dim);
    if (sv > 0.02) {
      float starL = 0.0;
      float twClock = mod(uTime, 64.0);
      // Check center cell + 4 cardinal neighbors for top-3% '+' crosses
      for (int k = 0; k < 5; k++) {
        ivec2 off = k == 0 ? ivec2(0, 0) : k == 1 ? ivec2(1, 0) : k == 2 ? ivec2(-1, 0) : k == 3 ? ivec2(0, 1) : ivec2(0, -1);

    vec2 rel = vec2(ic) - mHead;

    vec2 mQ = (P - uMoon.xy) / max(uMoon.z, 1.0);
    float mRd = length(mQ);
    if (mRd < 1.85) {
      float mHalo = exp(-mRd * mRd * 1.4) * 1.45 * uMoon.w * clear * (1.0 - 0.5 * dim);
      L = max(L, L + mHalo);

      float lam = dot(n, normalize(uMoonL));
      float mare = smoothstep(-0.08, 0.44, fbm(mQ * 3.1 + vec2(2.7, 5.4), 4));
      float litC = smoothstep(-0.02, 0.36, lam);
      float litL = (3.4 + 3.65 * pow(max(lam, 0.0), 0.58)) * (1.0 - 0.24 * mare);

      float earthshine = (0.72 + 0.14 * (1.0 - mare)) * smoothstep(0.68, 0.95, uDusk);
      float limbSoft = 1.0 - smoothstep(0.92, 1.0, mRd);
      float moonL = mix(max(L, earthshine), max(L, litL), litC);
      // Attenuate cleanly if thick cloud passes in front
      float mVis = uMoon.w * limbSoft * (1.0 - smoothstep(0.45, 0.88, cl) * 0.72);
      L = mix(L, moonL, mVis);
    }
  }

  bool isAur = false;
  vec3 aurCol = vec3(0.0);
  float aurLs = 0.0;

    float xN = P.x / max(uRes.x, 1.0);
    float vhc = uRes.y / uCell;
    // Undulating S-curve ribbon lower hem sweeping across open center-right sky
    float wave = 0.075 * sin(xN * 5.6 - 0.9 + uTime * 0.05)
               + 0.065 * noise(vec2(xN * 3.8 + uTime * 0.04, 1.7))
               + 0.030 * noise(vec2(xN * 8.4 - uTime * 0.07, 4.3));
    float hem = vhc * (uAurParam.y + wave);
    float h = hem - float(ic.y); // positive going UP from lower hem
    // Sharp luminous lower rim, tall fading vertical rays rising upward
    float kSharp = h < 0.0 ? 0.011 : 0.00032;
    float curtain = exp(-h * h * kSharp);
    // Leaning vertical ray shafts (tall shimmer pillars)
    float leanX = xN * 18.0 + (h / max(vhc, 1.0)) * 3.1;
    float shaft1 = pow(clamp(0.52 + 0.52 * noise(vec2(leanX + uTime * 0.09, 2.1)), 0.0, 1.0), 1.45);
    float shaft2 = pow(clamp(0.50 + 0.54 * noise(vec2(leanX * 2.3 - uTime * 0.14, 8.4)), 0.0, 1.0), 1.25);
    float rays = mix(0.28, 1.25, shaft1 * (0.45 + 0.75 * shaft2));
    float rimGlow = exp(-h * h * 0.0065) * 0.45;
    float sweep = smoothstep(0.26, 0.46, xN) * (1.0 - smoothstep(0.86, 0.99, xN));
    // Keep crescent moon disc clear of aurora overlap

    float aur = (curtain * rays + rimGlow * shaft1) * sweep * uAurParam.x * moonClear;
    aur *= (0.45 + 0.55 * clear) * (1.0 - 0.95 * dim);

    if (aur > 0.16) {

      float paleTip = tipHeight * smoothstep(0.42, 0.85, aur) * smoothstep(0.45, 0.85, shaft2);
      float aLevel = clamp((aur - 0.16) * 2.85, 0.0, 2.28);

    float hzBand = (P.y - uHzParam.y) / max(uCell * 28.0, 1.0);
    float mist = fbm(vec2(P.x * 0.008 + uTime * 0.06, 2.3), 3) * 0.42;
    float groundFade = smoothstep(-0.65, 0.85, hzBand + mist) * uHzParam.x;
    L = mix(L, -0.45, groundFade);
    if (groundFade > 0.65) isAur = false;
  }

  float Ls = clamp(L, 0.0, 7.0);
  vec3 col;
  if (isAur) {
    col = aurCol;
    Ls = max(Ls, aurLs);
  } else {
    float lo = floor(Ls);
    int idx = clamp(int(lo) + ((Ls - lo) > th ? 1 : 0), 0, 7);
    col = uTone[idx];
  }

  oc = vec4(col, (1.0 + clamp(Ls, 0.0, 7.0) * 36.0) / 255.0);
}`;

precision highp int;

uniform highp sampler2D uTex;

uniform ivec2 uGrid;
uniform int   uFullAscii;
uniform float uDusk;

out vec4 oc;

const int BAYER[16] = int[16](0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5);
const float RAMP[9] = float[9](0.55, 1.35, 2.2, 3.5, 4.95, 5.55, 5.95, 6.35, 6.72);

void main() {
  ivec2 gc = ivec2(gl_FragCoord.xy);
  ivec2 c0 = gc * ivec2(6, 9);
  if (uFullAscii == 0 && (uLens.w <= 0.005 || length(vec2(c0) + vec2(3.0, 4.5) - uLens.xy) > uLens.z + 8.0)) {
    oc = vec4(0.0);
    return;
  }

  float sum = 0.0, mx = 0.0, n = 0.0, na = 0.0, ag = 0.0, nHi = 0.0;
  for (int y = 0; y < 9; y++) {
    for (int x = 0; x < 6; x++) {
      vec4 s = texelFetch(uTex, min(c0 + ivec2(x, y), uGrid - 1), 0);
      if (s.a <= 0.0) continue;
      float L = (s.a * 255.0 - 1.0) / 36.0;
      sum += L;
      mx = max(mx, L);
      if (L > 3.2) nHi += 1.0;
      n += 1.0;
      if (s.g > s.b * 0.9 && s.r < s.g * 0.65) {
        na += 1.0;
        ag += L;
      }
    }
  }
  if (n < 1.0) { oc = vec4(0.0); return; }

  float m = sum / n;
  float th = (float(BAYER[((gc.y & 3) << 2) | (gc.x & 3)]) + 0.5) / 16.0;

  // Gate Bayer offset on m > 0.08 so pure dark void never leaks faint '.' stippling
  float md = m > 0.08 ? m + (th - 0.5) * 0.9 : 0.0;
  int gi = 0;
  for (int i = 0; i < 9; i++) gi += md > RAMP[i] ? 1 : 0;

  int T = clamp(int(floor(m + 0.5)), 0, 7);
  int lt = min(T + (T < 5 ? 2 : 1), 7);
  int ut = (uDusk > 0.78 || (uDusk > 0.62 && T <= 2)) ? 0 : max(T - 1, 0);

  if (mx - m > 1.8 && m < 3.2 && mx > 3.4 && nHi <= 9.0) {

    at = a > 5.75 ? 4 : a > 4.6 ? 3 : a > 3.2 ? 2 : 1;
    ut = 0;
    if (gi < 3) gi = 3 + int(na > 14.0);
  }

  oc = vec4(float(gi), float(lt), float(ut), float(at)) / 255.0;
}`;

  const FS_BLIT = `#version 300 es
precision highp float;
precision highp int;

uniform highp sampler2D uTex;
uniform highp sampler2D uGly;
uniform int   uCellDev;
uniform int   uTop;
uniform ivec2 uGrid;
uniform ivec2 uLGrid;
uniform vec4  uLens;      // cx, cy, radius (cells), fade
uniform int   uFullAscii;
uniform vec3  uTone[8];
uniform vec3  uAur[4];

out vec4 oc;

const int BAYER[16] = int[16](0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5);
const uint GLYPH[20] = uint[20](
  0u, 0u,
  0u, 128u,
  0u, 4232u,
  128u, 128u,
  14u, 0u,
  992u, 31744u,
  4255u, 4224u,
  4782u, 21632u,
  338922u, 32074u,
  847052u, 28256u
);

void main() {
  ivec2 f = ivec2(gl_FragCoord.xy);
  // Flip Y ONLY here in BLIT to map bottom-up screen space into top-down cell space
  ivec2 c = ivec2(f.x / uCellDev, (uTop - 1 - f.y) / uCellDev);
  c = clamp(c, ivec2(0), uGrid - 1);

  bool useAscii = uFullAscii == 1;
  bool rimHighlight = false;
  if (!useAscii && uLens.z > 0.0 && uLens.w > 0.005) {

    float th = (float(BAYER[((c.y & 3) << 2) | (c.x & 3)]) + 0.5) / 16.0;
    float edgeR = 1.0 - (5.0 / uLens.z) * th;
    useAscii = (r < edgeR) && (uLens.w >= th);
    rimHighlight = !useAscii && (r < 1.0 + 1.1 / uLens.z) && (r >= edgeR) && (uLens.w >= th) && ((c.x + c.y) & 1) == 0;

  if (useAscii) {
    ivec2 gc = clamp(c / ivec2(6, 9), ivec2(0), uLGrid - 1);
    ivec2 q = c - gc * ivec2(6, 9);
    ivec4 g = ivec4(texelFetch(uGly, gc, 0) * 255.0 + 0.5);
    int gIdx = clamp(g.x, 0, 9);
    int lt = clamp(g.y, 0, 7);
    int ut = clamp(g.z, 0, 7);
    int at = clamp(g.w, 0, 4);
    bool on = false;
    if (q.x < 5 && q.y < 7) {
      int b = q.y * 5 + q.x;
      uint wd = b < 20 ? GLYPH[gIdx * 2] : GLYPH[gIdx * 2 + 1];
      on = ((wd >> uint(b < 20 ? 19 - b : 34 - b)) & 1u) == 1u;
    }

    oc = vec4(on ? fg : uTone[ut], 1.0);
  } else {
    vec3 skyCol = texelFetch(uTex, c, 0).rgb;
    if (rimHighlight) {
      skyCol = mix(skyCol, uTone[6], 0.28);
    }
    oc = vec4(skyCol, 1.0);
  }
}`;

  function initWebGL2(canvas) {
    const gl = canvas.getContext('webgl2', {
      alpha: false,
      antialias: false,
      depth: false,
      stencil: false,
      powerPreference: 'high-performance',
      preserveDrawingBuffer: false,
    });
    if (!gl) return null;

    const compile = (type, src) => {
      const sh = gl.createShader(type);
      gl.shaderSource(sh, src);
      gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
        const log = gl.getShaderInfoLog(sh) || 'Shader compile error';
        gl.deleteShader(sh);
        throw new Error(log);
      }
      return sh;
    };

    const link = (vsSrc, fsSrc) => {
      const vs = compile(gl.VERTEX_SHADER, vsSrc);
      const fs = compile(gl.FRAGMENT_SHADER, fsSrc);
      const p = gl.createProgram();
      gl.attachShader(p, vs);
      gl.attachShader(p, fs);
      gl.linkProgram(p);
      gl.deleteShader(vs);
      gl.deleteShader(fs);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
        const log = gl.getProgramInfoLog(p) || 'Program link error';
        gl.deleteProgram(p);
        throw new Error(log);
      }
      return p;
    };

    let pField, pGlyph, pBlit, vao, fboSky, texSky, fboGly, texGly;
    let uF = {}, uG = {}, uB = {};
    let lost = false;

    const makeFBO = (w, h) => {
      const tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      const fbo = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
      return { fbo, tex };
    };

    const buildResources = () => {
      pField = link(VS_FULL, FS_FIELD);
      pGlyph = link(VS_FULL, FS_GLYPH);
      pBlit  = link(VS_FULL, FS_BLIT);
      vao = gl.createVertexArray();

      const getU = (p, names) => {
        const o = {};
        for (const n of names) o[n] = gl.getUniformLocation(p, n);
        return o;
      };
      uF = getU(pField, ['uRes','uCell','uTime','uDusk','uDawn','uSun','uSunLow','uMoon','uMoonL','uStarVis','uMwVis','uAurParam','uHzParam','uPtr','uMeteor','uMeteorT','uDim','uDimN','uTone','uAur']);
      uG = getU(pGlyph, ['uTex','uLens','uGrid','uFullAscii','uDusk']);
      uB = getU(pBlit,  ['uTex','uGly','uCellDev','uTop','uGrid','uLGrid','uLens','uFullAscii','uTone','uAur']);

      const flatTone = new Float32Array(TONE_RGB01.flat());
      const flatAur  = new Float32Array(AUR_RGB01.flat());

      gl.useProgram(pField);
      gl.uniform3fv(uF.uTone, flatTone);
      gl.uniform3fv(uF.uAur, flatAur);

      gl.useProgram(pGlyph);
      gl.uniform1i(uG.uTex, 0);

      gl.useProgram(pBlit);
      gl.uniform1i(uB.uTex, 0);
      gl.uniform1i(uB.uGly, 1);
      gl.uniform3fv(uB.uTone, flatTone);
      gl.uniform3fv(uB.uAur, flatAur);

      resizeTargets();
    };

    const resizeTargets = () => {
      if (lost) return;
      if (texSky) gl.deleteTexture(texSky);
      if (fboSky) gl.deleteFramebuffer(fboSky);
      if (texGly) gl.deleteTexture(texGly);
      if (fboGly) gl.deleteFramebuffer(fboGly);
      ({ fbo: fboSky, tex: texSky } = makeFBO(S.gw, S.gh));
      ({ fbo: fboGly, tex: texGly } = makeFBO(S.lw, S.lh));
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    };

    buildResources();

    canvas.addEventListener('webglcontextlost', (e) => {
      e.preventDefault();
      lost = true;
    });
    canvas.addEventListener('webglcontextrestored', () => {
      lost = false;
      buildResources();
      S.needsRender = true;
    });

    return {
      resize: resizeTargets,
      render(atm) {
        if (lost) return;
        gl.bindVertexArray(vao);

        const lensRadiusCss = clamp(Math.min(S.vw, S.vh) * 0.145, 96, 150);
        const lensCx = S.ptrX / S.cell;
        const lensCy = S.ptrY / S.cell;
        const lensR  = lensRadiusCss / S.cell;
        const fullFlag = S.fullAscii ? 1 : 0;

        // Pass 1: FIELD -> fboSky (gw x gh, top-down)
        gl.bindFramebuffer(gl.FRAMEBUFFER, fboSky);
        gl.viewport(0, 0, S.gw, S.gh);
        gl.useProgram(pField);
        gl.uniform2f(uF.uRes, S.vw, S.vh);
        gl.uniform1f(uF.uCell, S.cell);
        gl.uniform1f(uF.uTime, S.time);
        gl.uniform1f(uF.uDusk, atm.dusk);
        gl.uniform1f(uF.uDawn, atm.dawnGlow);
        gl.uniform4f(uF.uSun, atm.sunX, atm.sunY, atm.sunR, atm.sunVis);
        gl.uniform1f(uF.uSunLow, atm.sunLow);
        gl.uniform4f(uF.uMoon, atm.moonX, atm.moonY, atm.moonR, atm.moonVis);
        gl.uniform3f(uF.uMoonL, atm.moonL[0], atm.moonL[1], atm.moonL[2]);
        gl.uniform1f(uF.uStarVis, atm.starVis);
        gl.uniform1f(uF.uMwVis, atm.mwVis);
        gl.uniform2f(uF.uAurParam, atm.auroraVis, atm.aurY);
        gl.uniform2f(uF.uHzParam, atm.hzVis, atm.hzY);
        gl.uniform3f(uF.uPtr, S.ptrX, S.ptrY, S.ptrEnergy);
        gl.uniform4f(uF.uMeteor, S.meteorStartX, S.meteorStartY, S.meteorDirX, S.meteorDirY);
        gl.uniform2f(uF.uMeteorT, S.meteorAge / Math.max(S.meteorDur, 0.01), S.meteorActive ? 1.0 : 0.0);
        gl.uniform4fv(uF.uDim, S.dimRects);
        gl.uniform1i(uF.uDimN, S.dimCount);
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        // Pass 2: GLYPHPASS -> fboGly (lw x lh, top-down)
        if (fullFlag === 1 || S.lensFade > 0.005) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, fboGly);
          gl.viewport(0, 0, S.lw, S.lh);
          gl.useProgram(pGlyph);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, texSky);
          gl.uniform4f(uG.uLens, lensCx, lensCy, lensR, S.lensFade);
          gl.uniform2i(uG.uGrid, S.gw, S.gh);
          gl.uniform1i(uG.uFullAscii, fullFlag);
          gl.uniform1f(uG.uDusk, atm.dusk);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }

        // Pass 3: BLIT -> Screen Framebuffer (dw x dh, flips Y once)
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, S.dw, S.dh);
        gl.useProgram(pBlit);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, texSky);
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, texGly);
        gl.uniform1i(uB.uCellDev, S.cellDev);
        gl.uniform1i(uB.uTop, S.dh);
        gl.uniform2i(uB.uGrid, S.gw, S.gh);
        gl.uniform2i(uB.uLGrid, S.lw, S.lh);
        gl.uniform4f(uB.uLens, lensCx, lensCy, lensR, S.lensFade);
        gl.uniform1i(uB.uFullAscii, fullFlag);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      },
    };
  }

  // =========================================================================
  // 2D Canvas Fallback (Precomputed Periodic FBM LUTs + Separable [data-dim] + 5x7 ASCII)
  // =========================================================================
  function init2DFallback(canvas) {
    const ctx = canvas.getContext('2d', { alpha: false });
    const N = 256;
    const lutA = new Float32Array(N * N);
    const lutB = new Float32Array(N * N);

    const hash2 = (ix, iy, p, seed) => {
      const x = ((ix % p) + p) % p;
      const y = ((iy % p) + p) % p;
      let n = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(seed, 1442695041)) | 0;
      n = Math.imul(n ^ (n >>> 13), 1274126177);
      return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
    };
    const pNoise = (x, y, p, seed) => {
      const fx = Math.floor(x), fy = Math.floor(y);
      const tx = x - fx, ty = y - fy;
      const ux = tx * tx * (3 - 2 * tx), uy = ty * ty * (3 - 2 * ty);
      return lerp(
        lerp(hash2(fx, fy, p, seed), hash2(fx + 1, fy, p, seed), ux),
        lerp(hash2(fx, fy + 1, p, seed), hash2(fx + 1, fy + 1, p, seed), ux),
        uy
      );
    };
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const u = x / N, v = y / N;
        lutA[y * N + x] =
          0.55 * pNoise(u * 4, v * 4, 4, 7) +
          0.30 * pNoise(u * 8, v * 8, 8, 19) +
          0.15 * pNoise(u * 16, v * 16, 16, 41) - 0.5;
        lutB[y * N + x] =
          0.55 * pNoise(u * 6, v * 6, 6, 53) +
          0.30 * pNoise(u * 12, v * 12, 12, 71) +
          0.15 * pNoise(u * 24, v * 24, 24, 97) - 0.5;
      }
    }

    let img = null;
    let lBuf = null;
    let aBuf = null;
    let DX = new Float32Array(1);
    let DY = new Float32Array(1);
    const off = document.createElement('canvas');
    const offCtx = off.getContext('2d', { alpha: false });

    const resize = () => {
      off.width = S.gw;
      off.height = S.gh;
      img = offCtx.createImageData(S.gw, S.gh);
      lBuf = new Float32Array(S.gw * S.gh);
      aBuf = new Uint8Array(S.gw * S.gh);
      DX = new Float32Array(S.gw);
      DY = new Float32Array(S.gh);
    };
    resize();

    const sample = (lut, x, y) => {
      const ix = ((Math.floor(x) % N) + N) % N;
      const iy = ((Math.floor(y) % N) + N) % N;
      return lut[iy * N + ix];

      resize,
      render(atm) {

        for (let k = 0; k < S.dimCount; k++) {
          const l = S.dimRects[k * 4], t = S.dimRects[k * 4 + 1], r = S.dimRects[k * 4 + 2], b = S.dimRects[k * 4 + 3];
          for (let x = 0; x < W; x++) {
            const px = (x + 0.5) * cell;
            const d = px < l ? l - px : px > r ? px - r : 0;
            const w = Math.exp(-(d * d) / 3600);
            if (w > DX[x]) DX[x] = w;
          }
          for (let y = 0; y < H; y++) {
            const py = (y + 0.5) * cell;
            const d = py < t ? t - py : py > b ? py - b : 0;
            const w = Math.exp(-(d * d) / 3600);
            if (w > DY[y]) DY[y] = w;
          }
        }

        const dusk = atm.dusk;
        const night = dusk > 0.95 ? 1.0 : clamp(dusk * 0.92, 0, 1);

        for (let y = 0; y < H; y++) {
          const py = (y + 0.5) * cell;
          const yf = py / Math.max(S.vh, 1);
          const dy = DY[y];
          for (let x = 0; x < W; x++) {
            const px = (x + 0.5) * cell;
            const dim = DX[x] * dy;
            const th = BAYER_TH[((y & 3) << 2) | (x & 3)];
            const dm = sample(lutA, (x + S.time * 2.3) * 0.45, y * 0.95);
            const dn = sample(lutB, (x + S.time * 4.0) * 0.38, y * 1.15);
            const D = smoothstep(-0.08, 0.34, dm + yf * 0.12);
            const cl = Math.max(D, smoothstep(0.08, 0.38, dn) * 0.72);
            let v = clamp(D * 0.75 + cl * 0.25, 0, 1);
            const vd = (v > 0.28 ? 0.28 + (v - 0.28) * 0.22 : v) - 0.04;
            v = lerp(v, vd, dim * (1 - smoothstep(0.35, 0.85, dusk)));

            let L = lerp(4.0 + 2.9 * v, -0.3 + cl * 0.5, night);

            if (atm.sunVis > 0.01) {
              const dist = Math.hypot(px - atm.sunX, py - atm.sunY);
              if (dist < atm.sunR) L = Math.max(L, 7.0);
              else L = Math.max(L, (5.8 - dist / (atm.sunR * 1.4)) * atm.sunVis * (1 - 0.3 * dim));
            }
            if (atm.dawnGlow > 0.01) {
              const band = smoothstep(0.45, 0.94, yf) * atm.dawnGlow;
              L = Math.max(L, (1.5 + 4.8 * band) * (1 - 0.25 * dim));
            }
            if (atm.moonVis > 0.01) {
              const mx = (px - atm.moonX) / atm.moonR;
              const my = (py - atm.moonY) / atm.moonR;
              const mr = Math.hypot(mx, my);
              if (mr < 1) {
                const nz = Math.sqrt(Math.max(0, 1 - mr * mr));
                const lam = mx * atm.moonL[0] + my * atm.moonL[1] + nz * atm.moonL[2];

              }
            }
            let isAur = 0;
            if (atm.auroraVis > 0.05) {
              const h = H * atm.aurY - y;
              const c = Math.exp(-h * h * (h < 0 ? 0.004 : 0.0006)) * atm.auroraVis * (1 - 0.7 * dim);
              if (c > 0.22 + th * 0.2) {
                isAur = c > 0.7 ? 3 : c > 0.45 ? 2 : 1;
                L = Math.max(L, 2.5 + isAur * 1.3);
              }
            }
            if (atm.starVis > 0.2 && cl < 0.3) {
              let h = (Math.imul(x + 17, 374761393) + Math.imul(y + 31, 668265263)) | 0;
              h = Math.imul(h ^ (h >>> 13), 1274126177);
              if (((h ^ (h >>> 16)) >>> 0) / 4294967296 < 0.003) L = Math.max(L, 5.8 * atm.starVis * (1 - 0.8 * dim));
            }

            const Ls = clamp(L, 0, 7);
            const idx = y * W + x;
            lBuf[idx] = Ls;
            aBuf[idx] = isAur;
            const o = idx * 4;
            if (isAur > 0) {
              const rgb = AUR_RGB[isAur - 1];
              data[o] = rgb[0]; data[o + 1] = rgb[1]; data[o + 2] = rgb[2]; data[o + 3] = 255;
            } else {
              const lo = Math.floor(Ls);
              const ti = clamp(lo + (Ls - lo > th ? 1 : 0), 0, 7);
              const rgb = TONE_RGB[ti];
              data[o] = rgb[0]; data[o + 1] = rgb[1]; data[o + 2] = rgb[2]; data[o + 3] = 255;
            }
          }
        }

        // 5x7 ASCII overlay (full-screen or circular Bayer lens)
        const lensRadiusCss = clamp(Math.min(S.vw, S.vh) * 0.145, 96, 150);
        const lensCx = S.ptrX / cell, lensCy = S.ptrY / cell, lensR = lensRadiusCss / cell;
        if (S.fullAscii || S.lensFade > 0.01) {
          for (let gy = 0; gy < S.lh; gy++) {
            for (let gx = 0; gx < S.lw; gx++) {
              const c0x = gx * 6, c0y = gy * 9;
              if (!S.fullAscii && Math.hypot(c0x + 3 - lensCx, c0y + 4.5 - lensCy) > lensR + 8) continue;
              let sum = 0, mx = 0, n = 0, na = 0, ag = 0, nHi = 0;
              for (let yy = 0; yy < 9; yy++) {
                const sy = Math.min(c0y + yy, H - 1);
                for (let xx = 0; xx < 6; xx++) {
                  const sx = Math.min(c0x + xx, W - 1);
                  const ii = sy * W + sx;
                  const L = lBuf[ii];
                  sum += L; if (L > mx) mx = L; if (L > 3.2) nHi++; n++;
                  if (aBuf[ii] > 0) { na++; ag += L; }
                }
              }
              const m = sum / n;
              const th = BAYER_TH[((gy & 3) << 2) | (gx & 3)];
              const md = m > 0.08 ? m + (th - 0.5) * 0.9 : 0;
              let gi = 0;
              for (let i = 0; i < 9; i++) if (md > RAMP_TH[i]) gi++;
              const T = clamp(Math.floor(m + 0.5), 0, 7);
              let lt = Math.min(T + (T < 5 ? 2 : 1), 7);
              let ut = (dusk > 0.78 || (dusk > 0.62 && T <= 2)) ? 0 : Math.max(T - 1, 0);
              if (mx - m > 1.8 && m < 3.2 && mx > 3.4 && nHi <= 9) { gi = mx > 5.6 ? 7 : 6; lt = Math.min(Math.floor(mx), 7); if (dusk > 0.55) ut = 0; }
              let at = 0;
              if (na > 4) { const a = ag / na; at = a > 5.75 ? 4 : a > 4.6 ? 3 : a > 3.2 ? 2 : 1; ut = 0; if (gi < 3) gi = 3 + (na > 14 ? 1 : 0); }
              const fg = at > 0 ? AUR_RGB[at - 1] : TONE_RGB[lt];
              const bg = TONE_RGB[ut];
              const [w0, w1] = GLYPH_BITS[gi];

              for (let yy = 0; yy < 9; yy++) {
                const sy = c0y + yy; if (sy >= H) break;
                for (let xx = 0; xx < 6; xx++) {
                  const sx = c0x + xx; if (sx >= W) break;
                  if (!S.fullAscii) {
                    const r = Math.hypot(sx + 0.5 - lensCx, sy + 0.5 - lensCy) / lensR;
                    const cth = BAYER_TH[((sy & 3) << 2) | (sx & 3)];
                    if (!(r < 1 - (5 / lensR) * cth && S.lensFade >= cth)) continue;
                  }
                  let on = false;
                  if (xx < 5 && yy < 7) {
                    const b = yy * 5 + xx;
                    const wd = b < 20 ? w0 : w1;
                    on = (((wd >>> (b < 20 ? 19 - b : 34 - b)) & 1) === 1);
                  }
                  const o = (sy * W + sx) * 4;
                  const c = on ? fg : bg;
                  data[o] = c[0]; data[o + 1] = c[1]; data[o + 2] = c[2]; data[o + 3] = 255;
                }
              }
            }
          }
        }

        offCtx.putImageData(img, 0, 0);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(off, 0, 0, W, H, 0, 0, S.dw, S.dh);
      },
    };
  }

  // Safe WebGL2 init with canvas-cloning 2D fallback (Law 9)
  function initWithFallback(canvas, initGL, init2D) {
    let glCtrl = null;
    try {
      glCtrl = initGL(canvas);
    } catch (err) {
      console.error('[glacier-sky] WebGL2 init failed, falling back to 2D:', err);
      glCtrl = null;
    }
    if (glCtrl) return { ctrl: glCtrl, canvas, mode: 'webgl2' };
    const fresh = canvas.cloneNode(false);
    canvas.replaceWith(fresh);
    return { ctrl: init2D(fresh), canvas: fresh, mode: '2d' };
  }

  // =========================================================================
  // Living Cell-Grid Entities: Spring V-Formation Birds & Plane + Bayer Contrail
  // =========================================================================
  const GULL_7 = [
    ['X.....X', '.X...X.', '..XXX..'],
    ['.XX.XX.', 'X..X..X', '.......'],
    ['.......', 'X.XXX.X', '.X...X.'],
  ];
  const GULL_5 = [
    ['X...X', '.X.X.', '..X..'],
    ['.X.X.', 'X.X.X', '.....'],
    ['.....', 'X.X.X', '.X.X.'],
  ];
  const FLAP_SEQ = [0, 1, 2, 1];
  const PLANE_R = ['..X..', 'XXXXX', '..X..'];
  const PLANE_L = ['..X..', 'XXXXX', '..X..'];

  const MAX_BIRDS = 36;
  const B = {
    active: new Uint8Array(MAX_BIRDS),
    kind:   new Uint8Array(MAX_BIRDS), // 0 = flock member, 1 = burst takeoff
    flock:  new Uint8Array(MAX_BIRDS),
    size:   new Uint8Array(MAX_BIRDS), // 0 = GULL_5, 1 = GULL_7
    x:  new Float32Array(MAX_BIRDS),
    y:  new Float32Array(MAX_BIRDS),
    vx: new Float32Array(MAX_BIRDS),
    vy: new Float32Array(MAX_BIRDS),
    ox: new Float32Array(MAX_BIRDS),
    oy: new Float32Array(MAX_BIRDS),
    ph: new Float32Array(MAX_BIRDS),
    age: new Float32Array(MAX_BIRDS),
    rise: new Float32Array(MAX_BIRDS),
    flapAcc: 0,
    flapTick: 0,
  };

  const flocks = [
    { dir: 1, x: 0, y0: 0, speed: 34, amp: 14, freq: 0.42, ph: 0.4, count: 7 },
    { dir: -1, x: 0, y0: 0, speed: 27, amp: 11, freq: 0.36, ph: 2.3, count: 5 },
  ];

  const plane = {
    x: 0, y: 0, dir: 1, speed: 24,
    trailX: new Float32Array(260),
    trailY: new Float32Array(260),
    trailCount: 0,
    emitAcc: 0,
  };

  function spawnFlock(fIdx, initial) {
    const f = flocks[fIdx];
    const isMob = S.vw < 760;
    const laneMin = isMob ? 0.54 : 0.52;
    const laneMax = isMob ? 0.74 : 0.74;
    f.y0 = lerp(laneMin, laneMax, fIdx === 0 ? 0.25 : 0.78) * S.vh;
    f.x = initial
      ? (fIdx === 0 ? S.vw * 0.36 : S.vw * 0.74)
      : (f.dir > 0 ? -90 : S.vw + 90);

    // Clear existing members of this flock
    for (let i = 0; i < MAX_BIRDS; i++) {
      if (B.active[i] && B.kind[i] === 0 && B.flock[i] === fIdx) B.active[i] = 0;
    }

    const gap = Math.max(15, S.cell * 6.5);
    const armA = Math.ceil((f.count - 1) * 0.6);
    const armB = (f.count - 1) - armA;

    const slots = [[0, 0]];
    for (let r = 1; r <= armA; r++) slots.push([-f.dir * r * gap * 1.08, -r * gap * 0.62]);
    for (let r = 1; r <= armB; r++) slots.push([-f.dir * r * gap * 1.04, r * gap * 0.64]);

    let sIdx = 0;
    for (let i = 0; i < MAX_BIRDS && sIdx < slots.length; i++) {
      if (B.active[i]) continue;
      B.active[i] = 1;
      B.kind[i] = 0;
      B.flock[i] = fIdx;
      B.size[i] = fIdx === 0 ? 1 : 0;
      B.ox[i] = slots[sIdx][0];
      B.oy[i] = slots[sIdx][1];
      B.x[i] = f.x + B.ox[i];
      B.y[i] = f.y0 + B.oy[i];
      B.vx[i] = f.dir * f.speed;
      B.vy[i] = 0;
      B.ph[i] = sIdx * 1.3 + fIdx * 2.1;
      B.age[i] = 0;
      B.rise[i] = 0;
      sIdx++;
    }
  }

  function spawnClickBurst(cx, cy) {
    const dir = cx > S.vw * 0.55 ? -1 : 1;
    let spawned = 0;
    for (let i = 0; i < MAX_BIRDS && spawned < 6; i++) {
      if (B.active[i]) continue;
      const spread = (spawned - 2.5) * 14;
      B.active[i] = 1;
      B.kind[i] = 1;
      B.flock[i] = 255;
      B.size[i] = spawned % 2;
      B.x[i] = cx + (Math.random() - 0.5) * 18;
      B.y[i] = cy + (Math.random() - 0.5) * 14;
      B.vx[i] = dir * (44 + Math.random() * 26);
      B.vy[i] = -28 - Math.random() * 24;
      B.ox[i] = dir;
      B.oy[i] = spread;
      B.ph[i] = spawned * 1.7;
      B.age[i] = 0;
      B.rise[i] = 56 + Math.random() * 28;
      spawned++;
    }
  }

  function initPlane(preseed) {
    plane.dir = 1;
    plane.y = (S.vw < 760 ? 0.48 : 0.45) * S.vh;
    plane.speed = S.vw < 760 ? 18 : 26;
    plane.x = preseed ? S.vw * 0.62 : -24;
    plane.trailCount = 0;
    plane.emitAcc = 0;
    if (preseed) {
      const steps = S.vw < 760 ? 64 : 115;
      const stepPx = S.cell * 1.1;
      for (let i = steps; i >= 1; i--) {
        const px = plane.x - plane.dir * i * stepPx;
        if (px < -10) continue;
        plane.trailX[plane.trailCount] = px;
        plane.trailY[plane.trailCount] = plane.y;
        plane.trailCount++;
      }
    }
  }

  function updateEntities(dt, t) {
    // 12 fps sprite wing-flap clock
    B.flapAcc += dt * 1000;
    while (B.flapAcc >= 1000 / 12) {
      B.flapAcc -= 1000 / 12;
      B.flapTick = (B.flapTick + 1) & 3;
    }

    // Update flock anchors
    for (let fIdx = 0; fIdx < flocks.length; fIdx++) {
      const f = flocks[fIdx];
      f.x += f.dir * f.speed * dt;
      if ((f.dir > 0 && f.x > S.vw + 160) || (f.dir < 0 && f.x < -160)) {
        spawnFlock(fIdx, false);
      }
    }

    // Update birds
    const R = 130;
    for (let i = 0; i < MAX_BIRDS; i++) {
      if (!B.active[i]) continue;
      B.age[i] += dt;
      let ax = 0, ay = 0;

      if (B.kind[i] === 0) {
        const f = flocks[B.flock[i]];
        const ay0 = f.y0 + Math.sin(t * f.freq + f.ph) * f.amp;
        const avy = Math.cos(t * f.freq + f.ph) * f.amp * f.freq;
        const tx = f.x + B.ox[i] + Math.sin(t * 0.9 + B.ph[i]) * 5;
        const ty = ay0 + B.oy[i] + Math.cos(t * 1.1 + B.ph[i]) * 4;
        ax = (tx - B.x[i]) * 3.2 - B.vx[i] * 2.6 + (f.dir * f.speed) * 2.6;
        ay = (ty - B.y[i]) * 3.2 - B.vy[i] * 2.6 + avy * 2.6;
      } else {
        // Click takeoff burst: exponentially decaying upward lift into level glide
        const lift = -B.rise[i] * Math.exp(-B.age[i] * 0.75);
        ay = lift - B.vy[i] * 1.4;
        ax = (B.ox[i] * 52 - B.vx[i]) * 0.9;
        if (B.x[i] < -80 || B.x[i] > S.vw + 80 || B.y[i] < -60 || B.age[i] > 14) {
          B.active[i] = 0;
          continue;
        }
      }

      // Calm pointer veer
      if (S.ptrActive > 0.2) {
        const qx = B.x[i] - S.ptrX;
        const qy = B.y[i] - S.ptrY;
        const d = Math.hypot(qx, qy);
        if (d > 1 && d < R) {
          const w = 1 - d / R;
          ax += (qx / d) * w * 260;
          ay += (qy / d) * w * 260;
        }
      }

      B.vx[i] += ax * dt;
      B.vy[i] += ay * dt;
      B.x[i] += B.vx[i] * dt;
      B.y[i] += B.vy[i] * dt;
    }

    // Update high-altitude plane & Bayer-dissolving contrail
    plane.x += plane.dir * plane.speed * dt;
    plane.emitAcc += dt * plane.speed;
    if (plane.emitAcc >= S.cell * 0.95) {
      plane.emitAcc = 0;
      if (plane.trailCount < plane.trailX.length) {
        plane.trailX[plane.trailCount] = plane.x - plane.dir * S.cell * 3;
        plane.trailY[plane.trailCount] = plane.y;
        plane.trailCount++;
      } else {
        plane.trailX.copyWithin(0, 1);
        plane.trailY.copyWithin(0, 1);
        plane.trailX[plane.trailX.length - 1] = plane.x - plane.dir * S.cell * 3;
        plane.trailY[plane.trailY.length - 1] = plane.y;
      }
    }
    if (plane.x > S.vw + 260) {
      initPlane(false);
    }
  }

  function drawEntities(ctx, atm) {
    ctx.clearRect(0, 0, S.gw, S.gh);

    // Contrail + high-altitude plane (on exact cell grid; at full night, a distant nav light instead of a dark contrail)
    const pcx = Math.round(plane.x / S.cell);
    const pcy = Math.round(plane.y / S.cell);
    if (atm.dusk > 0.78) {
      if (pcx >= 0 && pcx < S.gw && pcy >= 0 && pcy < S.gh) {
        ctx.fillStyle = TONE_HEX[6];
        ctx.fillRect(pcx, pcy, 1, 1);
        if ((S.clock % 1.3) < 0.18 && pcx - plane.dir * 2 >= 0 && pcx - plane.dir * 2 < S.gw) {
          ctx.fillStyle = TONE_HEX[7];
          ctx.fillRect(pcx - plane.dir * 2, pcy, 1, 1);
        }
      }
    } else {
      const contrailTone = atm.dusk > 0.42 ? TONE_HEX[6] : TONE_HEX[7];
      const contrailSoft = atm.dusk > 0.42 ? TONE_HEX[5] : TONE_HEX[6];
      const dayFade = Math.max(0, Math.min(1, (0.78 - atm.dusk) / 0.28));
      const nTrail = plane.trailCount;
      for (let i = 0; i < nTrail; i++) {
        const age = 1 - i / Math.max(nTrail, 1); // 0 = newest, 1 = oldest
        const rampIn = Math.min(1, (nTrail - i) / 5);
        const keep = (1 - age) * rampIn * 0.96 * dayFade;
        const cx = Math.round(plane.trailX[i] / S.cell);
        const cy = Math.round(plane.trailY[i] / S.cell);
        if (cx < 0 || cx >= S.gw || cy < 0 || cy >= S.gh) continue;
        const th0 = BAYER_TH[((cy & 3) << 2) | (cx & 3)];
        if (keep > th0) {
          ctx.fillStyle = age < 0.35 ? contrailTone : contrailSoft;
          ctx.fillRect(cx, cy, 1, 1);
        }
        if (age > 0.3 && cy + 1 < S.gh) {
          const th1 = BAYER_TH[(((cy + 1) & 3) << 2) | (cx & 3)];
          if (keep * 0.7 > th1) {
            ctx.fillStyle = contrailSoft;
            ctx.fillRect(cx, cy + 1, 1, 1);
          }
        }
      }

      // Plane silhouette
      if (pcx >= -4 && pcx < S.gw + 4) {
        const sprite = plane.dir > 0 ? PLANE_R : PLANE_L;
        ctx.fillStyle = atm.dusk > 0.6 ? TONE_HEX[6] : TONE_HEX[2];
        for (let r = 0; r < sprite.length; r++) {
          const row = sprite[r];
          for (let c = 0; c < row.length; c++) {
            if (row[c] === 'X') ctx.fillRect(pcx - 2 + c, pcy - 1 + r, 1, 1);
          }
        }
      }
    }

    // Birds (roost quietly at deep night, crisp silhouettes by day/dusk/dawn)
    if (atm.dusk > 0.84) return;
    const birdCol = atm.dusk > 0.5 ? TONE_HEX[1] : TONE_HEX[2];
    const birdHighlight = atm.dusk > 0.5 ? TONE_HEX[3] : TONE_HEX[1];

    for (let i = 0; i < MAX_BIRDS; i++) {
      if (!B.active[i]) continue;
      const cx = Math.round(B.x[i] / S.cell);
      const cy = Math.round(B.y[i] / S.cell);
      if (cx < -6 || cx > S.gw + 6 || cy < -6 || cy > S.gh + 6) continue;
      const frame = FLAP_SEQ[(B.flapTick + (Math.floor(B.ph[i]) & 3)) & 3];
      const spr = B.size[i] ? GULL_7[frame] : GULL_5[frame];
      const hw = spr[0].length >> 1;
      ctx.fillStyle = B.size[i] ? birdHighlight : birdCol;
      for (let r = 0; r < spr.length; r++) {
        const row = spr[r];
        for (let c = 0; c < row.length; c++) {
          if (row[c] === 'X') ctx.fillRect(cx - hw + c, cy - 1 + r, 1, 1);
        }
      }
    }
  }

  // =========================================================================
  // Shooting Star Scheduler (Deep Night Only)
  // =========================================================================
  function updateMeteor(dt, atm) {
    if (atm.starVis < 0.72) {
      S.meteorActive = false;
      S.meteorCooldown = 1.6;
      return;
    }
    if (S.meteorActive) {
      S.meteorAge += dt;
      if (S.meteorAge >= S.meteorDur) {
        S.meteorActive = false;
        S.meteorCooldown = 4.0 + Math.random() * 6.5;
      }
    } else {
      S.meteorCooldown -= dt;
      if (S.meteorCooldown <= 0) {
        S.meteorActive = true;
        S.meteorAge = 0;
        S.meteorDur = 0.75 + Math.random() * 0.45;
        S.meteorStartX = S.gw * (0.42 + Math.random() * 0.44);
        S.meteorStartY = S.gh * (0.06 + Math.random() * 0.24);
        const ang = (Math.PI * 0.68) + (Math.random() - 0.5) * 0.35;
        S.meteorDirX = Math.cos(ang);
        S.meteorDirY = Math.sin(ang);
      }
    }
  }

  // =========================================================================
  // UI Controls & Dock Synchronization
  // =========================================================================
  const scrubber = document.getElementById('time-scrubber');
  const clockEl  = document.getElementById('time-clock');
  const presetBtns = [...document.querySelectorAll('button[data-preset]')];
  const cycleBtn = document.querySelector('button[data-action="cycle"]');
  const asciiBtn = document.querySelector('button[data-action="ascii"]');

  function formatClock(hour) {
    const h = ((hour % 24) + 24) % 24;
    const hh = Math.floor(h);
    const mm = Math.floor((h - hh) * 60);
    return String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
  }

  function syncUI() {
    scrubber.value = S.hour.toFixed(2);
    clockEl.textContent = formatClock(S.hour);
    let closest = null;
    for (const [k, v] of Object.entries(PRESETS)) {
      const diff = Math.min(Math.abs(S.hour - v), 24 - Math.abs(S.hour - v));
      if (diff < 0.45) closest = k;
    }
    for (const btn of presetBtns) {
      btn.setAttribute('aria-pressed', String(btn.dataset.preset === closest));
    }
    cycleBtn.setAttribute('aria-pressed', String(S.cycle));
    asciiBtn.setAttribute('aria-pressed', String(S.fullAscii));
  }

  for (const btn of presetBtns) {
    btn.addEventListener('click', () => {
      S.hour = PRESETS[btn.dataset.preset];
      S.cycle = false;
      S.needsRender = true;
      syncUI();
      if (reducedMotion) renderSingleFrame();
    });
  }

  scrubber.addEventListener('input', () => {
    S.hour = parseFloat(scrubber.value);
    S.cycle = false;
    S.needsRender = true;
    syncUI();
    if (reducedMotion) renderSingleFrame();
  });

  cycleBtn.addEventListener('click', () => {
    S.cycle = !S.cycle;
    S.needsRender = true;
    syncUI();
  });

  asciiBtn.addEventListener('click', () => {
    S.fullAscii = !S.fullAscii;
    S.needsRender = true;
    syncUI();
    if (reducedMotion) renderSingleFrame();
  });

  // Pointer & click interactions
  const dockEl = document.querySelector('.dock');
  window.addEventListener('pointermove', (e) => {
    // Softly deactivate lens at viewport extreme corner (e.g. browser chrome or automated off-center park)
    if (e.clientX <= 14 && e.clientY <= 14) {
      S.ptrActive = 0;
      S.needsRender = true;
      return;
    }
    S.ptrTargetX = e.clientX;
    S.ptrTargetY = e.clientY;
    if (S.ptrX < -500) { S.ptrX = e.clientX; S.ptrY = e.clientY; }
    S.ptrActive = 1;
    S.needsRender = true;
    if (reducedMotion) {
      S.ptrX = S.ptrTargetX;
      S.ptrY = S.ptrTargetY;
      S.lensFade = 1;
      S.ptrEnergy = 1;
      renderSingleFrame();
    }
  }, { passive: true });

  document.addEventListener('pointerleave', () => {
    S.ptrActive = 0;
    S.needsRender = true;
  });

  window.addEventListener('click', (e) => {
    if (dockEl.contains(e.target)) return;
    if (!reducedMotion) spawnClickBurst(e.clientX, e.clientY);
  });

  // =========================================================================
  // Boot & Frame Loop
  // =========================================================================
  let skyCanvas = document.getElementById('sky');
  const entCanvas = document.getElementById('entities');
  const entCtx = entCanvas.getContext('2d');

  initKineticType();
  computeGrid(skyCanvas, entCanvas);

  const engine = initWithFallback(skyCanvas, initWebGL2, init2DFallback);
  skyCanvas = engine.canvas;

  spawnFlock(0, true);
  spawnFlock(1, true);
  initPlane(true);
  syncUI();

  window.addEventListener('resize', () => {
    computeGrid(skyCanvas, entCanvas);
    engine.ctrl.resize();
    spawnFlock(0, true);
    spawnFlock(1, true);
    initPlane(true);
    if (reducedMotion) renderSingleFrame();
  });

  rmQuery.addEventListener('change', (e) => {
    reducedMotion = e.matches;
    if (reducedMotion) renderSingleFrame();
    else { lastTs = performance.now(); rafId = requestAnimationFrame(tick); }
  });

  let lastTs = performance.now();
  let rafId = 0;

  function renderSingleFrame() {
    readDimRects();
    const atm = computeAtmosphere(S.hour, S.vw, S.vh);
    engine.ctrl.render(atm);
    drawEntities(entCtx, atm);
    S.needsRender = false;
  }

  function tick(ts) {
    rafId = requestAnimationFrame(tick);
    if (document.hidden || reducedMotion) return;

    const dt = Math.min(0.05, Math.max(0.001, (ts - lastTs) / 1000));
    lastTs = ts;

    // Read DOM rects once at top of frame before any writes
    if (S.dimDirty) readDimRects();

    S.time += dt;
    if (S.cycle) {
      S.hour = (S.hour + dt * 0.42) % 24;
      syncUI();
    }

    // Exponential pointer & lens easing
    const ease = 1 - Math.exp(-dt * 9);
    if (S.ptrActive > 0.5) {
      S.ptrX += (S.ptrTargetX - S.ptrX) * ease;
      S.ptrY += (S.ptrTargetY - S.ptrY) * ease;
    }
    const targetFade = S.ptrActive > 0.5 ? 1 : 0;
    S.lensFade += (targetFade - S.lensFade) * (1 - Math.exp(-dt * 8));
    if (S.lensFade < 0.004 && targetFade === 0) S.lensFade = 0;
    S.ptrEnergy += (targetFade - S.ptrEnergy) * (1 - Math.exp(-dt * 7));

    const atm = computeAtmosphere(S.hour, S.vw, S.vh);
    updateMeteor(dt, atm);
    updateEntities(dt, S.time);

    engine.ctrl.render(atm);
    drawEntities(entCtx, atm);
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && !reducedMotion) {
      lastTs = performance.now();
    }
  });

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => {
      S.dimDirty = true;
      if (reducedMotion) renderSingleFrame();
    });
  }

  // Render first frame immediately; freeze under reduced motion
  renderSingleFrame();
  if (!reducedMotion) {
    lastTs = performance.now();
    rafId = requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
