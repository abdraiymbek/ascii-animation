<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>3D Orbital Singularity — SDF Raymarched ASCII &amp; Braille</title>
<style>
  :root {
    --ground: #070608;
    --tone-1: #16110E;
    --tone-2: #2C1D14;
    --tone-3: #52311B;
    --tone-4: #874B20;
    --tone-5: #C4732B;
    --tone-6: #EDA958;
    --tone-7: #FFF3DC;
    --surface: rgba(22, 17, 14, 0.62);
    --surface-hover: rgba(44, 29, 20, 0.78);
    --border: rgba(237, 169, 88, 0.19);
    --border-active: rgba(255, 243, 220, 0.48);
    --ink: #FFF3DC;
    --ink-dim: rgba(237, 169, 88, 0.78);
    --ink-muted: rgba(237, 169, 88, 0.50);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }

  *, *::before, *::after {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  #stage {
    position: fixed;
    inset: 0;
    display: block;
    width: 100vw;
    height: 100dvh;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
    cursor: grab;
  }

  #stage.dragging {
    cursor: grabbing;
  }

  .hud-top {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    left: max(18px, env(safe-area-inset-left));
    right: max(18px, env(safe-area-inset-right));
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    pointer-events: none;
    z-index: 10;
  }

  .title-block {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 4px 6px;
    text-shadow: 0 1px 8px rgba(7, 6, 8, 0.85);
  }

  .kicker {
    font-size: 10px;
    line-height: 1.2;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--tone-6);
  }

  .title {
    margin: 0;
    font-size: 14px;
    font-weight: 500;
    line-height: 1.25;
    letter-spacing: 0.05em;
    color: var(--ink);
  }

  .spec {
    font-size: 11px;
    line-height: 1.3;
    letter-spacing: 0.03em;
    color: var(--ink-dim);
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    pointer-events: auto;
    flex-shrink: 0;
  }

  .icon-btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-dim);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 6px 11px;
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: color 140ms ease, border-color 140ms ease, background 140ms ease;
  }

  .icon-btn:hover {
    color: var(--ink);
    background: var(--surface-hover);
    border-color: var(--border-active);
  }

  .icon-btn[aria-pressed="true"] {
    color: var(--ink);
    border-color: var(--border-active);
    background: rgba(82, 49, 27, 0.56);
  }

  .dock-wrap {
    position: fixed;
    left: 50%;
    bottom: max(16px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    max-width: calc(100vw - 24px);
    z-index: 10;
    pointer-events: none;
  }

  .dock {
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 4px;
    padding: 5px 7px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .dock-group {
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .dock-sep {
    width: 1px;
    height: 16px;
    margin: 0 5px;
    background: rgba(237, 169, 88, 0.22);
  }

  .pill-btn {
    appearance: none;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink-dim);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    padding: 6px 11px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: color 140ms ease, border-color 140ms ease, background 140ms ease;
  }

  .pill-btn:hover {
    color: var(--ink);
    background: rgba(82, 49, 27, 0.34);
  }

  .pill-btn[aria-pressed="true"] {
    color: var(--ink);
    background: rgba(135, 75, 32, 0.44);
    border-color: var(--border-active);
  }

  .hint {
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--ink-muted);
    text-align: center;
    text-shadow: 0 1px 6px rgba(7, 6, 8, 0.9);
  }

  @media (max-width: 680px) {
    .hud-top {
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      gap: 8px;
    }

    .title {
      font-size: 13px;
    }

    .spec {
      font-size: 10px;
    }

    .icon-btn {
      padding: 5px 9px;
      font-size: 9px;
    }

    .dock {
      border-radius: 16px;
      padding: 6px 7px;
      gap: 5px;
      max-width: calc(100vw - 20px);
    }

    .dock-sep {
      display: none;
    }

    .pill-btn {
      font-size: 10px;
      padding: 5px 9px;
    }

    .hint {
      display: none;
    }
  }
</style>
</head>
<body>
<canvas id="stage" aria-label="3D Orbital Singularity SDF raymarched ASCII and Braille interactive showcase"></canvas>

<header class="hud-top">
  <div class="title-block" data-dim>
    <span class="kicker" id="hud-kicker">ORBITAL SINGULARITY</span>
    <h1 class="title" id="hud-title">Event Horizon &amp; Accretion Disk</h1>
    <span class="spec" id="hud-spec">Gravitational Lensing · Doppler Beaming · Bayer Luminance ASCII</span>
  </div>
  <div class="top-actions">
    <button type="button" class="icon-btn" id="btn-orbit" aria-pressed="true" title="Toggle auto-orbit (Space)">Orbit</button>
    <button type="button" class="icon-btn" id="btn-reset" title="Reset camera (R)">Reset</button>
  </div>
</header>

<div class="dock-wrap">
  <nav class="dock" aria-label="Sculpture and render mode controls">
    <div class="dock-group" role="group" aria-label="3D Sculpture">
      <button type="button" class="pill-btn" data-sculpture="0" aria-pressed="true">Singularity</button>
      <button type="button" class="pill-btn" data-sculpture="1" aria-pressed="false">Torus Knot</button>
      <button type="button" class="pill-btn" data-sculpture="2" aria-pressed="false">Exoplanet</button>
    </div>
    <span class="dock-sep" aria-hidden="true"></span>
    <div class="dock-group" role="group" aria-label="Render Mode">
      <button type="button" class="pill-btn" data-mode="0" aria-pressed="true">Luminance</button>
      <button type="button" class="pill-btn" data-mode="1" aria-pressed="false">Contour</button>
      <button type="button" class="pill-btn" data-mode="2" aria-pressed="false">2&times;4 Braille</button>
    </div>
  </nav>
  <div class="hint" data-dim>Drag to orbit &middot; Scroll to zoom &middot; 1&ndash;3 sculpture &middot; Q/W/E mode</div>
</div>

<script>
(() => {
  'use strict';

  const LADDER_HEX = [
    '#070608', '#16110E', '#2C1D14', '#52311B',
    '#874B20', '#C4732B', '#EDA958', '#FFF3DC',
  ];

  const LADDER_RGB = LADDER_HEX.map((hex) => [
    parseInt(hex.slice(1, 3), 16) / 255,
    parseInt(hex.slice(3, 5), 16) / 255,
    parseInt(hex.slice(5, 7), 16) / 255,
  ]);

  const SCULPTURE_META = [
    {
      kicker: 'ORBITAL SINGULARITY',
      title: 'Event Horizon & Accretion Disk',
      desc: 'Gravitational Lensing · Doppler Beaming',
      yaw: 0.28,
      pitch: 0.23,
      dist: 5.55,
    },
    {
      kicker: 'BRAIDED SDF TOPOLOGY',
      title: 'Twisted (2,3) Torus Knot',
      desc: 'Camera Chiaroscuro · Fresnel Rim & AO',
      yaw: 0.42,
      pitch: 0.30,
      dist: 5.05,
    },
    {
      kicker: 'KEPLERIAN EXOPLANET',
      title: 'Ringed Gas Giant & Moon',
      desc: 'FBM Bands · Cassini Division · Cast Shadows',
      yaw: 0.34,
      pitch: 0.27,
      dist: 5.65,
    },
  ];

  const MODE_META = [
    'Bayer Luminance ASCII',
    'Directional Contour ASCII',
    'Zero-Readback GPU 2×4 Braille',
  ];

  const MAX_PIXELS = 3840 * 2400;
  const reducedMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');

  const state = {
    sculpture: 0,
    mode: 0,
    autoOrbit: !reducedMotionQuery.matches,
    reducedMotion: reducedMotionQuery.matches,
    time: 2.4,
    yaw: SCULPTURE_META[0].yaw,
    pitch: SCULPTURE_META[0].pitch,
    dist: SCULPTURE_META[0].dist,
    targetYaw: SCULPTURE_META[0].yaw,
    targetPitch: SCULPTURE_META[0].pitch,
    targetDist: SCULPTURE_META[0].dist,
    hoverX: 0,
    hoverY: 0,
    targetHoverX: 0,
    targetHoverY: 0,
    dragging: false,
    lastPtrX: 0,
    lastPtrY: 0,
    needsRender: true,
    hidden: document.hidden,
  };

  let canvas = document.getElementById('stage');
  const hudKicker = document.getElementById('hud-kicker');
  const hudTitle = document.getElementById('hud-title');
  const hudSpec = document.getElementById('hud-spec');
  const btnOrbit = document.getElementById('btn-orbit');
  const btnReset = document.getElementById('btn-reset');
  const sculptureBtns = [...document.querySelectorAll('[data-sculpture]')];
  const modeBtns = [...document.querySelectorAll('[data-mode]')];

  function updateHud() {
    const sm = SCULPTURE_META[state.sculpture];
    hudKicker.textContent = sm.kicker;
    hudTitle.textContent = sm.title;
    hudSpec.textContent = `${sm.desc} · ${MODE_META[state.mode]}`;
    sculptureBtns.forEach((b) => {
      b.setAttribute('aria-pressed', String(Number(b.dataset.sculpture) === state.sculpture));
    });
    modeBtns.forEach((b) => {
      b.setAttribute('aria-pressed', String(Number(b.dataset.mode) === state.mode));
    });
    btnOrbit.setAttribute('aria-pressed', String(state.autoOrbit));
    btnOrbit.textContent = state.autoOrbit ? 'Orbit' : 'Paused';
  }

  function selectSculpture(idx) {
    if (idx < 0 || idx > 2) return;
    state.sculpture = idx;
    const sm = SCULPTURE_META[idx];
    state.targetYaw = sm.yaw;
    state.targetPitch = sm.pitch;
    state.targetDist = sm.dist;
    if (state.reducedMotion) {
      state.yaw = sm.yaw;
      state.pitch = sm.pitch;
      state.dist = sm.dist;
    }
    state.needsRender = true;
    updateHud();
  }

  function selectMode(idx) {
    if (idx < 0 || idx > 2) return;
    state.mode = idx;
    state.needsRender = true;
    updateHud();
  }

  function resetCamera() {
    const sm = SCULPTURE_META[state.sculpture];
    state.targetYaw = sm.yaw;
    state.targetPitch = sm.pitch;
    state.targetDist = sm.dist;
    state.targetHoverX = 0;
    state.targetHoverY = 0;
    if (state.reducedMotion) {
      state.yaw = sm.yaw;
      state.pitch = sm.pitch;
      state.dist = sm.dist;
      state.hoverX = 0;
      state.hoverY = 0;
    }
    state.needsRender = true;
  }

  sculptureBtns.forEach((b) => {
    b.addEventListener('click', () => selectSculpture(Number(b.dataset.sculpture)));
  });

  modeBtns.forEach((b) => {
    b.addEventListener('click', () => selectMode(Number(b.dataset.mode)));
  });

  btnOrbit.addEventListener('click', () => {
    state.autoOrbit = !state.autoOrbit;
    state.needsRender = true;
    updateHud();
  });

  btnReset.addEventListener('click', resetCamera);

  window.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === '1') selectSculpture(0);
    else if (k === '2') selectSculpture(1);
    else if (k === '3') selectSculpture(2);
    else if (k === 'q') selectMode(0);
    else if (k === 'w') selectMode(1);
    else if (k === 'e') selectMode(2);
    else if (k === 'r') resetCamera();
    else if (e.code === 'Space') {
      e.preventDefault();
      state.autoOrbit = !state.autoOrbit;
      state.needsRender = true;
      updateHud();
    }
  });

  reducedMotionQuery.addEventListener('change', (ev) => {
    state.reducedMotion = ev.matches;
    if (state.reducedMotion) {
      state.autoOrbit = false;
    }
    state.needsRender = true;
    updateHud();
  });

  document.addEventListener('visibilitychange', () => {
    state.hidden = document.hidden;
    if (!state.hidden) state.needsRender = true;
  });

  function bindCanvasInteractions(cv) {
    cv.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 && e.pointerType === 'mouse') return;
      state.dragging = true;
      state.lastPtrX = e.clientX;
      state.lastPtrY = e.clientY;
      cv.classList.add('dragging');
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
      state.needsRender = true;
    });

    cv.addEventListener('pointermove', (e) => {
      const vw = Math.max(window.innerWidth, 1);
      const vh = Math.max(window.innerHeight, 1);
      if (state.dragging) {
        const dx = e.clientX - state.lastPtrX;
        const dy = e.clientY - state.lastPtrY;
        state.lastPtrX = e.clientX;
        state.lastPtrY = e.clientY;
        state.targetYaw -= dx * 0.0075;
        state.targetPitch = Math.max(-1.22, Math.min(1.22, state.targetPitch + dy * 0.0065));
        if (state.reducedMotion) {
          state.yaw = state.targetYaw;
          state.pitch = state.targetPitch;
        }
        state.needsRender = true;
      } else {
        const nx = (e.clientX / vw) * 2 - 1;
        const ny = (e.clientY / vh) * 2 - 1;
        state.targetHoverX = nx;
        state.targetHoverY = ny;
        if (!state.reducedMotion) {
          state.needsRender = true;
        }
      }
    });

    const endDrag = (e) => {
      if (!state.dragging) return;
      state.dragging = false;
      cv.classList.remove('dragging');
      try { cv.releasePointerCapture(e.pointerId); } catch (_) {}
      state.needsRender = true;
    };

    cv.addEventListener('pointerup', endDrag);
    cv.addEventListener('pointercancel', endDrag);
    cv.addEventListener('pointerleave', () => {
      state.targetHoverX = 0;
      state.targetHoverY = 0;
      if (!state.reducedMotion) state.needsRender = true;
    });

    cv.addEventListener('wheel', (e) => {
      e.preventDefault();
      state.targetDist = Math.max(3.6, Math.min(8.4, state.targetDist + e.deltaY * 0.0032));
      if (state.reducedMotion) state.dist = state.targetDist;
      state.needsRender = true;
    }, { passive: false });
  }

  function computeGridMetrics() {
    const vw = Math.max(1, window.innerWidth);
    const vh = Math.max(1, window.innerHeight);
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const cellCss = vw < 760 ? 1 : 2;
    let cw = Math.round(vw * dpr);
    let ch = Math.round(vh * dpr);
    let scale = 1;
    if (cw * ch > MAX_PIXELS) {
      scale = Math.sqrt(MAX_PIXELS / (cw * ch));
      cw = Math.max(1, Math.floor(cw * scale));
      ch = Math.max(1, Math.floor(ch * scale));
    }
    const cellDev = Math.max(1, Math.round(cellCss * dpr * scale));
    const gw = Math.max(12, Math.ceil(cw / cellDev));
    const gh = Math.max(12, Math.ceil(ch / cellDev));
    const glw = Math.max(2, Math.ceil(gw / 6));
    const glh = Math.max(2, Math.ceil(gh / 9));
    return { vw, vh, dpr, cellCss, cellDev, cw, ch, gw, gh, glw, glh };
  }

  // =========================================================================
  // WebGL2 3-Pass Pixel-Locked Raymarched SDF Engine
  // Pass 1 (FIELD): RGBA8 G-buffer (L/7, nx*0.5+0.5, ny*0.5+0.5, edgeStr)
  // Pass 2 (GLYPHPASS): 6x9 tile Luminance / Directional Contour selection
  // Pass 3 (BLIT): Single y-flip, packed 5x7 GLYPH_17 or 5x9 GPU 2x4 Braille
  // =========================================================================

  const VERT_SRC = `#version 300 es
precision highp float;
const vec2 POS[3] = vec2[3](vec2(-1.0, -1.0), vec2(3.0, -1.0), vec2(-1.0, 3.0));
void main() {
  gl_Position = vec4(POS[gl_VertexID], 0.0, 1.0);
}`;

  const FIELD_FRAG_SRC = `#version 300 es
precision highp float;
precision highp int;

uniform ivec2 uGrid;
uniform float uTime;
uniform float uYaw;
uniform float uPitch;
uniform float uDist;
uniform int uSculpture;
out vec4 oc;

uint pcg(uint v) {
  uint state = v * 747796405u + 2891336453u;
  uint word = ((state >> ((state >> 28u) + 4u)) ^ state) * 277803737u;
  return (word >> 22u) ^ word;
}

uint pcg2(uvec2 p) {
  return pcg(p.x ^ pcg(p.y * 374761393u + 668265263u));
}

float hash3(ivec3 p) {
  uint h = pcg(uint(p.x) * 374761393u ^ pcg(uint(p.y) * 668265263u ^ pcg(uint(p.z) * 2147483647u)));
  return float(h & 0xffffffu) / 16777216.0;
}

float vnoise3(vec3 p) {
  ivec3 i = ivec3(floor(p));
  vec3 f = fract(p);
  vec3 u = f * f * (3.0 - 2.0 * f);
  float n000 = hash3(i + ivec3(0, 0, 0));
  float n100 = hash3(i + ivec3(1, 0, 0));
  float n010 = hash3(i + ivec3(0, 1, 0));
  float n110 = hash3(i + ivec3(1, 1, 0));
  float n001 = hash3(i + ivec3(0, 0, 1));
  float n101 = hash3(i + ivec3(1, 0, 1));
  float n011 = hash3(i + ivec3(0, 1, 1));
  float n111 = hash3(i + ivec3(1, 1, 1));
  float nx00 = mix(n000, n100, u.x);
  float nx10 = mix(n010, n110, u.x);
  float nx01 = mix(n001, n101, u.x);
  float nx11 = mix(n011, n111, u.x);
  return mix(mix(nx00, nx10, u.y), mix(nx01, nx11, u.y), u.z);
}

const mat2 ROT36 = mat2(1.62, 1.18, -1.18, 1.62);

float fbm3(vec3 p) {
  float v = 0.0;
  float amp = 0.52;
  for (int i = 0; i < 4; i++) {
    v += amp * (vnoise3(p) * 2.0 - 1.0);
    p.xz = ROT36 * p.xz;
    p.y *= 1.98;
    amp *= 0.48;
  }
  return v;
}

mat3 rotX(float a) {
  float c = cos(a), s = sin(a);
  return mat3(1.0, 0.0, 0.0, 0.0, c, -s, 0.0, s, c);
}

mat3 rotZ(float a) {
  float c = cos(a), s = sin(a);
  return mat3(c, -s, 0.0, s, c, 0.0, 0.0, 0.0, 1.0);
}

// Sparse pinpoint starfield: exact single-texel projection per cubemap cell
// guarantees each star hits at most ONE texel (and thus ONE 6x9 glyph tile),
// making blocky ++ clusters mathematically impossible.
float pinpointStars(vec3 dir, vec3 uu, vec3 vv, vec3 ww, float aspect, float time) {
  vec3 ad = abs(dir);
  vec2 faceUv;
  int faceId;
  if (ad.x >= ad.y && ad.x >= ad.z) {
    faceUv = dir.yz / ad.x;
    faceId = dir.x > 0.0 ? 0 : 1;
  } else if (ad.y >= ad.x && ad.y >= ad.z) {
    faceUv = dir.xz / ad.y;
    faceId = dir.y > 0.0 ? 2 : 3;
  } else {
    faceUv = dir.xy / ad.z;
    faceId = dir.z > 0.0 ? 4 : 5;
  }
  const float CELLS = 26.0;
  vec2 g = (faceUv * 0.5 + 0.5) * CELLS;
  ivec2 cell = ivec2(floor(g));
  uint h = pcg2(uvec2(cell + ivec2(faceId * 131 + 17, faceId * 79 + 41)));
  float r0 = float(h & 0xffffu) / 65535.0;
  if (r0 > 0.042) return 0.0;

  // Keep star center strictly inside [0.30, 0.70] so neighboring cells are always >= 3 glyph tiles apart
  vec2 pos = vec2(
    0.30 + 0.40 * (float((h >> 8u) & 0xffu) / 255.0),
    0.30 + 0.40 * (float((h >> 16u) & 0xffu) / 255.0)
  );
  vec2 starFace = ((vec2(cell) + pos) / CELLS) * 2.0 - 1.0;
  vec3 starDir;
  if (faceId == 0) starDir = vec3(1.0, starFace.x, starFace.y);
  else if (faceId == 1) starDir = vec3(-1.0, starFace.x, starFace.y);
  else if (faceId == 2) starDir = vec3(starFace.x, 1.0, starFace.y);
  else if (faceId == 3) starDir = vec3(starFace.x, -1.0, starFace.y);
  else if (faceId == 4) starDir = vec3(starFace.x, starFace.y, 1.0);
  else starDir = vec3(starFace.x, starFace.y, -1.0);
  starDir = normalize(starDir);

  float zProj = dot(starDir, ww);
  if (zProj <= 0.15) return 0.0;
  vec2 pStar = vec2(dot(starDir, uu), dot(starDir, vv)) * (1.85 / zProj);
  vec2 uvStar = vec2(pStar.x / aspect, -pStar.y) * 0.5 + 0.5;
  ivec2 starPx = ivec2(floor(uvStar * vec2(uGrid)));
  if (ivec2(gl_FragCoord.xy) != starPx) return 0.0;

  float mag = float((h >> 24u) & 0xffu) / 255.0;
  float tw = 0.88 + 0.12 * sin(time * (1.1 + mag * 1.4) + r0 * 310.0);
  return (3.6 + 3.1 * mag) * tw;
}

// =========================================================================
// Sculpture 0: Gravitational Singularity (Exact Schwarzschild Ray-Bending)
// =========================================================================
vec4 renderSingularity(vec3 ro, vec3 rd0, vec2 pScreen, vec3 uu, vec3 vv, vec3 ww, float aspect) {
  float rs = 0.44;
  float bCrit = 2.598076 * rs; // ~1.143 apparent shadow radius
  mat3 diskMat = rotX(0.11) * rotZ(0.15);
  mat3 diskInv = transpose(diskMat);

  vec3 p = ro;
  vec3 rd = rd0;
  vec3 hVec = cross(ro, rd0);
  float h2 = dot(hVec, hVec);
  float b = sqrt(h2);

  float accum = 0.0;
  float minR = 100.0;
  bool captured = false;

  for (int i = 0; i < 120; i++) {
    float r2 = dot(p, p);
    float r = sqrt(r2);
    if (r < rs * 1.03) {
      captured = true;
      break;
    }
    if (r > 13.5 && dot(p, rd) > 0.0) break;
    minR = min(minR, r);

    vec3 pT = diskMat * p;
    float dPlane = abs(pT.y);
    float stepLen = clamp(r * 0.068, 0.026, 0.28);
    if (r < 4.2) {
      stepLen = min(stepLen, max(0.022, dPlane * 0.42 + 0.012));
    }

    // Accretion disk volumetric emission with seamless periodic Keplerian spirals
    float rDisk = length(pT.xz);
    if (rDisk > 1.04 && rDisk < 3.65 && dPlane < 0.36) {
      float thick = 0.052 + 0.072 * smoothstep(1.12, 3.45, rDisk);
      float vProf = exp(-(pT.y * pT.y) / (thick * thick));
      float rEnv = smoothstep(1.06, 1.32, rDisk) * smoothstep(3.62, 1.92, rDisk);

      // Pure integer harmonics of phi -> 100% periodic, zero atan branch-cut seam
      float phi = atan(pT.z, pT.x);
      float invR = 1.0 / max(rDisk, 0.55);
      float w = uTime * 1.15;
      float s1 = sin(2.0 * phi + 7.6 * invR - w * 1.08);
      float s2 = sin(3.0 * phi + 13.2 * invR - w * 1.52 + 1.2);
      float s3 = sin(5.0 * phi + 21.0 * invR - w * 2.15 + 2.5);
      float s4 = cos(1.0 * phi + 4.4 * invR - w * 0.72 + 0.6);
      float rings = 0.5 + 0.5 * sin(rDisk * 14.5 - uTime * 0.75 + s1 * 1.15);
      float spiral = 0.54 + 0.24 * s1 + 0.16 * s2 + 0.11 * s3 + 0.09 * s4;
      float filament = clamp(spiral * 0.74 + rings * 0.36, 0.24, 1.32);

      // Hot inner edge boost
      float innerHeat = 1.0 + 1.15 * exp(-pow((rDisk - 1.32) / 0.38, 2.0));

      // Relativistic Doppler beaming (approaching left blazing hot, receding right warm amber)
      vec3 velLocal = normalize(vec3(pT.z, 0.0, -pT.x));
      vec3 velWorld = diskInv * velLocal;
      float doppler = dot(velWorld, -rd);
      float beam = pow(clamp(1.0 + 0.38 * doppler, 0.56, 1.54), 1.48);

      float dens = vProf * rEnv * filament * innerHeat * beam;
      accum += dens * stepLen * 5.2;
    }

    // Exact Schwarzschild null geodesic step (midpoint)
    float invR5 = 1.0 / (r2 * r2 * r + 1e-4);
    vec3 acc = -1.5 * rs * h2 * invR5 * p;
    vec3 rdMid = normalize(rd + acc * (0.5 * stepLen));
    p += rdMid * stepLen;
    rd = normalize(rd + acc * stepLen);
  }

  // Persistent razor-bright inner photon ring hugging the EXACT outer rim of the event horizon shadow.
  // Escaping rays that graze the photon sphere bend sharply (large deflection 1 - dot(rd0, rd)),
  // keeping the photon ring locked to the true shadow boundary with pure obsidian inside.
  float bend = 1.0 - dot(rd0, rd);
  float photonRing = 0.0;
  float ringMask = 0.0;
  if (!captured) {
    float graze = exp(-pow(max(minR - 0.88, 0.0) / 0.24, 2.0));
    float bendRim = smoothstep(0.58, 1.48, bend);
    photonRing = max(bendRim * 6.6, graze * 5.4);
    ringMask = clamp(max(smoothstep(0.75, 1.45, bend), exp(-pow((minR - 0.92) / 0.16, 2.0))), 0.0, 1.0);
  }
  float ringDoppler = 0.96 - 0.20 * clamp(pScreen.x / 0.65, -1.0, 1.0);
  photonRing = min(7.0, photonRing * ringDoppler);

  // Compress volumetric emission gracefully into the 0..7 OKLab ladder
  float diskL = 7.0 * (1.0 - exp(-accum * 0.62));
  float L = min(7.0, max(diskL, photonRing) + min(diskL, photonRing) * 0.30);

  // Sparse pinpoint background stars outside the shadow & bright disk halo
  if (!captured && L < 0.30) {
    float star = pinpointStars(rd0, uu, vv, ww, aspect, uTime);
    float mask = smoothstep(0.32, 0.06, bend);
    L = max(L, star * mask);
  }

  // Clean obsidian floor inside event horizon shadow
  if (captured) {
    L = diskL > 0.38 ? diskL : 0.0;
  }

  // Screen-space contour normals & edge strength for Mode 1 (Contour)
  // Restrict disk contour edges to outer envelope transitions so bright spirals stay density-shaded
  vec2 grad = vec2(dFdx(L), -dFdy(L));
  float gradMag = length(grad);
  vec2 nEdge = gradMag > 1e-4 ? grad / gradMag : vec2(0.0, 1.0);
  float outerEnv = smoothstep(0.35, 1.2, L) * smoothstep(3.8, 1.8, L);
  float edgeStr = smoothstep(0.16, 0.55, gradMag) * outerEnv;

  // Strong analytical radial silhouette normal along the true photon ring edge
  if (ringMask > 0.35) {
    vec2 radN = length(pScreen) > 1e-4 ? normalize(pScreen) : vec2(0.0, 1.0);
    nEdge = normalize(mix(nEdge, radN, ringMask));
    edgeStr = max(edgeStr, ringMask * 0.96);
  }

  return vec4(clamp(L / 7.0, 0.0, 1.0), nEdge.x * 0.5 + 0.5, nEdge.y * 0.5 + 0.5, clamp(edgeStr, 0.0, 1.0));
}

// =========================================================================
// Sculpture 1: Braided (2,3) Twisted Torus Knot SDF
// =========================================================================
float sdTrefoil(vec3 p) {
  float R = 1.24;
  float theta = atan(p.z, p.x);
  float r = length(p.xz) - R;
  vec2 q = vec2(r, p.y);
  float a = 1.5 * theta + uTime * 0.38;
  float c = cos(a), s = sin(a);
  vec2 qr = vec2(c * q.x - s * q.y, s * q.x + c * q.y);
  qr.x = abs(qr.x) - 0.42;
  float phi = atan(qr.y, qr.x);
  float flute = 0.015 * cos(4.0 * phi);
  return (length(qr) - 0.255 - flute) * 0.68;
}

vec3 calcTrefoilNormal(vec3 p) {
  const vec2 e = vec2(0.0022, -0.0022);
  return normalize(
    e.xyy * sdTrefoil(p + e.xyy) +
    e.yyx * sdTrefoil(p + e.yyx) +
    e.yxy * sdTrefoil(p + e.yxy) +
    e.xxx * sdTrefoil(p + e.xxx)
  );
}

vec4 renderTorusKnot(vec3 ro, vec3 rd, vec3 uu, vec3 vv, vec3 ww, float aspect) {
  float t = 0.0;
  float tMax = 14.0;
  bool hit = false;
  int steps = 0;

  // Bounding sphere early-out (knot max radius ~1.98)
  float bProj = dot(ro, rd);
  float cSph = dot(ro, ro) - 2.15 * 2.15;
  float disc = bProj * bProj - cSph;

  if (disc > 0.0) {
    float sDisc = sqrt(disc);
    t = max(0.0, -bProj - sDisc);
    tMax = min(tMax, -bProj + sDisc);
    for (int i = 0; i < 96; i++) {
      steps = i;
      vec3 p = ro + rd * t;
      float d = sdTrefoil(p);
      if (d < 0.0018) {
        hit = true;
        break;
      }
      t += d;
      if (t > tMax) break;
    }
  }

  if (!hit) {
    float star = pinpointStars(rd, uu, vv, ww, aspect, uTime) * 0.85;
    return vec4(clamp(star / 7.0, 0.0, 1.0), 0.5, 0.5, 0.0);
  }

  vec3 p = ro + rd * t;
  vec3 n = calcTrefoilNormal(p);

  // Camera-coupled chiaroscuro lighting so highlights stay sculpted at every yaw
  vec3 L1 = normalize(-uu * 0.54 + vv * 0.68 - ww * 0.50);
  vec3 L2 = normalize(uu * 0.68 - vv * 0.34 + ww * 0.64);

  float diff1 = max(dot(n, L1), 0.0);
  float diff2 = max(dot(n, L2), 0.0);
  float ndv = max(dot(n, -rd), 0.0);
  float fresnel = pow(1.0 - ndv, 2.35);
  float spec = pow(max(dot(reflect(-L1, n), -rd), 0.0), 22.0);

  // Multi-tap normal AO + step-count AO for deep braided crevices
  float ao1 = clamp(sdTrefoil(p + n * 0.14) / 0.14, 0.0, 1.0);
  float ao2 = clamp(sdTrefoil(p + n * 0.34) / 0.34, 0.0, 1.0);
  float stepAo = 1.0 - float(steps) / 96.0 * 0.36;
  float ao = clamp((0.40 + 0.60 * (ao1 * 0.55 + ao2 * 0.45)) * stepAo, 0.20, 1.0);

  float L = clamp(0.42 + (diff1 * 5.25 + diff2 * 1.45 + fresnel * 2.85 + spec * 2.65) * ao, 0.0, 7.0);

  // Screen-space edge normal & silhouette strength for Contour mode
  float nx = dot(n, uu);
  float ny = dot(n, vv);
  float edgeStr = smoothstep(0.50, 0.84, 1.0 - ndv);
  float gL = length(vec2(dFdx(L), dFdy(L)));
  edgeStr = max(edgeStr, smoothstep(0.95, 2.2, gL) * 0.72);

  return vec4(clamp(L / 7.0, 0.0, 1.0), nx * 0.5 + 0.5, ny * 0.5 + 0.5, clamp(edgeStr, 0.0, 1.0));
}

// =========================================================================
// Sculpture 2: Ringed Exoplanet (FBM Bands, Cassini/Encke, Cast Shadows, Moon)
// =========================================================================
vec2 intersectSphere(vec3 ro, vec3 rd, vec3 center, float rad) {
  vec3 oc = ro - center;
  float b = dot(oc, rd);
  float c = dot(oc, oc) - rad * rad;
  float h = b * b - c;
  if (h < 0.0) return vec2(-1.0);
  float sh = sqrt(h);
  return vec2(-b - sh, -b + sh);
}

float ringProfile(float r) {
  if (r < 1.36 || r > 2.58) return 0.0;
  float env = smoothstep(1.36, 1.43, r) * smoothstep(2.58, 2.51, r);
  float cRing = 0.40 + 0.60 * smoothstep(1.52, 1.62, r);
  // Prominent Cassini Division
  float cassini = 1.0 - 0.96 * smoothstep(1.90, 1.94, r) * smoothstep(2.07, 2.03, r);
  // Crisp outer Encke Gap
  float encke = 1.0 - 0.86 * smoothstep(2.35, 2.37, r) * smoothstep(2.42, 2.40, r);
  float ringlets = 0.76 + 0.14 * sin(r * 45.0) + 0.10 * cos(r * 21.0 + 0.7);
  return clamp(env * cRing * cassini * encke * ringlets, 0.0, 1.0);
}

vec4 renderExoplanet(vec3 ro, vec3 rd, vec3 uu, vec3 vv, vec3 ww, float aspect) {
  mat3 tilt = rotX(0.14) * rotZ(0.32);
  mat3 tiltInv = transpose(tilt);

  vec3 roL = tilt * ro;
  vec3 rdL = tilt * rd;

  // Camera-coupled upper-left-front sun so mutual planet/ring cast shadows are always dramatic
  vec3 sunW = normalize(-uu * 0.64 + vv * 0.40 - ww * 0.65);
  vec3 sunL = tilt * sunW;

  const float RP = 1.04;
  const float RM = 0.22;

  // Orbiting moon position in tilted planet frame
  float mAng = uTime * 0.46 + 0.72;
  vec3 moonPosL = vec3(cos(mAng) * 2.94, 0.32 * sin(mAng + 0.5), sin(mAng) * 2.94);

  // Intersect planet, moon, and ring plane
  vec2 hitP = intersectSphere(roL, rdL, vec3(0.0), RP);
  float tP = hitP.x > 0.0 ? hitP.x : 1e5;

  vec2 hitM = intersectSphere(roL, rdL, moonPosL, RM);
  float tM = hitM.x > 0.0 ? hitM.x : 1e5;

  float tR = 1e5;
  float rHitR = 0.0;
  float ringAlpha = 0.0;
  if (abs(rdL.y) > 1e-4) {
    float tr = -roL.y / rdL.y;
    if (tr > 0.0) {
      vec3 pr = roL + rdL * tr;
      float rr = length(pr.xz);
      float rp = ringProfile(rr);
      if (rp > 0.01) {
        tR = tr;
        rHitR = rr;
        ringAlpha = clamp(rp * 0.94, 0.0, 0.96);
      }
    }
  }

  // Evaluate opaque body (planet or moon)
  float bodyL = 0.0;
  vec2 bodyN = vec2(0.0, 1.0);
  float bodyEdge = 0.0;
  float tBody = min(tP, tM);

  if (tP < 1e4 && tP <= tM) {
    vec3 pSurf = roL + rdL * tP;
    vec3 nL = normalize(pSurf);
    vec3 nW = tiltInv * nL;

    // Rotating periodic 3D FBM atmospheric bands (zero longitude seam)
    float lon = atan(nL.z, nL.x) - uTime * 0.22;
    float lat = asin(clamp(nL.y, -1.0, 1.0));
    vec3 sp = vec3(cos(lon) * cos(lat), sin(lat), sin(lon) * cos(lat));
    float warp = fbm3(sp * vec3(2.3, 4.8, 2.3) + vec3(0.0, uTime * 0.05, 0.0)) * 0.20;
    float bands = 0.5 + 0.36 * sin((nL.y + warp) * 19.0) + 0.24 * cos((nL.y * 2.1 - warp) * 11.5);
    float eddies = fbm3(sp * vec3(5.2, 10.5, 5.2)) * 0.24;
    float polarDim = smoothstep(0.98, 0.55, abs(nL.y));
    float albedo = clamp((0.48 + bands * 0.44 + eddies) * (0.74 + 0.26 * polarDim), 0.26, 1.12);

    // Ring cast shadow onto planet clouds (Cassini division lets a sliver of sun through!)
    float ringShadow = 1.0;
    if (abs(sunL.y) > 1e-4) {
      float ts = -pSurf.y / sunL.y;
      if (ts > 0.0) {
        vec3 ps = pSurf + sunL * ts;
        float rsHit = length(ps.xz);
        ringShadow = 1.0 - ringProfile(rsHit) * 0.78;
      }
    }

    float diff = max(dot(nL, sunL), 0.0);
    float term = smoothstep(-0.08, 0.14, dot(nL, sunL));
    float ndv = max(dot(nL, -rdL), 0.0);
    float rim = pow(1.0 - ndv, 2.8) * (0.38 + 0.62 * term);

    bodyL = clamp((diff * albedo * 6.5 * ringShadow) + rim * 2.8 + 0.20 * term, 0.0, 7.0);
    bodyN = vec2(dot(nW, uu), dot(nW, vv));
    bodyEdge = smoothstep(0.60, 0.88, 1.0 - ndv);
  } else if (tM < 1e4) {
    vec3 pSurf = roL + rdL * tM;
    vec3 nL = normalize(pSurf - moonPosL);
    vec3 nW = tiltInv * nL;
    float crat = fbm3(nL * 6.5) * 0.24 + 0.88;
    float diff = max(dot(nL, sunL), 0.0);
    float ndv = max(dot(nL, -rdL), 0.0);
    float rim = pow(1.0 - ndv, 2.2) * smoothstep(-0.1, 0.3, dot(nL, sunL));

    // Planet shadow onto moon if moon passes behind planet
    vec2 mShad = intersectSphere(pSurf, sunL, vec3(0.0), RP);
    float shadowM = (mShad.x > 0.0) ? 0.12 : 1.0;

    bodyL = clamp((diff * crat * 6.4 * shadowM) + rim * 2.8 + 0.24, 0.0, 7.0);
    bodyN = vec2(dot(nW, uu), dot(nW, vv));
    bodyEdge = smoothstep(0.54, 0.84, 1.0 - ndv);
  }

  // Evaluate ring luminance & planet cast shadow onto rings
  float ringL = 0.0;
  vec2 ringN = vec2(0.0, 1.0);
  float ringEdge = 0.0;
  bool ringVisible = (tR < tBody) && (ringAlpha > 0.01);

  if (ringVisible) {
    vec3 pr = roL + rdL * tR;
    // Planet shadow cast across the rings
    vec2 pShad = intersectSphere(pr, sunL, vec3(0.0), RP);
    float shadowR = (pShad.x > 0.0) ? 0.08 : 1.0;

    // Subtle azimuthal phase sparkle + ringlet brightness
    float az = atan(pr.z, pr.x) - uTime * 0.14;
    float shimmer = 0.90 + 0.10 * sin(az * 6.0 + rHitR * 12.0);
    float bBandBoost = 1.0 + 0.32 * smoothstep(1.55, 1.75, rHitR) * smoothstep(1.94, 1.84, rHitR);
    ringL = clamp(ringProfile(rHitR) * 6.5 * bBandBoost * shimmer * shadowR, 0.0, 7.0);

    // Analytical radial screen-space normal for ring & Cassini edges
    vec3 radW = tiltInv * normalize(vec3(pr.x, 0.0, pr.z));
    vec2 rn = vec2(dot(radW, uu), dot(radW, vv));
    ringN = length(rn) > 1e-4 ? normalize(rn) : vec2(0.0, 1.0);
    float edgeOuter = exp(-pow((rHitR - 2.55) / 0.045, 2.0));
    float edgeInner = exp(-pow((rHitR - 1.40) / 0.045, 2.0));
    float edgeCas1 = exp(-pow((rHitR - 1.91) / 0.032, 2.0));
    float edgeCas2 = exp(-pow((rHitR - 2.06) / 0.032, 2.0));
    ringEdge = clamp(max(max(edgeOuter, edgeInner), max(edgeCas1, edgeCas2)) * (0.35 + 0.65 * shadowR), 0.0, 1.0);
  }

  float L = 0.0;
  vec2 nOut = vec2(0.0, 1.0);
  float edgeOut = 0.0;

  if (tBody < 1e4 && ringVisible) {
    L = mix(bodyL, ringL, ringAlpha);
    nOut = normalize(mix(bodyN, ringN, ringAlpha));
    edgeOut = max(bodyEdge * (1.0 - ringAlpha * 0.7), ringEdge);
  } else if (ringVisible) {
    L = ringL;
    nOut = ringN;
    edgeOut = ringEdge;
  } else if (tBody < 1e4) {
    L = bodyL;
    nOut = bodyN;
    edgeOut = bodyEdge;
  } else {
    L = pinpointStars(rd, uu, vv, ww, aspect, uTime);
  }

  return vec4(clamp(L / 7.0, 0.0, 1.0), nOut.x * 0.5 + 0.5, nOut.y * 0.5 + 0.5, clamp(edgeOut, 0.0, 1.0));
}

void main() {
  float aspect = float(uGrid.x) / max(float(uGrid.y), 1.0);
  vec2 uv = (gl_FragCoord.xy / vec2(uGrid)) * 2.0 - 1.0;
  vec2 p = vec2(uv.x * aspect, -uv.y);

  // Portrait framing compensation so wide accretion disks & rings never clip on mobile
  float effDist = uDist * max(1.0, 1.15 / max(aspect, 0.42));
  vec3 ro = effDist * vec3(
    cos(uPitch) * sin(uYaw),
    sin(uPitch),
    cos(uPitch) * cos(uYaw)
  );
  vec3 ww = normalize(-ro);
  vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));
  vec3 vv = cross(uu, ww);
  vec3 rd = normalize(p.x * uu + p.y * vv + 1.85 * ww);

  if (uSculpture == 0) {
    oc = renderSingularity(ro, rd, p, uu, vv, ww, aspect);
  } else if (uSculpture == 1) {
    oc = renderTorusKnot(ro, rd, uu, vv, ww, aspect);
  } else {
    oc = renderExoplanet(ro, rd, uu, vv, ww, aspect);
  }
}`;

          uu[0] * ww[1] - uu[1] * ww[0],
        ];

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const x = c * charW;
            const y = r * charH;

            if (state.mode === 2) {
              // Native Unicode U+2800..U+28FF 2x4 Braille
              let bits = 0;
              let maxVal = 0;
              for (let by = 0; by < 4; by++) {
                for (let bx = 0; bx < 2; bx++) {
                  const sx = ((x + (bx + 0.5) * (charW * 0.5)) / vw) * 2 - 1;
                  const sy = ((y + (by + 0.5) * (charH * 0.25)) / vh) * 2 - 1;
                  const res = evalSample(sx * aspect, -sy, ro, uu, vv, ww, state.time);
                  const val = res.L / 7;
                  if (val > maxVal) maxVal = val;
                  const gx = c * 2 + bx;
                  const gy = r * 4 + by;
                  const th = (BAYER[((gy & 3) << 2) | (gx & 3)] + 0.5) / 16;
                  if (val > 0.04 && Math.pow(val, 0.72) > th * 0.85) {
                    bits |= BRAILLE_BITS[by][bx];
                  }
                }
              }
              if (bits) {
                const tIdx = Math.max(1, Math.min(7, Math.floor(maxVal * 7 + 0.5)));
                buckets[tIdx].push(String.fromCharCode(0x2800 | bits), x, y);
              }
              continue;
            }

            const sx = ((x + charW * 0.5) / vw) * 2 - 1;
            const sy = ((y + charH * 0.5) / vh) * 2 - 1;
            const res = evalSample(sx * aspect, -sy, ro, uu, vv, ww, state.time);
            const m = res.L;
            if (m <= 0.08) continue;

            const th = (BAYER[((r & 3) << 2) | (c & 3)] + 0.5) / 16;
            const md = m + (th - 0.5) * 0.85;
            let rk = 0;
            for (let k = 0; k < 10; k++) if (md > RAMP_TH[k]) rk++;
            let ch = RAMP_CHARS[rk];
            const T = Math.max(0, Math.min(7, Math.floor(m + 0.5)));
            let tIdx = Math.min(T + (T < 5 ? 2 : 1), 7);

            if (state.mode === 1 && res.edge > 0.45 && Math.hypot(res.nx, res.ny) > 0.15) {
              const ang = Math.atan2(-res.nx, res.ny);
              const ca = Math.cos(ang), sa = Math.sin(ang);
              if (Math.abs(ca) > 0.92) ch = res.ny < 0 ? '_' : '-';
              else if (Math.abs(sa) > 0.92) ch = '|';
              else if (sa * ca > 0) ch = '/';
              else ch = '\\';
              tIdx = Math.max(tIdx, 5);
            }

            if (ch !== ' ') {
              buckets[tIdx].push(ch, x, y);
            }
          }
        }

        for (let t = 1; t < 8; t++) {
          const b = buckets[t];
          if (!b.length) continue;
          ctx.fillStyle = LADDER_HEX[t];
          for (let i = 0; i < b.length; i += 3) {
            ctx.fillText(b[i], b[i + 1], b[i + 2]);
          }
        }
      },
    };
  }

  // Initialize WebGL2; if unavailable or shaders fail, clone/replace canvas before 2D fallback (Law 9)
  let activeRenderer = createWebGL2Renderer(canvas);
  if (!activeRenderer) {
    console.error('[3D Orbital Singularity] WebGL2 unavailable; cloning canvas for 2D fallback.');
    const fresh = canvas.cloneNode(false);
    canvas.replaceWith(fresh);
    canvas = fresh;
    activeRenderer = create2DFallbackRenderer(canvas);
  }

  bindCanvasInteractions(canvas);
  updateHud();

  window.addEventListener('resize', () => {
    activeRenderer.resize();
    state.needsRender = true;
  });

  let lastTs = performance.now();

  function frame(ts) {
    requestAnimationFrame(frame);
    if (state.hidden) {
      lastTs = ts;
      return;
    }
    const dt = Math.min(0.05, Math.max(0.001, (ts - lastTs) * 0.001));
    lastTs = ts;

    if (!state.reducedMotion) {
      state.time += dt;
      if (state.autoOrbit && !state.dragging) {
        state.targetYaw += dt * 0.24;
      }
      const ease = 1 - Math.exp(-dt * 9);
      state.yaw += (state.targetYaw - state.yaw) * ease;
      state.pitch += (state.targetPitch - state.pitch) * ease;
      state.dist += (state.targetDist - state.dist) * ease;
      state.hoverX += (state.targetHoverX - state.hoverX) * ease;
      state.hoverY += (state.targetHoverY - state.hoverY) * ease;
      activeRenderer.render();
      state.needsRender = false;
    } else if (state.needsRender) {
      activeRenderer.render();
      state.needsRender = false;
    }
  }

  // Render initial frame immediately (guarantees complete hero frame under reduced-motion)
  activeRenderer.render();
  state.needsRender = false;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
