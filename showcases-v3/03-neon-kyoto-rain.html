    const umbCX = ptrGX;
    const umbCY = ptrGY - umbR * 0.12;

    // Subtle pointer umbrella/wind pocket shimmer dome (only in non-lens mode so lens stays pure!)
    if (S.ptrActive > 0.08 && S.mode !== 'lens') {
      const arcR = Math.round(umbR);
      const x0 = Math.max(0, Math.floor(umbCX - arcR - 3));
      const x1 = Math.min(gw - 1, Math.ceil(umbCX + arcR + 3));
      const y0 = Math.max(0, Math.floor(umbCY - arcR - 3));
      const y1 = Math.min(gh - 1, Math.ceil(umbCY + 3));
      for (let y = y0; y <= y1; y++) {
        for (let x = x0; x <= x1; x++) {
          const dx = x - umbCX, dy = y - umbCY;
          if (dy > 2) continue;
          const d = Math.hypot(dx, dy);
          const rim = Math.abs(d - arcR);
          if (rim < 3.0) {
            const f = (1 - rim / 3.0) * S.ptrActive * 0.92;
            const th = BAYER[((y & 3) << 2) | (x & 3)];
            if (f > th * 0.62) {
              blendCell(pix, mat, lum, x, y, PAL.cyanHot[0], PAL.cyanHot[1], PAL.cyanHot[2], f * 0.85, MAT_SPLASH);
            }
          }
        }
      }
    }

    // Diagonal animated rain streaks
    for (let i = 0; i < activeRain; i++) {
      const rx = S.rainX[i];
      const ry = S.rainY[i];
      const len = Math.max(3, S.rainLen[i] | 0);
      const depth = S.rainDepth[i];

      // Thin rain cleanly inside the sheltered umbrella cone below the cursor dome!
      if (S.ptrActive > 0.08 && S.mode !== 'lens') {
        const dx = rx - umbCX;
        const dy = ry - umbCY;
        if (dy > -umbR * 0.85 && dy < umbR * 1.45 && Math.abs(dx) < umbR * 0.88) {
          const domeY = -Math.sqrt(Math.max(0, umbR * umbR - dx * dx));
          if (dy > domeY) continue;
        }
      }

      const nearBright = (rx < S.leftEdge + 28 || rx > S.rightEdge - 28) && ry > waterY * 0.45 && ry < waterY;
      const baseCol = depth > 1.05 ? PAL.rainBright : PAL.rainDim;
      const rCol = nearBright
        ? [(baseCol[0] + 55) | 0, (baseCol[1] + 22) | 0, baseCol[2]]
        : baseCol;
      const alpha = (0.34 + depth * 0.28) * (S.weather === 'mist' ? 0.68 : 1.0);

      for (let s = 0; s < len; s++) {
        const px = Math.round(rx + s * 0.24);
        const py = Math.round(ry - s);
        if (px < 0 || px >= gw || py < 0 || py >= gh) continue;
        // Keep rain subtle behind hero headline text
        if (py < waterY * 0.35 && dimWeightAt(px, py) > 0.55 && (s & 1) === 1) continue;
        const tipFade = (1 - s / len) * alpha;
        blendCell(pix, mat, lum, px, py, rCol[0], rCol[1], rCol[2], tipFade, MAT_RAIN);
      }
    }

    // 3-frame animated splash rings (· -> o -> v) on canal & roof eaves
    for (let i = 0; i < S.splashes.length; i++) {
      const sp = S.splashes[i];
      const stage = Math.min(2, Math.floor((sp.age / sp.maxAge) * 3));
      const sx = sp.x, sy = sp.y;
      const c = sp.tint;
      if (stage === 0) {
        // Frame 0: crisp central droplet '·'
        setCell(pix, mat, lum, sx, sy, 232, 248, 255, MAT_SPLASH, 244);
      } else if (stage === 1) {
        // Frame 1: expanding tiny ring 'o'
        setCell(pix, mat, lum, sx - 1, sy, c[0], c[1], c[2], MAT_SPLASH, 230);
        setCell(pix, mat, lum, sx + 1, sy, c[0], c[1], c[2], MAT_SPLASH, 230);
        setCell(pix, mat, lum, sx, sy - 1, 224, 244, 255, MAT_SPLASH, 236);
      } else {
        // Frame 2: wider mist scatter 'v'
        blendCell(pix, mat, lum, sx - 2, sy, c[0], c[1], c[2], 0.72, MAT_SPLASH);
        blendCell(pix, mat, lum, sx + 2, sy, c[0], c[1], c[2], 0.72, MAT_SPLASH);
        blendCell(pix, mat, lum, sx, sy + 1, c[0], c[1], c[2], 0.45, MAT_SPLASH);
      }
    }
  }

  /* ---------- Glyph Selection (Material-Aware SCENE_24) ---------- */
  function pickGlyphAndColors(tx, ty) {
    const gw = S.gw, gh = S.gh;
    const x0 = tx * 6, y0 = ty * 9;
    const x1 = Math.min(gw, x0 + 6), y1 = Math.min(gh, y0 + 9);
    const pix = S.pixBuf, mat = S.matBuf, lum = S.lumBuf;

    let sumL = 0, maxL = 0, count = 0;
    let sumR = 0, sumG = 0, sumB = 0, sumW = 0;
    let pkR = 0, pkG = 0, pkB = 0, pkMat = 0;
    let rainCount = 0, splashCount = 0, reflectCount = 0, roofCount = 0, wallCount = 0, bridgeCount = 0;
    let emissiveCount = 0, cloudCount = 0, steamCount = 0;

    for (let y = y0; y < y1; y++) {
      const row = y * gw;
      for (let x = x0; x < x1; x++) {
        const idx = row + x;
        const l = lum[idx] / 255;
        const m = mat[idx];
        const p = pix[idx];
        const r = IS_LE ? (p & 255) : ((p >>> 24) & 255);
        const g = IS_LE ? ((p >>> 8) & 255) : ((p >>> 16) & 255);
        const b = IS_LE ? ((p >>> 16) & 255) : ((p >>> 8) & 255);

        sumL += l;
        count++;

        // Give vibrant emissive materials stronger color voting weight so lanterns/signs/sparks never wash out!
        let w = 0.25 + l * 1.1;
        if (m === MAT_LANTERN || m === MAT_CYAN || m === MAT_CORAL || m === MAT_AMBER || m === MAT_FIREWORK || m === MAT_MOON) {
          w = 3.8 + l * 4.0;
          emissiveCount++;
        } else if (m === MAT_REFLECT) {
          w = 2.4 + l * 2.5;
          reflectCount++;
        } else if (m === MAT_SPLASH) {
          w = 2.8;
          splashCount++;
        } else if (m === MAT_RAIN) {
          w = 1.6;
          rainCount++;
        } else if (m === MAT_ROOF) roofCount++;
        else if (m === MAT_WALL || m === MAT_TRAIN) wallCount++;
        else if (m === MAT_BRIDGE) bridgeCount++;
        else if (m === MAT_CLOUD) cloudCount++;
        else if (m === MAT_STEAM) steamCount++;

        sumR += r * w;
        sumG += g * w;
        sumB += b * w;
        sumW += w;

        if (l > maxL) {
          maxL = l;
          pkR = r; pkG = g; pkB = b;
          pkMat = m;
        }
      }
    }

    const meanL = sumL / Math.max(1, count);
    const invW = 1 / Math.max(0.001, sumW);
    let fgR = sumR * invW, fgG = sumG * invW, fgB = sumB * invW;
    const th = BAYER[((ty & 3) << 2) | (tx & 3)];

    // Default clean deep midnight indigo ground (zero dark void stipple!)
    let bgP = PAL.groundP;
    let gi = 0;

    // 1. Highlight preservation (Law 5): isolated fireworks, stars, splashes, lantern sparks
    if ((pkMat === MAT_FIREWORK || pkMat === MAT_STAR || pkMat === MAT_SPLASH) && (maxL - meanL > 0.22) && maxL > 0.52) {
      gi = pkMat === MAT_FIREWORK ? (maxL > 0.85 ? 8 : 7)  // '*' / '+'
         : pkMat === MAT_SPLASH ? (maxL > 0.85 ? 19 : 18)  // 'o' / 'v'
         : (maxL > 0.84 ? 7 : 1);                           // '+' / '.'
      fgR = pkR; fgG = pkG; fgB = pkB;
    }
    // 2. Dense Emissives (Lanterns, Neon Signs, Shoji Windows, Moon, Train Windows)
    else if (emissiveCount >= 3 || pkMat === MAT_LANTERN || pkMat === MAT_CYAN || pkMat === MAT_CORAL || pkMat === MAT_AMBER || pkMat === MAT_MOON) {
      if (pkMat === MAT_LANTERN) {
        gi = emissiveCount > 14 ? 11 : emissiveCount > 6 ? 19 : 8; // '@' / 'o' / '*'
      } else if (pkMat === MAT_MOON) {
        gi = emissiveCount > 18 ? 11 : 19; // '@' / 'o'
      } else if (pkMat === MAT_CYAN || pkMat === MAT_CORAL) {
        const ramp = [22, 23, 9, 10, 11]; // '[', ']', '#', '%', '@'
        gi = ramp[clamp(Math.floor((meanL * 3.8 + th * 0.9)), 0, ramp.length - 1)];
      } else {
        // Warm amber shoji windows / train windows
        const ramp = [22, 6, 7, 9, 10]; // '[', '=', '+', '#', '%'
        gi = ramp[clamp(Math.floor((meanL * 3.6 + th * 0.8)), 0, ramp.length - 1)];
      }
      // Subtle warm/cyan inner backing on bright cores so signs & windows radiate!
      bgP = packRGB((fgR * 0.20 + 6) | 0, (fgG * 0.18 + 8) | 0, (fgB * 0.20 + 20) | 0);
      fgR = Math.min(255, fgR * 1.12 + 12);
      fgG = Math.min(255, fgG * 1.10 + 10);
      fgB = Math.min(255, fgB * 1.10 + 10);
    }
    // 3. Canal Reflections & Water Waves (vivid liquid color ribbons mirroring lanterns, neon signs, windows & fireworks!)
    else if (y0 >= S.waterY) {
      if (reflectCount >= 2 || maxL > 0.24) {
        const reflL = Math.max(meanL, maxL * 0.62);
        const ramp = [3, 5, 4, 6, 7]; // ':', '-', '~', '=', '+'
        const lv = clamp((reflL * 4.8 + (th - 0.5) * 0.65), 0, ramp.length - 1);
        gi = ramp[Math.floor(lv)];
        if (reflL > 0.22) {
          bgP = packRGB((fgR * 0.14 + 5) | 0, (fgG * 0.14 + 8) | 0, (fgB * 0.18 + 18) | 0);
        }
        fgR = Math.min(255, fgR * 1.42 + 18);
        fgG = Math.min(255, fgG * 1.38 + 16);
        fgB = Math.min(255, fgB * 1.42 + 20);
      } else if (rainCount >= 3) {
        gi = 12; // '/'
      } else if (meanL > 0.08 && (meanL * 4.5) > th) {
        gi = ((tx + ty) & 1) === 0 ? 4 : 5; // subtle dark water '~' / '-'
        fgR = Math.min(255, fgR * 1.42 + 16);
        fgG = Math.min(255, fgG * 1.42 + 20);
        fgB = Math.min(255, fgB * 1.52 + 32);
      } else {
        gi = 0; // clean obsidian-indigo water trough
      }
    }
    // 4. Diagonal Rain Streaks
    else if (rainCount >= 4 && meanL < 0.34) {
      gi = rainCount >= 7 ? 12 : (th > 0.5 ? 21 : 2); // '/' / ';' / ','
      fgR = Math.min(255, fgR * 1.22 + 18);
      fgG = Math.min(255, fgG * 1.24 + 22);
      fgB = Math.min(255, fgB * 1.28 + 30);
    }
    // 5. Architecture: Kawara Roofs, Machiya Walls, Arched Bridge & Viaduct
    else if (roofCount >= 8) {
      const ramp = [17, 12, 13, 6, 9]; // '^', '/', '\', '=', '#'
      gi = ramp[((tx + ty) + Math.floor(meanL * 5)) % ramp.length];
      fgR = Math.min(255, fgR * 1.48 + 18);
      fgG = Math.min(255, fgG * 1.52 + 22);
      fgB = Math.min(255, fgB * 1.65 + 36);
    } else if (bridgeCount >= 8) {
      const ramp = [15, 6, 14, 9]; // '_', '=', '|', '#'
      gi = ramp[clamp(Math.floor(meanL * 4.5 + th * 0.6), 0, ramp.length - 1)];
      fgR = Math.min(255, fgR * 1.45 + 18);
      fgG = Math.min(255, fgG * 1.50 + 22);
      fgB = Math.min(255, fgB * 1.60 + 34);
    } else if (wallCount >= 10) {
      const ramp = [14, 15, 22, 23, 9]; // '|', '_', '[', ']', '#'
      gi = (meanL > 0.06 || ((tx + ty) & 1) === 0) ? ramp[(tx + ty) % 3] : 14;
      fgR = Math.min(255, fgR * 1.38 + 14);
      fgG = Math.min(255, fgG * 1.42 + 18);
      fgB = Math.min(255, fgB * 1.52 + 28);
    }
    // 6. Ramen Steam & Night Clouds
    else if (steamCount >= 4) {
      gi = meanL > 0.28 ? 4 : 3; // '~' / ':'
      fgR = Math.min(255, fgR * 1.2 + 16);
      fgG = Math.min(255, fgG * 1.2 + 18);
      fgB = Math.min(255, fgB * 1.25 + 24);
    } else if (cloudCount >= 8) {
      gi = meanL > 0.24 ? 6 : 4; // '=' / '~'
      fgR = Math.min(255, fgR * 1.28 + 14);
      fgG = Math.min(255, fgG * 1.24 + 12);
      fgB = Math.min(255, fgB * 1.32 + 22);
    }
    // 7. Twilight Indigo-to-Violet-Magenta Sky (Law 3: gate Bayer on m > 0.08 -> ZERO void stipple!)
    else {
      if (meanL <= 0.085) {
        gi = 0; // spotless deep twilight indigo zenith!
      } else {
        const skyT = clamp((meanL - 0.085) / 0.26, 0, 1);
        const lv = skyT * 3.1 + (th - 0.5) * 0.75;
        if (lv < 0.45) gi = 0;
        else if (lv < 1.35) gi = 1; // '.'
        else if (lv < 2.25) gi = 3; // ':'
        else gi = 5;                // '-'
        fgR = Math.min(255, fgR * 1.26 + 16);
        fgG = Math.min(255, fgG * 1.18 + 12);
        fgB = Math.min(255, fgB * 1.28 + 22);
      }
    }

    return { gi, fgP: packRGB(fgR, fgG, fgB), bgP };
  }

  function stampAsciiTile(out, tx, ty, gi, fgP, bgP) {
    const gw = S.gw, gh = S.gh;
    const x0 = tx * 6, y0 = ty * 9;
    const gOff = gi * 35;
    for (let dy = 0; dy < 9; dy++) {
      const py = y0 + dy;
      if (py >= gh) break;
      const row = py * gw;
      const inGlyphY = dy < 7;
      for (let dx = 0; dx < 6; dx++) {
        const px = x0 + dx;
        if (px >= gw) break;
        const lit = inGlyphY && dx < 5 && GLYPH_BITS[gOff + dy * 5 + dx] === 1;
        out[row + px] = lit ? fgP : bgP;
      }
    }
  }

  /* ---------- Composite Final Render Mode & Blit to Device Canvas ---------- */
  function compositeAndBlit() {
    const gw = S.gw, gh = S.gh;
    const out = S.outU32;
    const pix = S.pixBuf, mat = S.matBuf, lum = S.lumBuf;

    if (S.mode === 'ascii') {
      /* === Mode 1: Full-Color 5x7 ASCII Night === */
      const cols = Math.ceil(gw / 6);
      const rows = Math.ceil(gh / 9);
      for (let ty = 0; ty < rows; ty++) {
        for (let tx = 0; tx < cols; tx++) {
          const { gi, fgP, bgP } = pickGlyphAndColors(tx, ty);
          stampAsciiTile(out, tx, ty, gi, fgP, bgP);
        }
      }
    } else if (S.mode === 'lens') {
      /* === Mode 2: Bayer Pixel + Circular Color 5x7 ASCII Lens === */
      out.set(pix);

      if (S.ptrActive > 0.04 && S.ptrX >= 0) {
        const lcx = (S.ptrX / S.vw) * gw;
        const lcy = (S.ptrY / S.vh) * gh;
        const lensRCss = S.vw < 760 ? 84 : 126;
        const lensR = (lensRCss / S.cellCss) * S.ptrActive;
        if (lensR > 8) {
          const tx0 = Math.max(0, Math.floor((lcx - lensR - 6) / 6));
          const tx1 = Math.min(Math.ceil(gw / 6) - 1, Math.ceil((lcx + lensR + 6) / 6));
          const ty0 = Math.max(0, Math.floor((lcy - lensR - 9) / 9));
          const ty1 = Math.min(Math.ceil(gh / 9) - 1, Math.ceil((lcy + lensR + 9) / 9));
          const rimColP = packRGB(122, 247, 255);

          for (let ty = ty0; ty <= ty1; ty++) {
            for (let tx = tx0; tx <= tx1; tx++) {
              const tcx = tx * 6 + 3, tcy = ty * 9 + 4.5;
              const dTile = Math.hypot(tcx - lcx, tcy - lcy);
              if (dTile > lensR + 10) continue;

              const { gi, fgP, bgP } = pickGlyphAndColors(tx, ty);
              const x0 = tx * 6, y0 = ty * 9;
              const gOff = gi * 35;

              for (let dy = 0; dy < 9; dy++) {
                const py = y0 + dy;
                if (py >= gh) break;
                const row = py * gw;
                const inGlyphY = dy < 7;
                for (let dx = 0; dx < 6; dx++) {
                  const px = x0 + dx;
                  if (px >= gw) break;
                  const dist = Math.hypot(px - lcx, py - lcy);
                  const rNorm = dist / lensR;
                  const th = BAYER[((py & 3) << 2) | (px & 3)];
                  const edgeCut = 1.0 - (5.5 / lensR) * th;
                  if (rNorm < edgeCut) {
                    const lit = inGlyphY && dx < 5 && GLYPH_BITS[gOff + dy * 5 + dx] === 1;
                    out[row + px] = lit ? fgP : bgP;
                  } else if (Math.abs(dist - lensR) < 1.35 && th < 0.72) {
                    // Crisp Bayer-dithered optical cyan lens ring!
                    out[row + px] = rimColP;
                  }
                }
              }
            }
          }
        }
      }
    } else {
      /* === Mode 3: True-Color 2x4 Braille Night (with ~1.22x+ dot-area luminance compensation!) === */
      out.fill(PAL.brailleBgP);
      const bCols = Math.floor(gw / 5);
      const bRows = Math.floor(gh / 9);

      for (let byTile = 0; byTile < bRows; byTile++) {
        const yBase = byTile * 9;
        for (let bxTile = 0; bxTile < bCols; bxTile++) {
          const xBase = bxTile * 5;
          for (let by = 0; by < 4; by++) {
            const dotY = yBase + 1 + by * 2;
            const gSubY = byTile * 4 + by;
            for (let bx = 0; bx < 2; bx++) {
              const dotX = xBase + 1 + bx * 2;
              const gSubX = bxTile * 2 + bx;

              // Sample 2x2 sub-block in scene buffer
              let valSum = 0, pk = 0, cR = 0, cG = 0, cB = 0, cW = 0;
              let hasEmissive = false, hasRefl = false, hasArch = false;
              for (let sy = 0; sy < 2; sy++) {
                const yy = Math.min(gh - 1, dotY + sy);
                const sRow = yy * gw;
                for (let sx = 0; sx < 2; sx++) {
                  const xx = Math.min(gw - 1, dotX + sx);
                  const idx = sRow + xx;
                  const l = lum[idx] / 255;
                  const m = mat[idx];
                  const p = pix[idx];
                  const r = IS_LE ? (p & 255) : ((p >>> 24) & 255);
                  const g = IS_LE ? ((p >>> 8) & 255) : ((p >>> 16) & 255);
                  const b = IS_LE ? ((p >>> 16) & 255) : ((p >>> 8) & 255);
                  const em = (m === MAT_LANTERN || m === MAT_CYAN || m === MAT_CORAL || m === MAT_AMBER || m === MAT_FIREWORK || m === MAT_MOON);
                  const rf = (m === MAT_REFLECT);
                  const ar = (m === MAT_ROOF || m === MAT_BRIDGE || m === MAT_WALL || m === MAT_TRAIN);
                  if (em) hasEmissive = true;
                  if (rf) hasRefl = true;
                  if (ar) hasArch = true;
                  // Lift subtle nocturnal silhouettes & liquid reflections so Braille renders full architectural depth!
                  const adjL = em ? Math.min(1, l * 1.15 + 0.14)
                             : rf ? Math.min(1, l * 1.45 + 0.12)
                             : ar ? Math.min(1, l * 1.55 + 0.08)
                             : l;
                  valSum += adjL;
                  if (adjL > pk) pk = adjL;
                  const w = em ? (l + 0.45) * 3.6 : rf ? (l + 0.25) * 2.5 : (l + 0.04);
                  cR += r * w; cG += g * w; cB += b * w; cW += w;
                }
              }

              const val = Math.max(valSum * 0.25, pk * 0.78);
              const th = BAYER[((gSubY & 3) << 2) | (gSubX & 3)];
              const lit = (val > 0.065) && (Math.pow(val, 0.68) > th * 0.72);
              if (lit) {
                const inv = 1 / Math.max(0.001, cW);
                // ~1.22x+ dot-area luminance compensation (3d-sdf-and-braille.md)
                const boost = hasEmissive ? 1.28 : hasRefl ? 1.38 : hasArch ? 1.52 : 1.24;
                const add = hasEmissive ? 18 : hasRefl ? 16 : hasArch ? 18 : 10;
                const dr = Math.min(255, (cR * inv * boost + add) | 0);
                const dg = Math.min(255, (cG * inv * boost + add) | 0);
                const db = Math.min(255, (cB * inv * boost + add + (hasArch ? 12 : 0)) | 0);
                out[dotY * gw + dotX] = packRGB(dr, dg, db);
              }
            }
          }
        }
      }
    }

    offCtx.putImageData(S.outImg, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(offCv, 0, 0, gw, gh, 0, 0, gw * S.cellDev, gh * S.cellDev);
  }

  /* ---------- Resize & Pixel-Locked Grid Synchronization ---------- */
  function resize() {
    const vw = Math.max(1, window.innerWidth);
    const vh = Math.max(1, window.innerHeight);
    let dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 3));
    if (vw * vh * dpr * dpr > MAX_PIXELS) {
      dpr = Math.max(1, Math.sqrt(MAX_PIXELS / (vw * vh)));
    }

    // Crisp integer pixel-locked cell sizing tuned to render mode & viewport!
    const cellCss = S.mode === 'lens' ? (vw < 760 ? 2 : 3) : (vw < 760 ? 1 : 2);
    const cellDev = Math.max(1, Math.round(cellCss * dpr));
    const dw = Math.ceil(vw * dpr);
    const dh = Math.ceil(vh * dpr);

    canvas.width = dw;
    canvas.height = dh;
    canvas.style.width = (dw / dpr) + 'px';
    canvas.style.height = (dh / dpr) + 'px';

    const gw = Math.ceil(dw / cellDev);
    const gh = Math.ceil(dh / cellDev);

    S.vw = vw; S.vh = vh; S.dpr = dpr;
    S.cellCss = cellCss; S.cellDev = cellDev;
    S.dw = dw; S.dh = dh; S.gw = gw; S.gh = gh;

    // Portrait vertical scaling rule (Law 6 & illustrated-scenes.md):
    // Prevents pagodas, viaduct, and machiya roofs from stretching into skinny spikes on 390x844 mobile!
    S.landScale = vw < 760 ? Math.min(gh, gw * 1.18) : gh;
    S.waterY = Math.round(gh * (vw < 760 ? 0.67 : 0.65));
    S.viaductY = S.waterY - Math.round(S.landScale * 0.185);
    S.leftEdge = Math.round(gw * (vw < 760 ? 0.285 : 0.305));
    S.rightEdge = Math.round(gw * (vw < 760 ? 0.715 : 0.695));

    offCv.width = gw;
    offCv.height = gh;

    const total = gw * gh;
    S.basePix = new Uint32Array(total);
    S.baseMat = new Uint8Array(total);
    S.baseLum = new Uint8Array(total);
    S.pixBuf = new Uint32Array(total);
    S.matBuf = new Uint8Array(total);
    S.lumBuf = new Uint8Array(total);
    S.outImg = offCtx.createImageData(gw, gh);
    S.outU32 = new Uint32Array(S.outImg.data.buffer);

    buildDitherTiles(Math.max(2, cellCss));
    readDimRects();
    buildStaticBase();
    initDynamicEntities();

    // Render immediately so mode switch / resize / reduced-motion never flashes blank
    renderScene();
    compositeAndBlit();
  }

  /* ---------- Controls & Interactive Gestures ---------- */
  function setMode(nextMode) {
    if (S.mode === nextMode) return;
    S.mode = nextMode;
    document.querySelectorAll('[data-mode]').forEach((b) => {
      b.classList.toggle('active', b.dataset.mode === nextMode);
    });
    resize();
  }

  function setWeather(nextWeather) {
    S.weather = nextWeather;
    document.querySelectorAll('[data-weather]').forEach((b) => {
      b.classList.toggle('active', b.dataset.weather === nextWeather);
    });
    if (nextWeather === 'festival') {
      // Launch an immediate celebratory twin firework over the pagoda skyline!
      spawnFirework(S.gw * 0.48, S.waterY * 0.28, true);
      spawnFirework(S.gw * 0.66, S.waterY * 0.36, true);
      S.festivalTimer = 2.2;
    }
    if (reducedMotion) {
      renderScene();
      compositeAndBlit();
    }
  }

  document.querySelectorAll('[data-mode]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      setMode(btn.dataset.mode);
    });
  });

  document.querySelectorAll('[data-weather]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      setWeather(btn.dataset.weather);
    });
  });

  // Pointer hover tracking
  window.addEventListener('pointermove', (e) => {
    S.ptrRawX = e.clientX;
    S.ptrRawY = e.clientY;
    if (reducedMotion) {
      S.ptrX = e.clientX;
      S.ptrY = e.clientY;
      S.ptrActive = 1;
      renderScene();
      compositeAndBlit();
    }
  });

  window.addEventListener('pointerleave', () => {
    S.ptrRawX = -999;
    S.ptrRawY = -999;
  });

  // Interactive click magic on canvas: sky -> firework, viaduct -> train, canal -> liquid ripple!
  canvas.addEventListener('click', (e) => {
    const gx = (e.clientX / S.vw) * S.gw;
    const gy = (e.clientY / S.vh) * S.gh;
    const viaductBand = Math.max(12, S.landScale * 0.048);

    if (gy >= S.waterY) {
      spawnRipple(gx, gy);
    } else if (Math.abs(gy - S.viaductY) <= viaductBand && gx > S.leftEdge && gx < S.rightEdge) {
      dispatchTrain();
    } else {
      spawnFirework(gx, gy, true);
    }

    if (reducedMotion) {
      renderScene();
      compositeAndBlit();
    }
  });

  // Keyboard shortcut: Press T to dispatch passing commuter train
  window.addEventListener('keydown', (e) => {
    if (e.key === 't' || e.key === 'T') {
      dispatchTrain();
      if (reducedMotion) {
        renderScene();
        compositeAndBlit();
      }
    }
  });

  window.addEventListener('resize', () => {
    clearTimeout(resize._t);
    resize._t = setTimeout(resize, 90);
  });

  reducedMotionQuery.addEventListener('change', (e) => {
    reducedMotion = e.matches;
    if (!reducedMotion && !rafId) {
      lastTs = performance.now();
      rafId = requestAnimationFrame(loop);
    }
  });

  /* ---------- Animation Loop ---------- */
  let rafId = 0;
  let lastTs = performance.now();

  function loop(now) {
    rafId = 0;
    if (reducedMotion) return;
    if (document.hidden) {
      lastTs = now;
      rafId = requestAnimationFrame(loop);
      return;
    }
    const dt = Math.min(0.05, Math.max(0.001, (now - lastTs) / 1000));
    lastTs = now;

    stepSim(dt);
    renderScene();
    compositeAndBlit();

    rafId = requestAnimationFrame(loop);
  }

  /* ---------- Boot ---------- */
  setupKineticText();
  resize();

  if (reducedMotion) {
    // Richly composed static night frame: train gliding mid-viaduct, swaying lanterns paused, crisp reflections!
    S.t = 1.4;
    S.train.active = true;
    S.train.x = 0.56;
    S.train.dir = 1;
    renderScene();
    compositeAndBlit();
  } else {
    // Start with the golden-windowed train already entering the viaduct corridor for instant visual delight!
    S.train.active = true;
    S.train.x = 0.42;
    S.train.dir = 1;
    lastTs = performance.now();
    rafId = requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
