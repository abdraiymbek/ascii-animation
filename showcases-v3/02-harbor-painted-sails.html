      gs.x += gs.vx * dt;
      gs.y += gs.vy * dt;
    }
  }

  // =========================================================================
  // RESIZE, DOM [data-dim] MEASUREMENT & RENDER LOOP
  // =========================================================================
  function readDimRects() {
    S.dimRects = [];
    document.querySelectorAll('[data-dim]').forEach((el) => {
      const r = el.getBoundingClientRect();
      if (r.width > 0 && r.height > 0) {
        S.dimRects.push({ l: r.left - 8, t: r.top - 6, r: r.right + 8, b: r.bottom + 4 });
      }
    });
  }

  function resize() {
    const maxPixels = 3840 * 2400;
    const vw = Math.max(1, window.innerWidth);
    const vh = Math.max(1, window.innerHeight);
    let dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 3));
    if (vw * vh * dpr * dpr > maxPixels) dpr = Math.max(1, Math.sqrt(maxPixels / (vw * vh)));

    const cellCss = vw < 760 ? 2 : 3;
    const cellDev = Math.max(1, Math.round(cellCss * dpr));
    const dw = Math.ceil(vw * dpr);
    const dh = Math.ceil(vh * dpr);

    canvas.width = dw;
    canvas.height = dh;
    canvas.style.width = (dw / dpr) + 'px';
    canvas.style.height = (dh / dpr) + 'px';

    S.vw = vw; S.vh = vh; S.dpr = dpr;
    S.dw = dw; S.dh = dh;
    S.cellCss = cellCss; S.cellDev = cellDev;
    S.cell = cellDev / dpr;
    S.gw = Math.ceil(dw / cellDev);
    S.gh = Math.ceil(dh / cellDev);

    off.width = S.gw;
    off.height = S.gh;
    S.imgData = offCtx.createImageData(S.gw, S.gh);
    S.buf8 = S.imgData.data;
    S.out32 = new Uint32Array(S.buf8.buffer);
    S.buf32 = new Uint32Array(S.gw * S.gh);
    S.matBuf = new Uint8Array(S.gw * S.gh);
    S.detBuf = new Uint8Array(S.gw * S.gh);

    buildDitherTiles(cellCss);
    buildWorld();
    readDimRects();
  }

  function renderFrame() {
    readDimRects();
    const easeT = S.palT < 1 ? S.palT * S.palT * (3 - 2 * S.palT) : 1;
    const pal = blendPalettes(PALETTES[S.palFrom], PALETTES[S.palTo], easeT);
    renderScene(pal);
    applyColorAscii(pal);

    offCtx.putImageData(S.imgData, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(off, 0, 0, S.gw, S.gh, 0, 0, S.gw * S.cellDev, S.gh * S.cellDev);
  }

  let rafId = 0;
  let lastTs = 0;

  function tick(ts) {
    rafId = 0;
    if (document.hidden) return;
    const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0.016;
    lastTs = ts;

    S.time = (S.time + dt) % 10000;
    if (S.palT < 1) S.palT = Math.min(1, S.palT + dt * 2.8);

    const ease = 1 - Math.exp(-dt * 9);
    const targetParX = S.ptrActive ? (S.ptrTargetX / S.vw - 0.5) * 2 : 0;
    const targetParY = S.ptrActive ? (S.ptrTargetY / S.vh - 0.5) * 2 : 0;
    S.parX += (targetParX - S.parX) * ease;
    S.parY += (targetParY - S.parY) * ease;
    if (S.ptrActive) {
      if (S.ptrX < -1000) { S.ptrX = S.ptrTargetX; S.ptrY = S.ptrTargetY; }
      else {
        S.ptrX += (S.ptrTargetX - S.ptrX) * ease;
        S.ptrY += (S.ptrTargetY - S.ptrY) * ease;
      }
    }
    const targetAlpha = S.ptrActive ? 1 : 0;
    S.ptrLensAlpha += (targetAlpha - S.ptrLensAlpha) * (1 - Math.exp(-dt * 11));

    stepPhysics(dt);
    renderFrame();

    if (!prefersReduced) {
      rafId = requestAnimationFrame(tick);
    }
  }

  function scheduleLoop() {
    if (!prefersReduced && !rafId && !document.hidden) {
      lastTs = 0;
      rafId = requestAnimationFrame(tick);
    }
  }

  // =========================================================================
  // INTERACTIVE CONTROLS & GESTURES (WIND DRAG, SEA WAVE CLICK, HOVER LENS)
  // =========================================================================
  function isParkedCorner(x, y) {
    return x <= 14 && y <= 14;
  }

  window.addEventListener('pointermove', (ev) => {
    const x = ev.clientX, y = ev.clientY;
    if (isParkedCorner(x, y) && !S.dragging) {
      S.ptrActive = false;
      return;
    }
    S.ptrActive = true;
    S.ptrTargetX = x;
    S.ptrTargetY = y;

    if (S.dragging) {
      const dx = x - S.dragLastX;
      const dy = y - S.dragLastY;
      S.dragMoved += Math.hypot(dx, dy);
      S.dragLastX = x;
      S.dragLastY = y;

      const totalDx = x - S.dragStartX;
      const totalDy = y - S.dragStartY;
      S.windTargetX = clamp(totalDx / 70, -3.4, 3.4);
      S.windTargetY = clamp(totalDy / 140, -1.2, 1.2);
      S.windEnergy = 1.0;

      if (Math.hypot(dx, dy) > 4) {
        const cx = x / S.cell;
        const cy = y / S.cell;
        spawnWindGust(cx, cy, clamp(dx * 5.2, -95, 95), clamp(dy * 3.0, -45, 45));
      }
    }
  }, { passive: true });

  canvas.addEventListener('pointerdown', (ev) => {
    if (ev.button !== 0 && ev.pointerType === 'mouse') return;
    S.dragging = true;
    S.dragStartX = ev.clientX;
    S.dragStartY = ev.clientY;
    S.dragLastX = ev.clientX;
    S.dragLastY = ev.clientY;
    S.dragMoved = 0;
    S.ptrActive = true;
    S.ptrTargetX = ev.clientX;
    S.ptrTargetY = ev.clientY;
    canvas.classList.add('dragging');
  });

  window.addEventListener('pointerup', (ev) => {
    if (!S.dragging) return;
    S.dragging = false;
    canvas.classList.remove('dragging');
    const cx = ev.clientX / S.cell;
    const cy = ev.clientY / S.cell;

    if (S.dragMoved < 12) {
      // Direct click: sea creates expanding wave rings, sky launches wheeling gulls
      if (cy >= S.yWater - 2) {
        spawnSeaWaveRing(cx, cy);
      } else {
        spawnSkyGulls(cx, cy);
      }
      if (prefersReduced) renderFrame();
    } else {
      // Release a cluster of crisp wind-gust ribbons along the steered vector
      const vx = clamp(S.windTargetX * 32, -95, 95);
      const vy = clamp(S.windTargetY * 22, -40, 40);
      for (let i = 0; i < 6; i++) {
        spawnWindGust(
          clamp(cx + (pcg2(i, 61) - 0.5) * 48, 8, S.gw - 8),
          clamp(cy + (pcg2(i, 83) - 0.5) * 32, 10, S.gh - 18),
          vx, vy
        );
      }
      if (prefersReduced) renderFrame();
    }
  });

  window.addEventListener('pointerleave', () => {
    if (!S.dragging) S.ptrActive = false;
  });

  // Dock palette switcher
  const palButtons = document.querySelectorAll('[data-pal]');
  palButtons.forEach((btn) => {
    btn.addEventListener('click', () => {
      const next = btn.dataset.pal;
      if (!PALETTES[next]) return;
      if (next !== S.palTo) {
        S.palFrom = S.palTo;
        S.palTo = next;
        S.palT = prefersReduced ? 1 : 0;
      }
      document.body.dataset.pal = next;
      palButtons.forEach((b) => {
        const on = b.dataset.pal === next;
        b.classList.toggle('active', on);
        b.setAttribute('aria-pressed', String(on));
      });
      if (prefersReduced) renderFrame();
    });
  });

  // Dock render mode switcher (Full-Color ASCII vs Pixel + Lens)
  const modeButtons = document.querySelectorAll('[data-mode]');
  modeButtons.forEach((btn) => {
    btn.addEventListener('click', () => {
      const next = btn.dataset.mode;
      if (next !== 'ascii' && next !== 'lens') return;
      S.renderMode = next;
      modeButtons.forEach((b) => {
        const on = b.dataset.mode === next;
        b.classList.toggle('active', on);
        b.setAttribute('aria-pressed', String(on));
      });
      if (prefersReduced) renderFrame();
    });
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    } else {
      scheduleLoop();
    }
  });

  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      resize();
      if (prefersReduced) renderFrame();
    }, 60);
  });

  // Boot
  initKineticWords();
  resize();
  renderFrame();
  scheduleLoop();
})();
</script>
</body>
</html>
